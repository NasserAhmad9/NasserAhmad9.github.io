  else if(id==='speed') initSpeed();
  else if(id==='memory') initMemory();
  else if(id==='fill') initFill();
}

/* --- لعبة المطابقة --- */
function initMatch(){
  const pairs = [
    {t:'الفاعل', d:'الاسم المرفوع المذكور قبله فعله'},
    {t:'المفعول به', d:'الاسم المنصوب الذي يقع عليه فعل الفاعل'},
    {t:'المبتدأ', d:'الاسم المرفوع العاري عن العوامل اللفظية'},
    {t:'الحال', d:'الاسم المنصوب المفسر لما استبهم من الهيئات'},
    {t:'التمييز', d:'الاسم المنصوب المفسر لما استبهم من الذوات'},
    {t:'النائب عن الفاعل', d:'الاسم المرفوع الذي لم يذكر معه فاعله'}
  ];
  const area = document.getElementById('gameArea');
  const defs = shuffle(pairs.map(p=>p.d));
  let sel = null;
  area.innerHTML = `<div class="matchGrid"><div id="mc1" style="display:flex;flex-direction:column;gap:6px"></div><div id="mc2" style="display:flex;flex-direction:column;gap:6px"></div></div><div id="mm" style="text-align:center;margin-top:10px;font-weight:700;color:var(--accent);min-height:24px"></div>`;
  const c1 = document.getElementById('mc1');
  const c2 = document.getElementById('mc2');
  pairs.forEach(p=>{ const el=document.createElement('div'); el.className='matchItem'; el.textContent=p.t; el.dataset.t=p.t; c1.appendChild(el); });
  defs.forEach(d=>{ const el=document.createElement('div'); el.className='matchItem'; el.textContent=d; el.dataset.d=d; c2.appendChild(el); });
  c1.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('matched')) return;
    c1.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected'); sel=el.dataset.t;
  });
  c2.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{
    if(!sel || el.classList.contains('matched')) return;
    const cdef = pairs.find(p=>p.t===sel)?.d;
    if(el.dataset.d===cdef){
      el.classList.add('matched');
      c1.querySelector(`[data-t="${sel}"]`).classList.add('matched');
      document.getElementById('mm').textContent='✓ إجابة صحيحة!';
      setTimeout(()=>{ if(document.getElementById('mm')) document.getElementById('mm').textContent=''; },1200);
    } else {
      document.getElementById('mm').textContent='✗ حاول مرة أخرى';
      setTimeout(()=>{ if(document.getElementById('mm')) document.getElementById('mm').textContent=''; },1200);
    }
    sel=null; c1.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('selected'));
  });
}

/* --- لعبة الترتيب --- */
function initArrange(){
  const sents = [
    ['الكلامُ','هو','اللفظُ','المركبُ','المفيدُ','بالوضعِ'],
    ['الفاعلُ','هو','الاسمُ','المرفوعُ','المذكورُ','قبله','فعلُه'],
    ['المبتدأُ','هو','الاسمُ','المرفوعُ','العارِي','عن','العواملِ','اللفظيةِ'],
    ['الحالُ','هو','الاسمُ','المنصوبُ','المفسرُ','لما','استبهم','من','الهيئاتِ'],
    ['لا','إله','إلا','الله'],
    ['إن','تجلس','أجلس']
  ];
  const area = document.getElementById('gameArea');
  const s = sents[Math.floor(Math.random()*sents.length)];
  const words = shuffle([...s]);
  let target=[];
  function render(){
    area.innerHTML = `<div class="arrangeTgt" id="at"></div><div class="arrangeSrc" id="as"></div>
      <div style="text-align:center;margin-top:10px"><button class="btn btnP" onclick="checkArr()">تحقق</button> <button class="btn btnS" onclick="initArrange()">🔄 جديد</button></div>
      <div id="am" style="text-align:center;margin-top:10px;font-weight:700;color:var(--accent);min-height:24px"></div>`;
    document.getElementById('at').innerHTML = target.map((w,i)=>`<span class="arrWord" onclick="rmArr(${i})">${w}</span>`).join('');
    document.getElementById('as').innerHTML = words.map(w=>`<span class="arrWord ${target.includes(w)?'used':''}" onclick="addArr('${w.replace(/'/g,"\\'")}')">${w}</span>`).join('');
  }
  window.addArr = (w)=>{ if(!target.includes(w)){ target.push(w); render(); } };
  window.rmArr = (i)=>{ target.splice(i,1); render(); };
  window.checkArr = ()=>{
    const t = target.join(' ').replace(/\s+/g,' ').trim();
    const candidates = sents.map(x=>x.join(' ').replace(/\s+/g,' ').trim());
    const msg = document.getElementById('am');
    if(candidates.includes(t)){ msg.textContent='✓ أحسنت! ترتيب صحيح'; msg.style.color='#28a745'; }
    else { msg.textContent='✗ الترتيب غير صحيح، حاول مرة أخرى'; msg.style.color='#dc3545'; }
  };
  render();
}

/* --- لعبة تخمين الباب --- */
function initGuess(){
  const pool = [];
  CHAPTERS.forEach(ch=>{
    if(ch.nazm) ch.nazm.forEach(v=>pool.push({v, ch}));
    if(ch.alfia) ch.alfia.forEach(v=>pool.push({v, ch}));
  });
  const area = document.getElementById('gameArea');
  if(!pool.length){ area.innerHTML='<p>لا توجد أبيات</p>'; return; }
  const item = pool[Math.floor(Math.random()*pool.length)];
  const opts = shuffle([item.ch.title, ...CHAPTERS.map(c=>c.title).filter(t=>t!==item.ch.title).slice(0,3)]);
  let html = `<div class="qzText" style="white-space:pre-line">«${item.v[0]} ${item.v[1]?'❁ '+item.v[1]:''}»</div><div class="qzOpts">`;
  opts.forEach(o=>html += `<div class="qzOpt" onclick="checkGuess(this, '${esc(o).replace(/'/g,"\\'")}', '${esc(item.ch.title).replace(/'/g,"\\'")}')">${esc(o)}</div>`);
  html += `</div><div id="gm" style="text-align:center;margin-top:10px;font-weight:700;min-height:24px"></div>`;
  area.innerHTML = html;
}
function checkGuess(el, chosen, correct){
  document.querySelectorAll('#gameArea .qzOpt').forEach(o=>{ o.style.pointerEvents='none'; if(o.textContent.trim()===correct) o.classList.add('correct'); });
  const m = document.getElementById('gm');
  if(chosen===correct){ el.classList.add('correct'); m.textContent='✓ إجابة صحيحة'; m.style.color='#28a745'; }
  else { el.classList.add('wrong'); m.textContent='✗ الإجابة الصحيحة: '+correct; m.style.color='#dc3545'; }
  setTimeout(()=>{ if(document.getElementById('gameArea')) initGuess(); }, 2200);
}

/* --- لعبة السرعة --- */
function initSpeed(){
  const area = document.getElementById('gameArea');
  const pool = [];
  CHAPTERS.forEach(ch=>{ if(ch.qas) ch.qas.forEach(qa=>pool.push({q:qa.q, a:stripHTML(qa.a).substring(0,80), ch})); });
  if(pool.length<10){ area.innerHTML='<p>تحتاج أسئلة أكثر</p>'; return; }
  const allAnswers = pool.map(x=>x.a);
  let score=0, time=60, cur=null, playing=true;
  function newQ(){
    cur = pool[Math.floor(Math.random()*pool.length)];
    const wrongs = shuffle(allAnswers.filter(a=>a!==cur.a)).slice(0,3);
    const opts = shuffle([cur.a, ...wrongs]);
    area.innerHTML = `<div style="text-align:center;margin-bottom:10px"><span class="timer" id="spT">⏱ ${time}</span> <span class="timer" style="background:#d4edda;color:#155724">✓ ${score}</span></div>
      <div class="speedQ"><div class="word">${esc(cur.q)}</div><div class="speedOpts" id="so"></div></div>
      <div id="sm" style="text-align:center;margin-top:10px;font-weight:700;min-height:24px"></div>`;
    const so = document.getElementById('so');
    opts.forEach(o=>{ const el=document.createElement('div'); el.className='speedOpt'; el.textContent=o.substring(0,60); el.onclick=()=>pick(el, o); so.appendChild(el); });
  }
  function pick(el, o){
    if(!playing) return;
    if(o===cur.a){ score++; el.style.background='#d4edda'; el.style.color='#155724'; document.getElementById('sm').textContent='✓ +1'; }
    else { el.style.background='#f8d7da'; el.style.color='#721c24'; document.getElementById('sm').textContent='✗'; }
    setTimeout(()=>{ if(playing) newQ(); }, 300);
  }
  newQ();
  const tid = setInterval(()=>{
    time--;
    const t = document.getElementById('spT');
    if(t) t.textContent = `⏱ ${time}`;
    if(time<=0){ clearInterval(tid); playing=false; area.innerHTML = `<div style="text-align:center;padding:30px 0"><div style="font-size:3rem">🎉</div><div style="font-size:2rem;color:var(--accent);font-weight:700;margin:10px 0">${score}</div><div style="color:var(--muted);margin-bottom:16px">نقطة في 60 ثانية</div><button class="btn btnP" onclick="initSpeed()">🔄 جديدة</button></div>`; }
  }, 1000);
}

/* --- لعبة الذاكرة --- */
function initMemory(){
  const pairs = [
    {t:'الفاعل',d:'المرفوع'},
    {t:'المفعول به',d:'المنصوب'},
    {t:'المبتدأ',d:'العارِي'},
    {t:'الحال',d:'الهيئة'},
    {t:'التمييز',d:'الذات'},
    {t:'كان',d:'ترفع وتنصب'}
  ];
  const cards = [];
  pairs.forEach((p,i)=>{ cards.push({pair:i, text:p.t}); cards.push({pair:i, text:p.d}); });
  const shuffled = shuffle(cards);
  const area = document.getElementById('gameArea');
  area.innerHTML = `<div style="text-align:center;margin-bottom:8px;color:var(--muted);font-size:.8rem">اعثر على الأزواج المتشابهة</div><div class="memoryGrid" id="mg"></div>`;
  const mg = document.getElementById('mg');
  let flipped = [], matched=0, lock=false;
  shuffled.forEach((c,idx)=>{
    const el = document.createElement('div');
    el.className='mCard'; el.dataset.idx=idx;
    el.innerHTML = `<div class="front">?</div><div class="back">${c.text}</div>`;
    el.onclick = ()=>{
      if(lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      el.classList.add('flipped'); flipped.push({el, c});
      if(flipped.length===2){
        lock=true;
        if(flipped[0].c.pair===flipped[1].c.pair){
          flipped.forEach(x=>x.el.classList.add('matched'));
          matched++;
          flipped=[]; lock=false;
          if(matched===pairs.length) setTimeout(()=>{ area.innerHTML=`<div style="text-align:center;padding:30px 0"><div style="font-size:3rem">🏆</div><div style="margin:12px 0;color:var(--accent);font-size:1.2rem;font-weight:700">أحسنت!</div><button class="btn btnP" onclick="initMemory()">🔄 جديدة</button></div>`; }, 500);
        } else {
          setTimeout(()=>{ flipped.forEach(x=>x.el.classList.remove('flipped')); flipped=[]; lock=false; }, 800);
        }
      }
    };
    mg.appendChild(el);
  });
}

/* --- لعبة أكمل الفراغ --- */
function initFill(){
  const sentences = [
    {s:'الفاعل هو الاسم ___ المذكور قبله فعله', a:'المرفوع', wrongs:['المنصوب','المجرور','المجزوم']},
    {s:'المفعول به هو الاسم ___ الذي يقع عليه الفعل', a:'المنصوب', wrongs:['المرفوع','المجرور','المجزوم']},
    {s:'الحال هو الاسم المفسر لما استبهم من ___', a:'الهيئات', wrongs:['الذوات','الأعداد','المقادير']},
    {s:'التمييز هو الاسم المفسر لما استبهم من ___', a:'الذوات', wrongs:['الهيئات','الأعداد','المقادير']},
    {s:'علامات الرفع أربعة: الضمة والواو والألف و___', a:'النون', wrongs:['الياء','الكسرة','الفتحة']},
    {s:'علامات النصب خمس: الفتحة والألف والكسرة والياء و___', a:'حذف النون', wrongs:['السكون','الثقل','الضمة']},
    {s:'علامات الخفض ثلاث: الكسرة والياء و___', a:'الفتحة', wrongs:['السكون','الضمة','النون']},
    {s:'علامات الجزم اثنتان: السكون و___', a:'الحذف', wrongs:['الفتحة','الكسرة','الضمة']}
  ];
  const area = document.getElementById('gameArea');
  const q = sentences[Math.floor(Math.random()*sentences.length)];
  const opts = shuffle([q.a, ...q.wrongs]);
  area.innerHTML = `<div class="qzText" style="white-space:pre-line">${q.s}</div><div class="qzOpts" id="fo"></div><div id="fm" style="text-align:center;margin-top:10px;font-weight:700;min-height:24px"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn btnS" onclick="initFill()">🔄 سؤال جديد</button></div>`;
  const fo = document.getElementById('fo');
  opts.forEach(o=>{
    const el = document.createElement('div'); el.className='qzOpt'; el.textContent=o;
    el.onclick = ()=>{
      fo.querySelectorAll('.qzOpt').forEach(x=>x.style.pointerEvents='none');
      const m = document.getElementById('fm');
      if(o===q.a){ el.classList.add('correct'); m.textContent='✓ إجابة صحيحة'; m.style.color='#28a745'; }
      else { el.classList.add('wrong'); m.textContent='✗ الإجابة الصحيحة: '+q.a; m.style.color='#dc3545'; }
    };
    fo.appendChild(el);
  });
}

/* ============================================================
   الإعدادات
   ============================================================ */
function renderSettings(){
  const c = document.getElementById('v-settings');
  const colors = [
    {id:'brown',n:'بني',c1:'#8b4513',c2:'#b8860b'},{id:'green',n:'أخضر',c1:'#2d6a4f',c2:'#52b788'},
    {id:'blue',n:'أزرق',c1:'#1d4e89',c2:'#4895ef'},{id:'purple',n:'بنفسجي',c1:'#5a189a',c2:'#9d4edd'},
    {id:'teal',n:'تركوازي',c1:'#006d77',c2:'#2a9d8f'},{id:'rose',n:'وردي',c1:'#a4133c',c2:'#ff4d6d'}
  ];
  const fonts = ['Amiri','Scheherazade New','Lateef','Noto Naskh Arabic','Cairo','Reem Kufi'];
  const fn = {'Amiri':'أميري','Scheherazade New':'شهرزاد','Lateef':'لطيف','Noto Naskh Arabic':'نسخ','Cairo':'القاهرة','Reem Kufi':'ريم كوفي'};
  c.innerHTML = `<div class="chHead"><h2>⚙️ الإعدادات</h2></div>
    <div class="setCard"><h3>📏 حجم الخط</h3>
      <div class="setRow"><span class="setLbl">الحجم:</span><div class="setCtrl">
        <button class="fsBtn" onclick="chFs(-1)">−</button><span class="fsVal" id="fsVal">${SETTINGS.fontSize}px</span><button class="fsBtn" onclick="chFs(1)">+</button>
        <input type="range" min="13" max="28" value="${SETTINGS.fontSize}" id="fsSl" style="flex:1;min-width:100px;accent-color:var(--accent)">
      </div></div>
    </div>
    <div class="setCard"><h3>🔤 نوع الخط</h3>
      <div class="setRow"><span class="setLbl">الخط:</span>
        <select class="setSel" id="fontSel" style="width:100%;max-width:none">${fonts.map(f=>`<option value="${f}" ${SETTINGS.fontFamily===f?'selected':''}>${fn[f]}</option>`).join('')}</select>
      </div>
    </div>
    <div class="setCard"><h3>🎨 اللون</h3>
      <div class="setRow"><span class="setLbl">اللون:</span><div class="colorSw">
        ${colors.map(cc=>`<div class="colSw ${SETTINGS.color===cc.id?'active':''}" onclick="setColor('${cc.id}')" title="${cc.n}" style="background:linear-gradient(135deg,${cc.c1},${cc.c2})"></div>`).join('')}
      </div></div>
    </div>
    <div class="setCard"><h3>🌓 الوضع</h3>
      <div class="setRow"><span class="setLbl">الوضع:</span>
        <div style="display:flex;gap:6px">
          <button class="miniBtn ${SETTINGS.theme==='light'?'active':''}" onclick="setTheme('light')" style="${SETTINGS.theme==='light'?'background:var(--accent);color:#fff':''}">☀️ نهاري</button>
          <button class="miniBtn ${SETTINGS.theme==='dark'?'active':''}" onclick="setTheme('dark')" style="${SETTINGS.theme==='dark'?'background:var(--accent);color:#fff':''}">🌙 ليلي</button>
        </div>
      </div>
    </div>
    <div class="setCard"><h3>⚙️ إجراءات</h3>
      <button class="btn btnS" onclick="resetSettings()">🔄 إعادة الافتراضي</button>
    </div>`;
  document.getElementById('fsSl').addEventListener('input', e=>{ SETTINGS.fontSize=parseInt(e.target.value,10); applySettings(); saveSettings(); document.getElementById('fsVal').textContent=SETTINGS.fontSize+'px'; });
  document.getElementById('fontSel').addEventListener('change', e=>{ SETTINGS.fontFamily=e.target.value; applySettings(); saveSettings(); });
}
function chFs(d){ SETTINGS.fontSize=Math.max(13,Math.min(28,SETTINGS.fontSize+d)); applySettings(); saveSettings(); const el=document.getElementById('fsVal'); if(el) el.textContent=SETTINGS.fontSize+'px'; const sl=document.getElementById('fsSl'); if(sl) sl.value=SETTINGS.fontSize; }
function setColor(id){ SETTINGS.color=id; applySettings(); saveSettings(); renderSettings(); }
function setTheme(t){ SETTINGS.theme=t; applySettings(); saveSettings(); updateThemeIcons(); renderSettings(); }
function resetSettings(){ SETTINGS={...DEFAULT_SETTINGS}; applySettings(); saveSettings(); updateThemeIcons(); renderSettings(); showToast('تم إعادة الإعدادات'); }

/* ============================================================
   التنقل بين الصفحات
   ============================================================ */
function switchView(v){
  STATE.currentView=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('.nBtn').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  if(v==='reader') renderReader();
  else if(v==='favs') renderFavs();
  else if(v==='quiz') renderQuiz();
  else if(v==='games'){ STATE.activeGame=null; STATE.playAll=null; renderGames(); }
  else if(v==='settings') renderSettings();
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('side').style.display = v==='reader' ? '' : 'none';
  document.querySelector('main').style.marginRight = v==='reader' ? '' : '0';
}
function closeMobileSidebar(){ document.getElementById('side').classList.remove('open'); document.getElementById('sideClose').style.display='none'; }
function updateThemeIcons(){ const d=SETTINGS.theme==='dark'; document.getElementById('icMoon').style.display=d?'none':'block'; document.getElementById('icSun').style.display=d?'block':'none'; }

/* ============================================================
   التهيئة
   ============================================================ */
(function init(){
  loadSettings(); loadFavorites(); updateThemeIcons();
  document.querySelectorAll('.nBtn').forEach(btn=>btn.addEventListener('click', ()=>switchView(btn.dataset.v)));
  document.getElementById('themeBtn').addEventListener('click', ()=>{ SETTINGS.theme=SETTINGS.theme==='dark'?'light':'dark'; applySettings(); saveSettings(); updateThemeIcons(); });
  document.getElementById('sideToggle').addEventListener('click', ()=>{ const s=document.getElementById('side'); const o=s.classList.toggle('open'); document.getElementById('sideClose').style.display=o?'flex':'none'; });
  document.getElementById('sideClose').addEventListener('click', closeMobileSidebar);
  document.getElementById('toTop').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
  window.addEventListener('scroll', ()=>{ document.getElementById('toTop').classList.toggle('show', window.scrollY>500); }, {passive:true});
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeMobileSidebar(); closeGame(); } });
  renderReader();
  document.getElementById('loader').classList.add('hidden');
})();
</script>
