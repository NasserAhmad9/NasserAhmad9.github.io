"nazm":[["إِذَا حَذَفْتَ فِي الكَلَامِ فَاعِلَا","مُخْتَصَرًا أَوْ مُبْهَمًا أَوْ جَاهِلَا"],["فَأَوْجِبِ التَّأْخِيرَ لِلْمَفْعُولِ بِهْ","وَارْفَعْ حَيْثُ نَابَ عَنْهُ فَانْتَبِهْ"]],
"alfia":[["وَالْمَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ مَرْفُوعٌ"]],
"qas":[
{"q":"ما هو اسم آخر لهذا الباب؟","a":"باب المفعول الذي لم يُسمَّ فاعله (المتقدمون)، وباب نائب الفاعل (المتأخرون)."},
{"q":"ما الذي تفعله في الفعل عند إسناده للنائب عن الفاعل؟","a":"الماضي: ضم أوله وكسر ما قبل آخره. المضارع: ضم أوله وفتح ما قبل آخره."},
{"q":"ما الذي تفعله في المفعول إذا أقمته مقام الفاعل؟","a":"ترفعه، وتُعطيه أحكام الفاعل."},
{"q":"أعرب: يُحترم العالم. أُهين الجاهل.","a":"يُحترم: مضارع مبني للمجهول مرفوع بالضمة. العالم: نائب فاعل مرفوع. — أُهين: ماضٍ مبني للمجهول. الجاهل: نائب فاعل مرفوع."},
{"q":"حوِّل إلى المبني للمجهول: قطع محمود زهرة. اشترى أخي كتابًا. قرأ إبراهيم درسه.","a":"قُطِعَتِ الزهرة. اشتُرِيَ كتابٌ. قُرِئَ الدرس."},
{"q":"اجعل نائب فاعل: الطبيب، النمر، النهر، الفأر، الحصان، الكتاب، القلم.","a":"أُكرِمَ الطبيب. رُئِيَ النمر. عُبِرَ النهر. قُتِلَ الفأر. رُكِبَ الحصان. قُرِئَ الكتاب. كُسِرَ القلم."},
{"q":"ابنِ للمجهول وأضف نائب فاعل: يكرم، يقطع، يعبر، يأكل، يركب، يقرأ، يبري.","a":"يُكرَم الطالب المجتهد. يُقطَع غصن الشجرة. يُعبَر النهر. يُؤكَل التمر. يُركَب الجمل. يُقرأ الكتاب. يُبرَى القلم."},
{"q":"أعرب: خُلق الإنسان ضعيفًا. يُرسل عليكما شواظ. قضيت الصلاة.","a":"خُلق: ماضٍ مبني للمجهول. الإنسان: نائب فاعل مرفوع. ضعيفًا: حال منصوب. — يُرسل: مضارع مبني للمجهول. شواظ: نائب فاعل. — قضيت: ماضٍ مبني للمجهول. الصلاة: نائب فاعل مرفوع بضمة مقدرة (مناسبة)."}
]},
{"id":"mubtada","title":"المبتدأ والخبر",
"matn":"المُبْتَدَأُ هُوَ الاسْمُ المَرْفُوعُ العَارِي عَنِ العَوَامِلِ اللَّفْظِيَّةِ. وَالخَبَرُ هُوَ الاسْمُ المَرْفُوعُ المُسْنَدُ إِلَيْهِ.",
"nazm":[["المُبْتَدَا اسْمٌ مِنْ عَوَامِلٍ سَلِمَ","لَفْظِيَّةٍ وَهُوَ بِرَفْعٍ قَدْ وُسِمَ"],["وَالخَبَرُ الاسْمُ الَّذِي قَدْ أُسْنِدَا","إِلَيْهِ وَالرَّفْعَ الْتَزِمْهُ أَبَدَا"]],
"alfia":[["مُبْتَدَأٌ زَائِدٌ مُسْنَدٌ إِلَيْهِ","وَالْخَبَرُ الْمُسْنَدُ نَفْعًا فِيهِ"]],
"qas":[
{"q":"ما هو المبتدأ؟ وما هو الخبر؟","a":"المبتدأ: الاسم المرفوع العاري عن العوامل اللفظية. الخبر: الاسم المرفوع المسند إليه."},
{"q":"أعرب: محمد قائم. محمد حضر أبوه. محمد أبوه مسافر. محمد في الدار. محمد عندك. الزيدان قائمان. الزيدون قائمون. زيد أخوك. الكافرون هم الظالمون.","a":"محمد: مبتدأ. قائم: خبر. — محمد: مبتدأ. حضر: ماضٍ. أبوه: فاعل مرفوع بالواو، والجملة خبر. — محمد: مبتدأ أول. أبوه: مبتدأ ثانٍ مرفوع بالواو. مسافر: خبر المبتدأ الثاني، والجملة خبر الأول. — محمد: مبتدأ. في الدار: جار ومجرور متعلقان بمحذوف خبر. — محمد: مبتدأ. عندك: ظرف متعلق بمحذوف خبر. — الزيدان: مبتدأ مرفوع بالألف. قائمان: خبر مرفوع بالألف. — الزيدون: مبتدأ مرفوع بالواو. قائمون: خبر مرفوع بالواو. — زيد: مبتدأ. أخوك: خبر مرفوع بالواو. — الكافرون: مبتدأ مرفوع بالواو. هم: ضمير فصل. الظالمون: خبر مرفوع بالواو."},
{"q":"بيِّن المبتدأ والخبر ونوعهما والرابط من: المجتهد يفوز بغايته. السائقان يشتدان في السير. النخلة تؤتي أكلها. المؤمنات يسبحن الله. كتابك نظيف. هذا القلم من خشب. الصوف يؤخذ من الغنم.","a":"المجتهد: اسم ظاهر — يفوز بغايته: جملة فعلية — الرابط: الضمير المستتر في يفوز. السائقان: اسم ظاهر — يشتدان: جملة فعلية — الرابط: ألف الاثنين. النخلة: اسم ظاهر — تؤتي أكلها: جملة فعلية — الرابط: الضمير المستتر. المؤمنات: اسم ظاهر — يسبحن الله: جملة فعلية — الرابط: نون النسوة. كتابك: اسم ظاهر — نظيف: مفرد. هذا: اسم إشارة — من خشب: شبه جملة. الصوف: اسم ظاهر — يؤخذ: جملة فعلية — الرابط: الضمير المستتر."},
{"q":"استعمل مبتدأً في جملتين (خبر مفرد وخبر جملة): التلميذان، محمد، الثمرة، البطيخ، القلم، الكتاب، المعهد، النيل، عائشة، الفتيات.","a":"التلميذان مجتهدان — التلميذان يذاكران. محمد رسول الله — محمد أُرسل للناس. الثمرة كبيرة — الثمرة سقطت. البطيخ حلو — البطيخ يحبه الناس. القلم سلاح الكاتب — القلم يتسلح به الكاتب. الكتاب موجود — الكتاب أوراقه مقطعة. المعهد مفتوح — المعهد سقطت حوائطه. النيل شريان الحياة — النيل يملأ الأرض بالخيرات. عائشة زوج النبي — عائشة تحب الخير. الفتيات مؤدبات — الفتيات يطلبن العلم."},
{"q":"أخبر عن كل اسم بشبه جملة: العصفور، الجوخ، الإسكندرية، القاهرة، الكتاب، الكرسي، نهر النيل.","a":"العصفور في الحديقة — الجوخ من الصوف — الإسكندرية على شاطئ البحر — القاهرة عند جبل المقطم — الكتاب في القمطر — الكرسي من الخشب — نهر النيل في الجهة الغربية من القاهرة."},
{"q":"ضَعْ لكل جار ومجرور مبتدأً: في القفص، عند جبل المقطم، من الخشب، على شاطئ البحر، من الصوف، في القمطر، في الجهة الغربية من القاهرة.","a":"العصفور في القفص — القاهرة عند جبل المقطم — الكرسي من الخشب — الإسكندرية على شاطئ البحر — الجوخ من الصوف — الكتاب في القمطر — نهر النيل في الجهة الغربية من القاهرة."},
{"q":"كوِّن ثلاث جمل في وصف الجمل تشتمل كل واحدة على مبتدأ وخبر.","a":"الجمل سفينة الصحراء. الجمل يُتوضأ من أكل لحمه. الجمل في مبركه."},
{"q":"إلى كم قسم ينقسم المبتدأ؟","a":"ظاهر ومضمر. الظاهر: ما دلّ لفظه على مسماه بلا قرينة. المضمر: ما دلّ على مسماه بقرينة تكلم أو خطاب أو غيبة."},
{"q":"مَثِّل للمبتدأ الظاهر والمضمر.","a":"الظاهر: ﴿مُحَمَّدٌ رَسُولُ اللَّهِ﴾. المضمر: ﴿وَنَحْنُ خَلَقْنَاهُمْ﴾."},
{"q":"إلى كم قسم ينقسم المضمر الواقع مبتدأً؟","a":"اثنا عشر ضميرًا: أنا، نحن، أنت، أنتِ، أنتما، أنتم، أنتنَّ، هو، هي، هما، هم، هنَّ. ولا تقع هذه الضمائر المتصلة مبتدأً."},
{"q":"إلى كم قسم ينقسم الخبر الجملة؟","a":"جملة اسمية (أبوه كريم) وجملة فعلية (سافر أبوه)."},
{"q":"إلى كم قسم ينقسم الخبر شبه الجملة؟","a":"جار ومجرور (في المسجد) وظرف (فوق الغصن)."},
{"q":"ما الذي يربط الخبر الجملة بالمبتدأ؟","a":"قد يكون الرابط: 1- ضميرًا يعود على المبتدأ (﴿بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ﴾ — الضمير هم). 2- إشارة إلى المبتدأ (﴿وَلِبَاسُ التَّقْوَى ذَلِكَ خَيْرٌ﴾). 3- إعادة المبتدأ بلفظه (﴿فَأَصْحَابُ الْمَيْمَنَةِ مَا أَصْحَابُ الْمَيْمَنَةِ﴾). 4- لفظ عام يشتمل على المبتدأ (محمد نعم الرجل). ولا يحتاج إلى رابط إذا كانت الجملة نفس المبتدأ في المعنى (نطقي الله حسبي)."},
{"q":"في أي شيء تجب مطابقة الخبر للمبتدأ؟","a":"في التذكير والتأنيث، والجمع والإفراد والتثنية."},
{"q":"مَثِّل لكل نوع من أنواع الخبر بمثالين.","a":"المفرد: ﴿نِسَاؤُكُمْ حَرْثٌ لَكُمْ﴾، ﴿وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ﴾. الجملة الفعلية: ﴿وَاللَّهُ يَسْمَعُ تَحَاوُرَكُمَا﴾، ﴿اللَّهُ يَجْمَعُ بَيْنَنَا﴾. الجملة الاسمية: ﴿وَالَّذِينَ كَفَرُوا بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ﴾، ﴿أَعْمَالُهُمْ كَسَرَابٍ﴾. الجار والمجرور: ﴿سِيمَاهُمْ فِي وُجُوهِهِمْ﴾، ﴿وَفِي السَّمَاءِ رِزْقُكُمْ﴾. الظرف: ﴿وَالرَّكْبُ أَسْفَلَ مِنْكُمْ﴾، «الجنة تحت أقدام الأمهات»."},
{"q":"كيف تعرب «زيد» في: زيد قائم، قام زيد؟","a":"في الأولى: مبتدأ مرفوع بالابتداء. في الثانية: فاعل مرفوع. والسبب اختلاف العامل: الأول معنوي (الابتداء)، والثاني لفظي (الفعل)."}
]},
{"id":"nawasikh","title":"النواسخ",
"matn":"العَوَامِلُ الدَّاخِلَةُ عَلَى المُبْتَدَأِ وَالخَبَرِ ثَلَاثَةُ أَشْيَاءَ: كَانَ وَأَخَوَاتُهَا، وَإِنَّ وَأَخَوَاتُهَا، وَظَنَنْتُ وَأَخَوَاتُهَا.",
"nazm":[["وَرَفْعُكَ الاسْمَ وَنَصْبُكَ الخَبَرْ","بِهَذِهِ الأَفْعَالِ حُكْمٌ مُعْتَبَرْ"],["عَمَلُ كَانَ عَكْسُهُ لِإِنَّ أَنْ","لَكِنَّ لَيْتَ وَلَعَلَّ وَكَأَنْ"],["أَنْصِبْ بِأَفْعَالِ القُلُوبِ مُبْتَدَا","وَخَبَرًا وَهْيَ ظَنَنْتُ وَجَدَا"]],
"alfia":[["وَكَانَ وَأَخَوَاتُهَا تَرْفَعُ الِاسْمَ","وَتَنْصِبُ الْخَبَرَ وَهَذَا حُكْمُهَا"],["وَإِنَّ وَأَخَوَاتُهَا تَنْصِبُ الِاسْمَ","وَتَرْفَعُ الْخَبَرَ وَهَذَا رَسْمُهَا"]],
"qas":[
{"q":"إلى كم قسم تنقسم النواسخ؟","a":"ثلاثة: كان وأخواتها (ترفع المبتدأ وتنصب الخبر)، وإن وأخواتها (تنصب المبتدأ وترفع الخبر)، وظننت وأخواتها (تنصب المبتدأ والخبر مفعولين)."},
{"q":"ادخل كان أو إحدى أخواتها على: الجو صحو. الحارس مستيقظ. الهواء طلق. الحديقة مثمرة. البستاني منتبه. القراءة مفيدة. الصدق نافع. الشمس حارة. الزكاة واجبة. البرد قارس.","a":"كان الجو صحوًا — ما برح الحارس مستيقظًا — أصبح الهواء طلقًا — ما زالت الحديقة مثمرة — ما فتئ البستاني منتبهًا — ما انفكت القراءة مفيدة — ظل الصدق نافعًا — صارت الزكاة واجبة — أضحت الشمس حارة — أمسى البرد قارسًا."},
{"q":"ادخل إن أو إحدى أخواتها على: أبي حاضر. كتابك جديد. محبرتك قذرة. يدك نظيفة. قلمك مكسور. الكتاب خير رفيق. الأدب حميد. البطيخ يظهر في الصيف. البرتقال من فواكه الشتاء. القطن سبب ثروة مصر.","a":"ليت أبي حاضر — لعل كتابك جديد — لعل محبرتك قذرة — ليت يدك نظيفة — كأن قلمك مكسور — علمتُ أن الكتاب خير رفيق — علمتُ أن الأدب حميد — إن البطيخ يظهر في الصيف — إن البرتقال من فواكه الشتاء — لعل القطن سبب ثروة مصر."},
{"q":"ادخل ظن أو إحدى أخواتها على: محمد صديقك. أبوك أحب الناس إليك. أمك أرأف الناس بك. الحقل ناضر. البستان مثمر. الصيف قائظ. الأصدقاء أعوانك عند الشدة. الصمت زين. الثياب البيضاء لبوس الصيف. عشرة اللسان أشد من عثرة الرجل.","a":"حسبتُ محمدًا صديقك — علمتُ أباك أحبَّ الناس إليك — رأيتُ أمّك أرأف الناس بك — ظننتُ الحقل ناضرًا — خلتُ البستان مثمرًا — علمتُ الصيف قائظًا — رأيتُ الأصدقاء أعوانك — زعمتُ الصمت زينًا — اتخذتُ الثياب البيضاء لبوس الصيف — وجدتُ عشرةَ اللسان أشدَّ من عثرة الرجل."},
{"q":"ما الذي تعمله كان وأخواتها؟","a":"ترفع المبتدأ (اسمها) وتنصب الخبر (خبرها)."},
{"q":"إلى كم قسم تنقسم أخوات كان من جهة العمل؟ ومن جهة التصرف؟","a":"من جهة العمل: 1- يرفع وينصب بلا شرط (ثمانية: كان، أمسى، أصبح، أضحى، ظل، بات، صار، ليس). 2- يعمل بشرط النفي أو شبهه (أربعة: زال، برح، فتئ، انفك). 3- يعمل بشرط «ما» المصدرية الظرفية (دام). — من جهة التصرف: 1- يتصرف تصرفًا مطلقًا (سبعة: كان، أمسى، أصبح، أضحى، ظل، بات، صار). 2- يتصرف ناقصًا (أربعة: فتئ، انفك، برح، زال). 3- لا يتصرف أصلًا (ليس، ودام على الأصح)."},
{"q":"ما الذي تعمله إن وأخواتها؟","a":"تنصب المبتدأ (اسمها) وترفع الخبر (خبرها)."},
{"q":"ما الذي تدل عليه كأن وليت؟","a":"كأن: تشبيه اسمها بخبرها. ليت: التمني (طلب المستحيل أو العسير)."},
{"q":"ما معنى الاستدراك والترجي والتوقع؟","a":"الاستدراك: إتباع الكلام السابق بنفي ما يُتوهم ثبوته أو إثبات ما يُتوهم نفيه. الترجي: طلب الأمر المحبوب الممكن. التوقع: انتظار وقوع المكروه."},
{"q":"ما الذي تعمله ظن وأخواتها؟","a":"تنصب المبتدأ (مفعولها الأول) والخبر (مفعولها الثاني)."},
{"q":"إلى كم قسم تنقسم أخوات ظن من حيث معناها؟","a":"أربعة: 1- ما يفيد الترجيح (ظننت، حسبت، خلت، زعمت). 2- ما يفيد اليقين (رأيت، علمت، وجدت). 3- ما يفيد التصيير (اتخذت، جعلت). 4- ما يفيد السمع (سمعت)."},
{"q":"ما الذي يشترط في «رأى» حتى تنصب مفعولين؟","a":"أن تكون بمعنى «علم» أو «ظن» أو «حلم» (رأى في منامه)."},
{"q":"هات ثلاث جمل من مبتدأ وخبر ثم أدخل عليها كان ولعل وزعمت.","a":"﴿وَاللَّهُ يَقْضِي بِالْحَقِّ﴾ — كان الله يقضي بالحق — لعل عبد الله يقضي بالحق — زعمتُ عبد الله يقضي بالحق. — «أنتم أصحابي» — كنتم أصحابي — لعلكم أصحابي — زعمتُكم أصحابي. — «الظلم مرتعه وخيم» — كان الظلم مرتعه وخيم — لعل الظلم مرتعه وخيم — زعمتُ الظلم مرتعه وخيم."},
{"q":"أعرب: إن إبراهيم كان أمة. كأن القمر مصباح. حسبت المال نافعًا. ما زال الكتاب رفيقي. كان المسجل سليمًا.","a":"إن: توكيد ونصب. إبراهيم: اسم إن منصوب. كان: ماضٍ ناقص اسمه ضمير مستتر. أمة: خبر كان منصوب، والجملة خبر إن. — كأن: تشبيه ونصب. القمر: اسم كأن منصوب. مصباح: خبر كأن مرفوع. — حسبت: فعل وفاعل. المال: مفعول به أول. نافعًا: مفعول به ثانٍ. — ما: نافية. زال: ماضٍ ناقص. الكتاب: اسم زال مرفوع. رفيقي: خبر زال منصوب بفتحة مقدرة (مناسبة). — كان: ماضٍ ناقص. المسجل: اسم كان مرفوع. سليمًا: خبر كان منصوب."},
{"q":"ما معنى إشفاق لعل؟ وما معانيها الأخرى؟","a":"الإشفاق: توقع المكروه. وتأتي أيضًا للترجي (لعل الله يحدث بعد ذلك أمرًا)، وللتعليل (فقولا له قولًا لينًا لعله يتذكر)، وللاستفهام (وما يدريك لعله يزكى)."},
{"q":"أعرب: ليتني كنت معهم. واتخذ الله إبراهيم خليلًا. لعلي أبلغ الأسباب. ظل وجهه مسودًا.","a":"ليتني: ليت حرف تمنٍّ ونصب، والنون للوقاية، والياء اسم ليت. كنت: كان ماضٍ ناقص، والتاء اسم كان. معهم: ظرف مكان خبر كان. والجملة خبر ليت. — اتخذ: ماضٍ ينصب مفعولين. الله: فاعل. إبراهيم: مفعول به أول. خليلًا: مفعول به ثانٍ. — لعلي: لعل واسمها. أبلغ: مضارع مرفوع والفاعل أنا. الأسباب: مفعول به. والجملة خبر لعل. — ظل: ماضٍ ناقص. وجهه: اسم ظل مرفوع، ووجه مضاف والهاء مضاف إليه. مسودًا: خبر ظل منصوب. وهو كظيم: جملة اسمية معطوفة."}
]},
{"id":"naat","title":"النعت",
"matn":"النَّعْتُ تَابِعٌ لِمَنْعُوتِهِ فِي رَفْعِهِ، وَنَصْبِهِ، وَخَفْضِهِ، وَتَعْرِيفِهِ، وَتَنْكِيرِهِ.",
"nazm":[["النَّعْتُ قَدْ قَالَ ذَوُو الأَلْبَابِ","يَتْبَعُ لِلْمَنْعُوتِ فِي الإِعْرَابِ"],["كَذَاكَ فِي التَّعْرِيفِ وَالتَّنْكِيرِ"]],
"alfia":[["يَتْبَعُ فِي الْإِعْرَابِ وَالتَّعْرِيفِ","وَالنَّكِرَاتِ وَالتَّذْكِيرِ وَالتَّأْنِيثِ"]],
"qas":[
{"q":"ما هو النعت؟","a":"التابع المشتق أو المؤول بالمشتق، لاسم يتبعه في الإعراب والتعريف والتنكير، موضح لمتبوعه في المعارف، مخصص له في النكرات."},
{"q":"إلى كم قسم ينقسم النعت؟","a":"قسمان: الحقيقي (الرافع لضمير مستتر يعود على المنعوت)، والسببي (الرافع لاسم ظاهر متصل به ضمير يعود على المنعوت)."},
{"q":"ما هي الأشياء التي يتبع فيها النعت الحقيقي منعوته؟","a":"أربعة من عشرة: واحد من الإفراد والتثنية والجمع، وواحد من ألقاب الإعراب، وواحد من التذكير والتأنيث، وواحد من التعريف والتنكير."},
{"q":"ما هي الأشياء التي يتبع فيها النعت السببي منعوته؟","a":"اثنان من خمسة: واحد من الرفع والنصب والخفض، وواحد من التعريف والتنكير. ويتبع مرفوعه الذي بعده في التذكير والتأنيث. ولا يتبع شيئًا في الإفراد والتثنية والجمع، بل يكون مفردًا دائمًا."},
{"q":"ما هي المعرفة؟","a":"خمسة: الضمير، والعلم، واسم الإشارة، والاسم المعرف بالألف واللام، وما أضيف إلى واحد منها. والنكرة: كل اسم شائع في جنسه لا يختص به واحد دون آخر، وتقريبه: كل ما صلح دخول الألف واللام عليه."},
{"q":"مَثِّل لكل من الضمير والعلم واسم الإشارة والاسم الموصول بثلاثة أمثلة.","a":"الضمير: ﴿هُوَ الَّذِي يُسَيِّرُكُمْ﴾، ﴿يَوْمَ هُمْ بَارِزُونَ﴾، ﴿إِنَّنِي أَنَا اللَّهُ﴾. العلم: ﴿وَاللَّهُ يَقْبِضُ وَيَبْسُطُ﴾، ﴿وَبَشَّرْنَاهُ بِإِسْحَاقَ﴾، ﴿وَإِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً﴾. اسم الإشارة: ﴿وَهَذَا ذِكْرٌ مُبَارَكٌ﴾، ﴿فَذَانِكَ بُرْهَانَانِ﴾، ﴿هَؤُلَاءِ بَنَاتِي﴾. الاسم الموصول: ﴿رَبَّنَا أَرِنَا الَّذَيْنِ أَضَلَّانَا﴾، ﴿وَاللَّاتِي تَخَافُونَ نُشُوزَهُنَّ﴾، ﴿وَالَّذِي جَاءَ بِالصِّدْقِ﴾."},
{"q":"أعرب: الكتاب جليس ممتع. الطالب المجتهد يحبه أستاذه. الفتيات المهذبات يخدمن بلادهن. شربتُ من الماء العذب. أكرمتُ الرجل العاقل. جاء الفتى الشجاع. مررتُ بالقاضي العادل.","a":"الكتاب: مبتدأ مرفوع. جليس: خبر مرفوع. ممتع: نعت لجليس مرفوع. — الطالب: مبتدأ مرفوع. المجتهد: نعت مرفوع. يحبه: مضارع + هاء مفعول به. أستاذه: فاعل مرفوع، والجملة خبر. — الفتيات: مبتدأ مرفوع. المهذبات: نعت مرفوع. يخدمن: مضارع مبني على السكون (نون النسوة). بلادهن: مفعول به منصوب. — شربتُ: فعل وفاعل. من الماء: جار ومجرور. العذب: نعت مجرور. — أكرمتُ: فعل وفاعل. الرجل: مفعول به منصوب. العاقل: نعت منصوب. — جاء: ماضٍ. الفتى: فاعل مرفوع بضمة مقدرة. الشجاع: نعت مرفوع. — مررتُ: فعل وفاعل. بالقاضي: جار ومجرور بكسرة مقدرة. العادل: نعت مجرور."},
{"q":"هات مثالًا لنعت لمنعوت مذكر موصوف به غير المنعوت وهو مؤنث، ثم أعربه.","a":"مررتُ بمحمدٍ القائمةِ أمُّه. بمحمدٍ: جار ومجرور. القائمة: نعت سببي لمحمد مجرور. أمه: فاعل للقائمة مرفوع، وأم مضاف والهاء مضاف إليه."}
]},
{"id":"atf","title":"العطف",
"matn":"حُرُوفُ العَطْفِ عَشَرَةٌ: الوَاوُ، وَالفَاءُ، وَثُمَّ، وَأَوْ، وَأَمْ، وَإِمَّا، وَبَلْ، وَلَا، وَلَكِنْ، وَحَتَّى فِي بَعْضِ المَوَاضِعِ.",
"nazm":[["هَذَا وَإِنَّ العَطْفَ أَيْضًا تَابِعُ","حُرُوفُهُ عَشَرَةٌ يَا سَامِعُ"]],
"alfia":[["وَحُرُوفُ الْعَطْفِ عَشَرَةٌ","الْوَاوُ وَالْفَاءُ وَثُمَّ وَأَوْ"]],
"qas":[
{"q":"ما هو العطف؟ وما هي حروفه؟","a":"العطف قسمان: عطف البيان (التابع الجامد الموضح لمتبوعه في المعارف المخصص له في النكرات)، وعطف النسق (التابع الذي يتوسط بينه وبين متبوعه أحد حروف العطف). وحروف العطف عشرة: الواو، الفاء، ثم، أو، أم، إما، بل، لا، لكن، حتى في بعض المواضع."},
{"q":"ما معنى الفاء وثم وأو وبل ولا ولكن؟","a":"الفاء: التشريك والترتيب والتعقيب. ثم: التشريك والترتيب والتراخي. أو: الشك والتخيير والإباحة. بل: الإضراب. لا: نفي ما سبق. لكن: الاستدراك."},
{"q":"ما معاني الواو وأم وإما؟","a":"الواو: التشريك والتسوية، ولا تستلزم الترتيب. أم: تكون متصلة (بعد همزة التسوية أو الاستفهام) ومنقطعة (بمعنى «بل»). إما: للتخيير والإباحة بعد الطلب، والشك والإبهام بعد الخبر."},
{"q":"ما الذي يشترط للعطف بـ«بل» و«لكن»؟","a":"«بل»: أن يكون المعطوف بها مفردًا لا جملة، وألا يسبقها استفهام. «لكن»: أن يكون المعطوف بها مفردًا، وأن يتقدمها نفي أو نهي، وألا تقترن بالواو."},
{"q":"فيم يشترك المعطوف والمعطوف عليه؟","a":"في الحكم الإعرابي؛ فالمعطوف تابع للمعطوف عليه."},
{"q":"ما الفرق بين «لكن» المخففة و«لكنَّ» المشددة؟","a":"«لكنَّ» من أخوات «إنَّ» (تنصب المبتدأ وترفع الخبر). «لكن» المخففة لا عمل لها، حرف ابتداء (إن وليها جملة) أو عاطفة (إن وليها اسم مفرد)."},
{"q":"ما الفرق بين «أكلتُ السمكةَ حتى رأسَها» (بفتح السين) و«أكلتُ السمكةِ حتى رأسِها» (بكسر السين)؟","a":"في الأول: حتى حرف عطف، ورأسَها معطوفة منصوبة، والمعنى: أكلت الرأس أيضًا. في الثاني: حتى حرف جر بمعنى إلى، والرأس غير مأكول."},
{"q":"ما معاني «أو»؟","a":"الشك، والتخيير، والإباحة، والإبهام (التحيير)."},
{"q":"ما معاني «بل» و«لا» و«لكن»؟","a":"بل: الإضراب (إبطال ما سبق وإثبات ما بعدها). لا: نفي ما سبق. لكن: الاستدراك."},
{"q":"أعرب: ما رأيتُ محمدًا لكن وكيله. زارنا أخوك وصديقه. أخي يأكل ويشرب كثيرًا. أقبل زيد وعمرو. أقبل الرجل والفتى.","a":"ما: نافية. رأيتُ: فعل وفاعل. محمدًا: مفعول به. لكن: حرف عطف للاستدراك. وكيله: معطوف على محمدًا منصوب، ووكيل مضاف والهاء مضاف إليه. — زارنا: ماضٍ + نا مفعول به. أخوك: فاعل مرفوع بالواو. وصديقه: الواو عطف، صديقه معطوف مرفوع، وصديق مضاف والهاء مضاف إليه. — أخي: مبتدأ مرفوع بضمة مقدرة. يأكل: مضارع مرفوع، والفاعل مستتر، والجملة خبر. ويشرب: الواو عطف، يشرب معطوف مرفوع. كثيرًا: مفعول به. — أقبل: ماضٍ. زيد: فاعل مرفوع. وعمرو: الواو عطف، عمرو معطوف مرفوع. — أقبل: ماضٍ. الرجل: فاعل مرفوع. والفتى: الواو عطف، الفتى معطوف مرفوع بضمة مقدرة."},
{"q":"أعرب: قام زيد لا عمرو. ما فهم درس النحو لكن درس الفقه. ما مررتُ بزيد بل عمرو.","a":"قام: ماضٍ. زيد: فاعل مرفوع. لا: حرف عطف. عمرو: معطوف مرفوع. — ما: نافية. فهم: ماضٍ. درس: مفعول به منصوب، ودرس مضاف. النحو: مضاف إليه مجرور. لكن: حرف عطف للاستدراك. درس: معطوف منصوب. الفقه: مضاف إليه مجرور. — ما: نافية. مررتُ: فعل وفاعل. بزيد: جار ومجرور. بل: حرف عطف. عمرو: معطوف مجرور."},
{"q":"أعرب: ﴿ثُمَّ بَعَثْنَا مِنْ بَعْدِهِمْ مُوسَى وَهَارُونَ﴾.","a":"ثم: حرف عطف. بعثنا: ماضٍ + نا فاعل. من بعدهم: جار ومجرور، وبعد مضاف وهم مضاف إليه. موسى: مفعول به منصوب بفتحة مقدرة (تعذر). وهارون: الواو عطف، هارون معطوف منصوب بالفتحة (ممنوع من الصرف — العلمية والعجمة، ولم يُنوَّن)."}
]},
{"id":"tawkid","title":"التوكيد",
"matn":"التَّوْكِيدُ تَابِعٌ لِلْمُؤَكَّدِ فِي رَفْعِهِ، وَنَصْبِهِ، وَخَفْضِهِ، وَتَعْرِيفِهِ.",
"nazm":[["وَيَتْبَعُ المُؤَكَّدَ التَّوْكِيدُ فِي","رَفْعٍ وَنَصْبٍ ثُمَّ خَفْضٍ فَاعْرِفِ"]],
"alfia":[["وَالنَّفْسُ وَالْعَيْنُ وَكُلٌّ وَأَجْمَعُ","وَتَابِعُ الْأَجْمَعِ وَالْأَبْتَعُ"]],
"qas":[
{"q":"ما هو التوكيد؟ وإلى كم قسم ينقسم؟","a":"التابع المقوي لمتبوعه. وهو قسمان: لفظي (بتكرار اللفظ أو مرادفه)، ومعنوي (بالنفس والعين وكل وأجمع وتوابعها)."},
{"q":"مَثِّل بثلاثة أمثلة للتوكيد اللفظي.","a":"في الاسم: جاء محمد محمد. في الفعل: جاء جاء محمد. في الحرف: نعم نعم جاء محمد. أو بمرادفه: جاء حضَرَ أبو بكر."},
{"q":"ما الألفاظ التي تستعمل في التوكيد المعنوي؟","a":"النفس، والعين، وكل، وأجمع، وتوابع أجمع (أكتع، وأبتع، وأبصع)."},
{"q":"ما الذي يشترط للتوكيد بالنفس والعين؟ وبكل وجميع؟","a":"بالنفس والعين: إضافتهما إلى ضمير عائد على المؤكد (جاء عليٌّ نفسه — جاء الرجال أنفسهم). وبكل وجميع: إضافتهما إلى ضمير مطابق للمؤكد."},
{"q":"هل يُستعمل «أجمعون» غير مسبوق بـ«كل»؟","a":"لا يؤكد به غالبًا إلا بعد لفظ «كل»: فتُتبع «كله» بـ«أجمع»، و«كلها» بـ«جمعاء»، و«كلهم» بـ«أجمعين»، و«كلهن» بـ«جُمع». وقد يؤكد بهنَّ وإن لم يتقدم «كل»: ﴿لَأُغْوِيَتْهُمْ أَجْمَعِينَ﴾."},
{"q":"أعرب: قرأتُ الكتاب كله. جاء رجال الجيش كلهم أجمعون. زارنا الوزير نفسه. سلمتُ على أخيك عينه. رأيتُ عمروًا نفسه.","a":"قرأتُ: فعل وفاعل. الكتاب: مفعول به منصوب. كله: كل توكيد للكتاب منصوب، وكل مضاف والهاء مضاف إليه. — جاء: ماضٍ. رجال: فاعل مرفوع، ورجال مضاف. الجيش: مضاف إليه. كلهم: كل توكيد لرجال مرفوع، وكل مضاف والهاء مضاف إليه والميم حرف جمع. أجمعون: توكيد ثانٍ مرفوع بالواو. — زارنا: ماضٍ + نا مفعول به. الوزير: فاعل مرفوع. نفسه: نفس توكيد للوزير مرفوع، ونفس مضاف والهاء مضاف إليه. — سلمتُ: فعل وفاعل. على أخيك: جار ومجرور بكسرة مقدرة... أخي مجرور بالياء، والكاف مضاف إليه. عينه: عين توكيد لأخيك مجرور، وعين مضاف والهاء مضاف إليه. — رأيتُ: فعل وفاعل. عمروًا: مفعول به منصوب. نفسه: نفس توكيد منصوب، والهاء مضاف إليه."}
]},
{"id":"badal","title":"البدل",
"matn":"إِذَا أُبْدِلَ اسْمٌ مِنَ اسْمٍ، أَوْ فِعْلٌ مِنْ فِعْلٍ، تَبِعَهُ فِي جَمِيعِ إِعْرَابِهِ.",
"nazm":[["إِذَا اسْمٌ أُبْدِلَ مِنْ اسْمٍ يُنْحَلْ","إِعْرَابَهُ وَالفِعْلُ أَيْضًا يُبْدَلْ"]],
"alfia":[["وَالْبَدَلُ الْمُبْدَلُ مِنْهُ مَا","مِنْهُ بِحُكْمِ الْإِعْرَابِ قَدْ حُكِمَا"]],
"qas":[
{"q":"ما هو البدل؟","a":"التابع المقصود بالحكم بلا واسطة بينه وبين متبوعه. ويتبع المبدل منه في إعرابه."},
{"q":"إلى كم قسم ينقسم البدل؟","a":"أربعة: بدل كل من كل، وبدل بعض من كل، وبدل اشتمال، وبدل غلط (ويشمل بدل البداء والنسيان والغلط)."},
{"q":"ما الذي يشترط في بدل البعض وبدل الاشتمال؟","a":"أن يضاف إلى ضمير عائد إلى المبدل منه."},
{"q":"مَيِّز أنواع البدل: سرتني أخلاق محمد جارنا. رأيتُ السفينة شراعها. أعجبتني الحديقة أزهارها. هالني الأسد زئيره. شربتُ ماءً عسلًا. ذهبتُ إلى البيت المسجد.","a":"جارنا: بدل كل من كل من محمد. شراعها: بدل بعض من كل من السفينة. أزهارها: بدل اشتمال من الحديقة. زئيره: بدل اشتمال من الأسد. عسلًا: بدل غلط من ماء. المسجد: بدل غلط من البيت."},
{"q":"أعرب: رسول الله محمد خاتم النبيين. عجز العرب عن الإتيان بالقرآن عشر آيات منه. أعجبتني السماء نجومها. أعتقتُ العبد نصفه.","a":"رسول: مبتدأ مرفوع، ورسول مضاف. الله: مضاف إليه مجرور. محمد: بدل من رسول مرفوع. خاتم: خبر مرفوع، وخاتم مضاف. النبيين: مضاف إليه مجرور بالياء. — عجز: ماضٍ. العرب: فاعل مرفوع. عن الإتيان: جار ومجرور. بالقرآن: جار ومجرور. عشر: بدل من القرآن مجرور، وعشر مضاف. آيات: مضاف إليه مجرور. منه: جار ومجرور. — أعجبتني: فعل وفاعل ومفعول. السماء: فاعل مرفوع. نجومها: نجوم بدل اشتمال من السماء مرفوع، ونجوم مضاف، وها مضاف إليه. — أعتقتُ: فعل وفاعل. العبد: مفعول به منصوب. نصفه: نصف بدل بعض من كل منصوب، ونصف مضاف والهاء مضاف إليه."}
]},
{"id":"mafool-bih","title":"المفعول به",
"matn":"المَفْعُولُ بِهِ هُوَ الاسْمُ المَنْصُوبُ الَّذِي يَقَعُ بِهِ الفِعْلُ.",
"nazm":[["مَهْمَا تَرَى اسْمًا وَقَعَ الفِعْلُ بِهِ","فَذَاكَ مَفْعُولٌ فَقُلْ بِنَصْبِهِ"]],
"alfia":[["وَالْمَفْعُولُ بِهِ مَنْصُوبٌ","وَهُوَ الَّذِي يَقَعُ بِهِ الْفِعْلُ"]],
"qas":[
{"q":"ما هو المفعول به؟","a":"الاسم المنصوب الذي يقع عليه فعل الفاعل."},
{"q":"إلى كم قسم ينقسم؟","a":"ظاهر ومضمر. والمضمر: متصل ومنفصل."},
{"q":"ما الذي يجب أن يفصل بين الفعل وياء المتكلم؟","a":"نون تسمى نون الوقاية."},
{"q":"هل يجوز أن تقول: رأيتُ إياهم؟","a":"لا يجوز؛ لأنه يمكن الإتيان بالمتصل، وإذا أمكن المتصل امتنع المنفصل. الصواب: إياهم رأيتُ، أو رأيتُهم."},
{"q":"ضع ضميرًا منفصلًا مفعولًا به: أيها الطلبة ... ينتظر المستقبل. أيتها الفتيات ... ترتقب البلاد. أيها المتقي ... ينتظر أبوك. أيتها الفتاة ... يرجو المصلحون. أيها المؤمنون ... يثيب الله. إن محمدًا قد تأخر ... انتظرتُ طويلًا. هؤلاء الفتيات ... يرجو المصلحون. يا محمد ما انتظرتُ إلا ...","a":"إياكم — إياكنَّ — إياك — إياكِ — إياكم — إياه — إياهنَّ — إياك."},
{"q":"ضع في جملة مفعولًا به: الكتاب، الشجر، القلم، الجبل، الفرس، حذاء، النافذة، البيت.","a":"قرأتُ الكتاب. رأيتُ الشجر. بريتُ القلم. صعدتُ الجبل. ركبتُ الفرس. لبستُ الحذاء. أغلقتُ النافذة. دخلتُ البيت."},
{"q":"حوِّل الضمائر إلى متصلة مفعولًا به: إياهما، إياكم، إياي، إياكنَّ، إياه، إياكما، إيانا.","a":"رأيتُ اللذين ضربهما المدرس. كيف حبسكم الكفار؟ ضربني المدرس. متى ضربكنَّ أبوكُنَّ؟ أينما توجه الكافر لا يأت بخير. انتظركما محمد طويلًا. ضربنا العدو بالطائرات."},
{"q":"هات فاعلًا ومفعولًا: قرأ، يرى، تسلق، ركب، اشترى، سكن، فتح، قتل، صعد.","a":"قرأ التلميذ الدرس. يرى محمد زيدًا. تسلق زيد الشجرة. ركب محمد الفرس. اشترى إبراهيم مصحفًا. سكن عمرو البيت. فتح عمرو بن العاص مصر. قتل المسلمون الكفار. صعد أشرف الجبل."},
{"q":"كوِّن ست جمل: اسمان أحدهما فاعل والآخر مفعول به — محمد، الكتاب، علي، الشجرة، إبراهيم، الحبل، خليل، الماء، أحمد، الرسالة، بكر، المسألة.","a":"قرأ محمد الكتاب. صنع إبراهيم الحبل. أحضر أحمد الرسالة. صعد علي الشجرة. شرب خليل الماء. حل بكر المسألة."},
{"q":"هات سبع جمل فيها ضمير منفصل مفعول به (لا تكرر الضمير).","a":"﴿وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ﴾ — ﴿إِيَّاكَ نَعْبُدُ﴾ — ﴿ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ﴾ — ﴿وَتَبَوَّأْنَا إِلَيْكَ مَا كَانُوا إِيَّانَا يَعْبُدُونَ﴾ — ﴿وَإِيَّايَ فَارْهَبُونِ﴾ — إياكنَّ خاطب الإمام. — إياها تزوج أحمد."},
{"q":"هات سبع جمل فيها ضمير متصل مفعول به (مختلف).","a":"﴿فَاعْبُدُوهُ﴾ — ﴿يَرْزُقُكُمْ﴾ — ﴿لَتَقْتُلَنِي﴾ — ﴿لِأَقْتُلَكَ﴾ — ﴿فَدَلَّاهُمَا﴾ — ﴿فَكَذَّبُوهُ﴾ — ﴿دَمَّرْنَاهُمْ﴾."},
{"q":"ما هو المفعول به لغة واصطلاحًا؟","a":"لغةً: من وقع عليه الفعل. اصطلاحًا: الاسم المنصوب الذي يقع عليه فعل الفاعل."},
{"q":"مَثِّل للمفعول به الظاهر بثلاثة أمثلة.","a":"ضربتُ زيدًا. ركبتُ الفرس. صليتُ المغرب."},
{"q":"كم لفظًا للمضمر المتصل الذي يقع مفعولًا به؟ وما هو المنفصل؟","a":"المتصل: اثنا عشر (الياء، نا، الكاف المفتوحة، الكاف المكسورة، الكاف + الميم والألف، الكاف + الميم، الكاف + النون المشددة، الهاء المضمومة، الهاء + الألف، الهاء + الميم والألف، الهاء + الميم، الهاء + النون المشددة). والمنفصل: اثنا عشر (إياي، إيانا، إياك، إياكِ، إياكما، إياكم، إياكنَّ، إياه، إياها، إياهما، إياهم، إياهنَّ)."},
{"q":"أعرب: أعطيتُكُنَّ المال. قرأتُ الكتاب. إياهما أكرمتُ. إياهنَّ رأيتُ. إياك أعني.","a":"أعطيتُكُنَّ: ماضٍ + تاء فاعل + كاف مفعول به أول + نون جمع إناث. المال: مفعول به ثانٍ منصوب. — قرأتُ: فعل وفاعل. الكتاب: مفعول به منصوب. — إياهما: إيا ضمير منفصل في محل نصب مفعول مقدم، والهاء حرف غيبة والميم عماد والألف تثنية. أكرمتُ: فعل وفاعل. — إياهنَّ: مثلها. رأيتُ: فعل وفاعل. — إياك: إيا مفعول مقدم، والكاف للخطاب. أعني: مضارع مرفوع والفاعل أنا."}
]},
{"id":"masdar","title":"المصدر",
"matn":"المَصْدَرُ هُوَ الاسْمُ المَنْصُوبُ الَّذِي يَجِيءُ ثَالِثًا فِي تَصْرِيفِ الفِعْلِ.",
"nazm":[["المَصْدَرُ اسْمٌ جَاءَ ثَالِثًا لَدَى","تَصْرِيفِ فِعْلٍ وَانْتِصَابُهُ بَدَا"]],
"alfia":[["بِفِعْلِهِ مَصْدَرٌ مُنْصَبٌّ","وَمَا يَكُونُ بَعْدَهُ مَنْصُوبًا"]],
"qas":[
{"q":"ما هو المصدر؟ وما هو المفعول المطلق؟","a":"المصدر: الاسم المنصوب الذي يجيء ثالثًا في تصريف الفعل. المفعول المطلق: ما دل على تأكيد عامله أو نوعه أو عدده."},
{"q":"إلى كم قسم ينقسم المفعول المطلق من جهة ما يراد منه؟","a":"ثلاثة: المؤكد لعامله (حفظتُ الدرسَ حفظًا)، والمبين لنوع العامل (أحببتُ أستاذي محبةَ الولد أباه)، والمبين للعدد (ضربتُه ضربتين)."},
{"q":"إلى كم قسم ينقسم المفعول المطلق من حيث موافقته لعامله؟","a":"قسمان: ما يوافقه في لفظه ومعناه، وما يوافقه في معناه دون حروفه."},
{"q":"مَثِّل للمفعول المطلق المؤكد لعامله بثلاثة أمثلة.","a":"﴿وَكَلَّمَ اللَّهُ مُوسَى تَكْلِيمًا﴾، ﴿وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا﴾، ﴿وَيُسَلِّمُوا تَسْلِيمًا﴾."},
{"q":"مَثِّل للمفعول المطلق المبين للعدد.","a":"﴿فَإِذَا نُفِخَ فِي الصُّورِ نَفْخَةٌ وَاحِدَةٌ﴾، ﴿فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً﴾، ﴿فَدُكَّتَا دَكَّةً وَاحِدَةً﴾."},
{"q":"اجعل في جملتين مفيدتين هات لكل فعل بمصدره منصوبًا (مؤكدًا ومبينًا للنوع): حفظ، شرب، لعب، استغفر، باع، سار.","a":"حفظ: حفظ محمد الدرس حفظًا — حفظ حفظًا جيدًا. شرب: شرب إبراهيم الماء شربًا — شرب الكافر شربَ الهيم. لعب: لعب أحمد بالكرة لعبًا — لعب المسلمون بالكفار لعبَ المستهزئين. استغفر: استغفرتُ ربي استغفارًا — استغفرَ المذنبُ ربه استغفارًا شديدًا. باع: باع الرجل السلعة بيعًا — باع بيعًا مباركًا. سار: سار الجيش سيرًا — سار سيرَ الأسود."},
{"q":"اجعل مفعولًا مطلقًا: حفظًا، لعبًا هادئًا، بيعَ المضطر، سيرًا سريعًا، سهرًا طويلًا، غضبة الأسد، وثبة النمر، اختصارًا.","a":"حفظتُ الدرس حفظًا. لعب التلميذ بالكرة لعبًا هادئًا. بعتُ كتابي بيعَ المضطر. سرتُ إلى العمل سيرًا سريعًا. يسهر الطالب سهرًا طويلًا. يغضب المسلم في الحرب غضبةَ الأسد. وثب المسلم على الكافر وثبةَ النمر. اختصرتُ لك الحديث اختصارًا."},
{"q":"ضع مفعولًا مطلقًا: يخاف على ... ظهر البدر ... يثور البركان ... اترك الهذر ... تجنب المزاح ... غلت المرجل ... فاض النيل ... صرخ الطفل ...","a":"خوفًا شديدًا — ظهورًا — ثورانًا — ترك العقلاء — تجنبًا — غليانًا — فيضًا — صراخًا."},
{"q":"هات مثالًا لمصدر معنوي وآخر لنائب مناب المصدر.","a":"مصدر معنوي: قتلتُه ذبحًا (المصدر معنوي، لأن لفظه يخالف لفظ الفعل). نائب مناب المصدر: ضربتُه كل الضرب."},
{"q":"أعرب: ضربتُ الرجلَ ضربًا شديدًا. جلستُ قعودًا. قام الرجلُ أحسنَ قيام. أعجبني أخوك إعجابًا.","a":"ضربتُ: فعل وفاعل. الرجل: مفعول به منصوب. ضربًا: مفعول مطلق مبين للنوع منصوب. شديدًا: نعت منصوب. — جلستُ: فعل وفاعل. قعودًا: مفعول مطلق مؤكد منصوب (وهو مصدر معنوي). — قام: ماضٍ. الرجل: فاعل مرفوع. أحسنَ: نائب عن المفعول المطلق منصوب، وأحسن مضاف. قيام: مضاف إليه مجرور. — أعجبني: ماضٍ + نون وقاية + ياء مفعول به. أخوك: فاعل مرفوع بالواو. إعجابًا: مفعول مطلق مؤكد منصوب."}
]},
{"id":"zarf","title":"ظرف الزمان والمكان",
"matn":"ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ المَنْصُوبُ بِتَقْدِيرِ «فِي». وَظَرْفُ المَكَانِ هُوَ اسْمُ المَكَانِ المَنْصُوبُ بِتَقْدِيرِ «فِي».",
"nazm":[["الظَّرْفُ مَنْصُوبٌ عَلَى إِضْمَارِ فِي","وَزَمَنِيًّا وَمَكَانِيًّا يَفِي"]],
"alfia":[["وَالظَّرْفُ يَكُونُ زَمَانًا وَمَكَانًا","وَكُلُّهُمَا مَنْصُوبٌ عَلَى الظَّرْفِيَّةِ"]],
"qas":[
{"q":"ما هو الظرف؟ وإلى كم قسم ينقسم؟","a":"الظرف هو المفعول فيه، وينقسم إلى ظرف زمان وظرف مكان."},
{"q":"ما هو ظرف الزمان؟ وإلى كم قسم ينقسم؟","a":"الاسم الدال على الزمان المنصوب بتقدير «في». قسمان: مختص (مقدار معين) ومبهم (غير معين)."},
{"q":"هل ينصب كل ظرف زمان على المفعول فيه؟","a":"نعم."},
{"q":"مَثِّل لظرف الزمان المختص والمبهم بثلاثة أمثلة.","a":"المختص: مكثتُ شهرَ رمضان — عشتُ أسبوعًا جميلًا — سرتُ يومَ الجمعة. المبهم: سرتُ لحظةً — انتظرتُ القطار حينًا — مكثتُ ساعةً."},
{"q":"اجعل مفعولًا فيه: عتمة، صباحًا، زمانًا، لحظة، ضحوة، غدًا.","a":"سأزورك عتمةً — سافر أخي صباحًا — صاحبتُ محمدًا زمانًا — انتظرتُ محمدًا لحظةً — أتيتُك ضحوةَ الأحد — إذا جئتني غدًا أكرمتُك."},
{"q":"ما هو ظرف المكان المبهم؟ وما هو المختص؟ وهل ينصب كل ظرف مكان؟","a":"المبهم: ما ليس له صورة ولا حدود محصورة (أمام، خلف، فوق، تحت، عند). المختص: ما له صورة وحدود (المسجد، الدار). ولا ينصب إلا المبهم. المختص يجب جره بحرف جر."},
{"q":"مَثِّل لظرف المكان المبهم بثلاثة.","a":"جلستُ أمامَ الأستاذ — سار المشاة خلفَ الركبان — مشى الشرطي قُدَّامَ الأمير."},
{"q":"مَثِّل لظرف المكان المختص بثلاثة.","a":"اعتكفتُ في المسجد — زرت عليًّا في داره — صليتُ الظهر في البيت."},
{"q":"اذكر سبع جمل تصف عمل يوم الجمعة فيها مفعول فيه.","a":"استيقظتُ صباحًا — اغتسلتُ غدوةً — ذهبتُ إلى المسجد ضحًى — جلستُ أمام الخطيب — قرأتُ حينًا سورة الكهف — صليتُ الجمعة ركعتين خلفَ الخطيب — سرتُ قُدَّامَ الخطيب."},
{"q":"أعرب: وقفتُ خلف الباب. صليتُ قُدَّام المأمومين إمامًا. جلستُ وراء الشيخ. صعدتُ فوق البيت. جلستُ تحت الشجرة. عند الشجرة عصفور. ذهبتُ مع والدي. نمتُ إزاء البيت. بيتنا حذاء المسجد.","a":"وقفتُ: فعل وفاعل. خلف: ظرف مكان منصوب، وخلف مضاف. الباب: مضاف إليه مجرور. — صليتُ: فعل وفاعل. قُدَّام: ظرف مكان منصوب، وقدام مضاف. المأمومين: مضاف إليه مجرور بالياء. إمامًا: حال منصوب. — جلستُ: فعل وفاعل. وراء: ظرف مكان منصوب. الشيخ: مضاف إليه. — صعدتُ: فعل وفاعل. فوق: ظرف مكان منصوب. البيت: مضاف إليه. — جلستُ: فعل وفاعل. تحت: ظرف مكان منصوب. الشجرة: مضاف إليه. — عند: ظرف مكان منصوب متعلق بمحذوف خبر مقدم. الشجرة: مضاف إليه. عصفور: مبتدأ مؤخر مرفوع. — ذهبتُ: فعل وفاعل. مع: ظرف مكان منصوب، ومع مضاف. والدي: مضاف إليه مجرور بكسرة مقدرة. — نمتُ: فعل وفاعل. إزاء: ظرف منصوب. البيت: مضاف إليه. — بيتنا: مبتدأ مرفوع، وبيت مضاف، ونا مضاف إليه. حذاء: ظرف منصوب متعلق بمحذوف خبر. المسجد: مضاف إليه."}
]},
{"id":"hal","title":"الحال",
"matn":"الحَالُ هُوَ الاسْمُ المَنْصُوبُ، المُفَسِّرُ لِمَا انْبَهَمَ مِنَ الهَيْئَاتِ. وَلَا يَكُونُ الحَالُ إِلَّا نَكِرَةً، وَلَا يَكُونُ إِلَّا بَعْدَ تَمَامِ الكَلَامِ، وَلَا يَكُونُ صَاحِبُهَا إِلَّا مَعْرِفَةً.",
"nazm":[["الحَالُ لِلْهَيْئَاتِ أَيْ لِمَا انْبَهَمْ","مِنْهَا مُفَسِّرٌ وَنَصْبُهُ أُحْتِمْ"]],
"alfia":[["وَالْحَالُ مَنْصُوبٌ وَهُوَ مَا","يُبَيِّنُ الْهَيْئَةَ وَالْحَالِيَّةَ"]],
"qas":[
{"q":"ما هو الحال لغة واصطلاحًا؟","a":"لغةً: ما عليه الإنسان من خير أو شر. اصطلاحًا: الاسم الفضلة المنصوب المفسر لما استبهم من الهيئات."},
{"q":"ما الذي تأتي الحال منه؟ وهل تأتي من المضاف إليه؟","a":"من الفاعل، والمفعول به، والخبر، والمجرور بحرف الجر، والمجرور بالإضافة. نعم تأتي من المضاف إليه: ﴿أَنِ اتَّبِعْ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا﴾ — حنيفًا حال من إبراهيم."},
{"q":"ما الذي يشترط في الحال؟ وفي صاحب الحال؟","a":"الحال: نكرة، وبعد تمام الكلام. صاحب الحال: معرفة. فإن كان نكرة فلا بد من مسوغ."},
{"q":"ما الذي يسوغ مجيء الحال من النكرة؟","a":"تقدم الحال عليها، أو تخصيص النكرة بإضافة أو وصف، أو وقوعها بعد نفي أو شبهه (نهي، استفهام)."},
{"q":"ما هو ضابط الحال؟","a":"هي التي تقع في جواب «كيف»."},
{"q":"ضع حالًا مناسبًا: يعود الطالب المجتهد إلى بلده ... لا تأكل الطعام ... لا تسر في الطريق ... البس ثوبك ... لا تنم في الليل ... رجع أخي من ديوانه ... لا تمش في الأرض ...","a":"مُحصِّلًا للعلم — متمهلًا — فخورًا — متيمنًا — عاريًا — مترجلًا — متكبرًا."},
{"q":"اجعل حالًا مبينًا لهيئة الفاعل: مسرورًا، مختالًا، عريانًا، متعبًا، حارًّا، حافيًا، مجتهدًا.","a":"قدم محمد مسرورًا — قدم المتكبر مختالًا — جاء الكافر عريانًا — لا تعمل متعبًا — جاء الجو اليوم حارًّا — لا تمش في الأرض حافيًا — مكث خالد مجتهدًا في طلب العلم."},
{"q":"اجعل حالًا مبينًا لهيئة المفعول به: مكتوفًا، كئيبًا، سريعًا، صافيًا، نظيفًا جديدًا، ضاحكًا، لامعًا، ناضرًا، مستبشرات.","a":"رأيتُ الأسير مكتوفًا — رأيتُ إسماعيل كئيبًا — رأيتُ محمدًا سريعًا — رأيتُ الماء صافيًا — لبستُ الثوب نظيفًا — بعتُ الثوب جديدًا — رأيتُ التلميذ ضاحكًا — لبستُ الثوب لامعًا — قطفتُ الورد ناضرًا — رأيتُ المسلمات مستبشرات."},
{"q":"صف الفرس بأربع جمل فيها حال.","a":"رأيتُ فرسًا طويلَ القدمين — جاء الفرس متبخترًا — ركبتُ الفرس مسرجًا — قدم الفرس عطشانَ."},
{"q":"أعرب: لقيتني هند باكية. لبستُ الثوب جديدًا. شربتُ اللبن ساخنًا. شربتُ ماءً باردًا. ركبتُ الفرس مسرجًا. ولا نعبد إلا إياه مخلصين.","a":"لقيتني: ماضٍ + نون وقاية + ياء مفعول به. هند: فاعل مرفوع. باكية: حال منصوب. — لبستُ: فعل وفاعل. الثوب: مفعول به منصوب. جديدًا: حال منصوب. — شربتُ: فعل وفاعل. اللبن: مفعول به منصوب. ساخنًا: حال منصوب. — ماءً: مفعول به منصوب. باردًا: صفة لـ«ماء» منصوبة (لا حال، لأن صاحب الحال لا يكون إلا معرفة). — ركبتُ: فعل وفاعل. الفرس: مفعول به منصوب. مسرجًا: حال منصوب. — لا: نافية. نعبد: مضارع مرفوع، والفاعل نحن. إلا: استثناء ملغاة. إياه: مفعول به منصوب. مخلصين: حال منصوب بالياء (جمع مذكر سالم)."},
{"q":"من المعلوم أن الحال لا تكون إلا نكرة، فكيف نجيب عن «جاء الأمير وحده»؟","a":"يجب تأويل المعرفة بنكرة. «وحده» حال بمعنى «منفردًا». ومثلها: أرسلها العِراك (معتركة)، جاءوا الجماء الغفير (جميعًا)."}
]},
{"id":"tamyiz","title":"التمييز",
"matn":"التَّمْيِيزُ هُوَ الاسْمُ المَنْصُوبُ، المُفَسِّرُ لِمَا انْبَهَمَ مِنَ الذَّوَاتِ. وَلَا يَكُونُ إِلَّا نَكِرَةً، وَلَا يَكُونُ إِلَّا بَعْدَ تَمَامِ الكَلَامِ.",
"nazm":[["اسْمٌ مُفَسِّرٌ لِمَا قَدِ انْبَهَمْ","مِنَ الذَّوَاتِ بِاسْمِ تَمْيِيزٍ رُسِمْ"]],
"alfia":[["وَالْمَنْصُوبُ مِنَ الْأَسْمَاءِ مَا","يُفَسِّرُ الذَّاتَ وَيُبْدِي مَا"]],
"qas":[
{"q":"ما هو التمييز؟","a":"الاسم الصريح المنصوب المفسر لما استبهم من الذوات أو النسب."},
{"q":"إلى كم قسم ينقسم؟","a":"قسمان: تمييز الذات (المفرد) وتمييز النسبة (الجملة)."},
{"q":"إلى كم قسم ينقسم تمييز النسبة المحول؟","a":"ثلاثة: المحول عن الفاعل (﴿وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾)، والمحول عن المفعول (﴿وَفَجَّرْنَا الْأَرْضَ عُيُونًا﴾)، والمحول عن المبتدأ (﴿أَنَا أَكْثَرُ مِنْكَ مَالًا﴾)."},
{"q":"ما الفرق بين التمييز والحال؟","a":"التمييز مفسر للذوات. الحال مفسر للهيئات."},
{"q":"ما هو العدد الذي ينصب تمييزه؟","a":"من أحد عشر إلى تسعة وتسعين وما بينهما."},
{"q":"مَثِّل لتمييز الذات بثلاثة أمثلة مختلفة.","a":"شربتُ كوبًا ماءً (موزون). اشتريتُ قنطارًا عسلًا (مكيل). ملكتُ عشرةَ مثاقيلَ ذهبًا (عدد)."},
{"q":"بين أنواع التمييز: شربتُ كوبًا ماءً. اشتريتُ قنطارًا عسلًا. ملكتُ عشرةَ مثاقيلَ ذهبًا. زرعتُ فدانًا قطنًا. رأيتُ أحدَ عشرَ فارسًا. ركب القطار خمسون مسافرًا. محمد أكمل من خالد خلقًا. امتلأ إبراهيم كِبرًا.","a":"كوبًا ماءً: تمييز محول عن المفعول به. قنطارًا عسلًا: تمييز ذات. مثاقيل ذهبًا: تمييز ذات. فدانًا قطنًا: تمييز ذات. أحدَ عشرَ فارسًا: تمييز ذات (عدد). خمسون مسافرًا: تمييز ذات. خلقًا: تمييز محول عن المبتدأ. كِبرًا: تمييز غير محول لإبهام نسبة الامتلاء."},
{"q":"ضع تمييزًا: الذهب أغلى من الفضة ... الحديد أقوى من الرصاص ... العلماء أصدق الناس ... طالب العلم أكرم من الجهال ... الزرافة أطول الحيوانات ... الشمس أكبر من الأرض ... أكلتُ خمسة عشر ... شربتُ قدحًا ...","a":"ثمنًا — صلابةً — قولًا — حالًا — بدنًا — حجمًا — رغيفًا — ماءً."},
{"q":"اجعل تمييزًا: شعيرًا، قصبًا، خلقًا، أدبًا، شربًا، ضحكًا، بأسًا، بسالةً.","a":"اشتريتُ إردبًّا شعيرًا — بعتُ محصول فدان قصبًا — محمد أكرم الناس خلقًا — أكملهم أدبًا — أنا أكثر أصحابي شربًا للماء — أكثرهم ضحكًا — المسلمون أشد بأسًا — المسلم أشد بسالةً."},
{"q":"هات ثلاث جمل: تمييز مسبوق باسم عدد مرفوع ثم منصوب ثم مجرور.","a":"﴿إِنَّ هَذَا أَخِي لَهُ تِسْعٌ وَتِسْعُونَ نَعْجَةً﴾ — تسع وتسعون: مبتدأ مؤخر. ﴿إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا﴾ — أحد عشر: مفعول به مبني. مررتُ باثنين وعشرين رجلًا."},
{"q":"أعرب: محمد أكرم من خالد نفسًا. عندي عشرون ذراعًا حريرًا. تصبب زيد عرقًا. فجرنا الأرض عيونًا. رأيتُ أحد عشر كوكبًا. فتحتُ عشرين بابًا.","a":"محمد: مبتدأ مرفوع. أكرم: خبر مرفوع. من خالد: جار ومجرور. نفسًا: تمييز نسبة محول عن المبتدأ منصوب. — عندي: ظرف متعلق بمحذوف خبر مقدم. عشرون: مبتدأ مؤخر مرفوع بالواو. ذراعًا: تمييز منصوب. حريرًا: تمييز منصوب. — تصبب: ماضٍ. زيد: فاعل مرفوع. عرقًا: تمييز نسبة محول عن الفاعل منصوب. — فجرنا: ماضٍ + نا فاعل. الأرض: مفعول به منصوب. عيونًا: تمييز نسبة محول عن المفعول به منصوب. — رأيتُ: فعل وفاعل. أحدَ عشرَ: مفعول به مبني على فتح الجزأين في محل نصب. كوكبًا: تمييز منصوب. — فتحتُ: فعل وفاعل. عشرين: مفعول به منصوب بالياء. بابًا: تمييز منصوب."},
{"q":"زيد أكثر منك مالًا — هل قولك «زيد أكرم الناس» من باب التمييز؟","a":"لا، لأن «الناس» أُضيف إليها اسم التفضيل، فأصبحت مضافًا إليه مجرورًا لا تمييزًا منصوبًا."}
]},
{"id":"istithna","title":"الاستثناء",
"matn":"حُرُوفُ الاسْتِثْنَاءِ ثَمَانِيَةٌ: إِلَّا، وَغَيْرُ، وَسِوَى، وَسُوَى، وَسَوَاءٌ، وَخَلَا، وَعَدَا، وَحَاشَا.",
"nazm":[["إِلَّا وَغَيْرٌ وَسِوَى سُوَى سَوَا","خَلَا عَدَا وَحَاشَ الاسْتِثْنَا حَوَى"]],
"alfia":[["وَالْمُسْتَثْنَى مَنْصُوبٌ","بِإِلَّا أَوْ غَيْرِهَا مِنَ الْأَدَوَاتِ"]],
"qas":[
{"q":"ما هو الاستثناء لغة واصطلاحًا؟","a":"لغةً: مطلق الإخراج. اصطلاحًا: إخراج بعض أفراد العام بـ«إلا» أو إحدى أخواتها."},
{"q":"ما أدوات الاستثناء؟ وإلى كم قسم تنقسم؟","a":"ثمانية: إلا، وغير، وسوى، وسوى، وسواء، وخلا، وعدا، وحاشا. وتنقسم إلى ثلاثة: حرف دائمًا (إلا)، واسم دائمًا (سوى، سوى، سواء، غير)، وحرف أو فعل (خلا، عدا، حاشا)."},
{"q":"كم حالة للاسم الواقع بعد إلا؟","a":"ثلاثة: وجوب النصب (تام موجب)، وجواز الإتباع بدلًا مع جواز النصب (تام منفي)، ووجوب الإجراء على حسب العامل (ناقص منفي — استثناء مفرغ)."},
{"q":"ما هو الكلام التام والناقص؟","a":"التام: ما ذُكر فيه المستثنى منه. الناقص: ما لم يُذكر فيه."},
{"q":"ما حكم الاسم الواقع بعد سوى وسوى وسواء وغير؟","a":"يجب جره بإضافة الأداة إليه."},
{"q":"ما حكم الاسم الواقع بعد خلا وعدا وحاشا؟","a":"يجوز نصبه ويجوز جره. فإن قُدِّرت أفعالًا نصبتَ، وإن قُدِّرت حروفًا خفضتَ. وإذا تقدمت عليها «ما» المصدرية وجب نصب ما بعدها."},
{"q":"أعرب: قام القوم إلا زيدًا. ما قام القوم إلا زيد (أو إلا زيدًا). ما مررتُ بطالب إلا زيد. ما قرأتُ كتبًا إلا متن الآجرومية. ما قام إلا زيد.","a":"قام: ماضٍ. القوم: فاعل مرفوع. إلا: أداة استثناء. زيدًا: مستثنى منصوب (تام موجب). — ما: نافية. قام: ماضٍ. القوم: فاعل مرفوع. إلا: أداة استثناء. زيد: بدل من القوم مرفوع (أو زيدًا: مستثنى منصوب). — ما: نافية. مررتُ: فعل وفاعل. بطالب: جار ومجرور. إلا: ملغاة. زيد: بدل من طالب مجرور. — ما: نافية. قرأتُ: فعل وفاعل. كتبًا: مفعول به منصوب. إلا: ملغاة. متن: بدل منصوب (أو مستثنى منصوب). الآجرومية: مضاف إليه مجرور. — ما: نافية. قام: ماضٍ. إلا: ملغاة. زيد: فاعل مرفوع (استثناء مفرغ)."},
{"q":"أعرب: مررتُ بالقوم غير زيد. ما رأيتُ غير زيد. ما قام القوم غيرُ زيدٍ (أو غير زيدٍ).","a":"مررتُ: فعل وفاعل. بالقوم: جار ومجرور. غير: أداة استثناء منصوبة على الحالية (تام موجب)، وغير مضاف. زيد: مضاف إليه مجرور. — ما: نافية. رأيتُ: فعل وفاعل. غير: مفعول به منصوب (ناقص منفي)، وغير مضاف. زيد: مضاف إليه مجرور. — ما: نافية. قام: ماضٍ. القوم: فاعل مرفوع. غير: بدل من القوم مرفوع (أو غيرَ: منصوب على الاستثناء)، وغير مضاف. زيد: مضاف إليه مجرور."},
{"q":"أعرب: قام القوم ما خلا زيدًا. رأيتُ القوم عدا زيدًا (أو عدا زيدٍ). أكل القوم حاشا زيدٍ.","a":"قام: ماضٍ. القوم: فاعل مرفوع. ما: مصدرية. خلا: ماضٍ جامد، والفاعل مستتر. زيدًا: مفعول به منصوب، والجملة في محل نصب على الحال. — رأيتُ: فعل وفاعل. القوم: مفعول به منصوب. عدا: ماضٍ جامد أو حرف جر. زيدًا: مفعول به منصوب (أو زيدٍ: اسم مجرور). — أكل: ماضٍ. القوم: فاعل مرفوع. حاشا: حرف جر. زيدٍ: اسم مجرور."},
{"q":"ما هو الكلام الناقص؟ مَثِّل.","a":"ما لم يُذكر فيه المستثنى منه. مثاله: ﴿وَمَا آمَنَ مَعَهُ إِلَّا قَلِيلٌ﴾."},
{"q":"هات مثالًا لكلام تام موجب.","a":"جاء القوم إلا زيدًا."}
]},
{"id":"la","title":"لا النافية للجنس",
"matn":"«لَا» تَنْصِبُ النَّكِرَةَ بِغَيْرِ تَنْوِينٍ إِذَا بَاشَرَتِ النَّكِرَةَ وَلَمْ تَتَكَرَّرْ «لَا»، نَحْوُ: لَا رَجُلَ فِي الدَّارِ.",
"nazm":[["أَنْصِبْ بِلَا مُنَكَّرًا مُتَّصِلَا","مِنْ غَيْرِ تَنْوِينٍ إِذَا أُفْرِدَتْ لَا"]],
"alfia":[["وَلَا لِنَفْيِ الْجِنْسِ تَعْمَلُ عَمَلَ إِنَّ","فَاسْمًا تَنْصِبُ وَخَبَرًا تَرْفَعُ"]],
"qas":[
{"q":"ما الذي تعمله لا النافية للجنس؟","a":"تعمل عمل إنَّ: تنصب الاسم وترفع الخبر."},
{"q":"ما شروط وجوب عملها؟","a":"أربعة: أن يكون اسمها نكرة، ومتصلًا بها، وخبرها نكرة، وألا تتكرر."},
{"q":"إلى كم قسم ينقسم اسم لا؟","a":"ثلاثة: المفرد، والمضاف إلى نكرة، والشبيه بالمضاف."},
{"q":"ما حكم اسم لا المفرد؟","a":"يُبنى على ما يُنصب به: الفتح (لا رجلَ)، والياء (لا رجلينِ)، والكسر (لا صالحاتِ)."},
{"q":"ما هو المفرد في باب لا والمنادى؟","a":"ما ليس مضافًا ولا شبيهًا به. فيدخل فيه المثنى وجمع التكسير وجمع المذكر السالم وجمع المؤنث السالم."},
{"q":"ما حكم اسم لا المضاف أو الشبيه به؟","a":"ينصب بالفتحة الظاهرة أو ما ناب عنها. مثال المضاف: لا طالبَ علمٍ ممقوت. ومثال الشبيه: لا مستقيمًا حاله بين الناس."},
{"q":"ما الحكم إذا تكررت لا؟","a":"لم يجب إعمالها، بل يجوز إعمالها وإهمالها."},
{"q":"ما الحكم إذا وقع بعد لا النافية معرفة أو فصل بينها وبين اسمها فاصل؟","a":"وجب إلغاء «لا» وتكرارها (لا محمد زارني ولا بكر — ﴿لَا فِيهَا غَوْلٌ وَلَا هُمْ عَنْهَا يُنْزَفُونَ﴾)."},
{"q":"ما معنى كون لا نافية للجنس؟","a":"تدل على نفي الخبر عن جميع أفراد جنس اسمها على سبيل التنصيص لا الاحتمال."},
{"q":"أعرب: لا إله إلا الله. لا درهم عندي ولا دينار. لا رجلين قائمان. لا علم بدون تعب. لا ساكنًا في البيت غريب. لا حامل فقه فقيه.","a":"لا: نافية للجنس. إله: اسم لا مبني على الفتح في محل نصب، وخبر لا محذوف تقديره «حق». إلا: استثناء ملغاة. الله: بدل من الخبر المحذوف مرفوع. — لا: نافية للجنس. درهم: اسم لا مبني على الفتح في محل نصب. عندي: ظرف خبر لا. ولا: الواو عطف، لا نافية. دينار: اسم لا مبني على الفتح في محل نصب، وخبرها محذوف. — لا: نافية للجنس. رجلين: اسم لا مبني على الياء في محل نصب. قائمان: خبر لا مرفوع بالألف. — لا: نافية. علم: اسم لا مبني على الفتح في محل نصب. بدون: جار ومجرور خبر لا. — لا: نافية. ساكنًا: اسم لا منصوب لأنه شبيه بالمضاف. في البيت: جار ومجرور متعلق بساكنًا. غريب: خبر لا مرفوع. — لا: نافية. حامل: اسم لا منصوب (مضاف). فقه: مضاف إليه. فقيه: خبر لا مرفوع."}
]},
{"id":"munada","title":"المنادى",
"matn":"المُنَادَى خَمْسَةُ أَنْوَاعٍ: المُفْرَدُ العَلَمُ، وَالنَّكِرَةُ المَقْصُودَةُ، وَالنَّكِرَةُ غَيْرُ المَقْصُودَةِ، وَالمُضَافُ، وَالمُشَبَّهُ بِالمُضَافِ.",
"nazm":[["إِنَّ المُنَادَى فِي الكَلَامِ يَأْتِي","خَمْسَةَ أَنْوَاعٍ لَدَى النُّحَاةِ"]],
"alfia":[["وَالمُنَادَى خَمْسَةٌ مُفْرَدُ عَلَمٍ وَنَكِرَةٌ مُقْصَدَهْ"]],
"qas":[
{"q":"ما هو المنادى لغة واصطلاحًا؟","a":"لغةً: المطلوب إقباله مطلقًا. اصطلاحًا: المطلوب إقباله بـ«يا» أو إحدى أخواتها."},
{"q":"ما أدوات النداء؟","a":"يا، والهمزة، وأي، وأيا، وهيا."},
{"q":"إلى كم قسم ينقسم المنادى؟","a":"خمسة: المفرد العلم، والنكرة المقصودة، والنكرة غير المقصودة، والمضاف، والشبيه بالمضاف."},
{"q":"ما حكم المنادى المفرد العلم والمضاف؟","a":"المفرد العلم يُبنى على ما يُرفع به. المضاف يُنصب وجوبًا. وكذلك النكرة غير المقصودة والشبيه بالمضاف."},
{"q":"أعرب: يا محمد. يا مسلمُ. يا رجلًا أغثني. أي عليُّ قم. يا طالعًا جبلًا أعني. يا عبدَ الله اجتهد. يا مسلمون. يا رجلان. يا رجلينِ.","a":"يا: حرف نداء. محمد: منادى مبني على الضم في محل نصب (مفرد علم). — مسلم: منادى مبني على الضم (نكرة مقصودة). — رجلًا: منادى منصوب (نكرة غير مقصودة). أغثني: فعل أمر وفاعل ومفعول. — علي: منادى مبني على الضم (مفرد علم). قم: فعل أمر. — طالعًا: منادى منصوب (شبيه بالمضاف)، وفاعله ضمير مستتر. جبلًا: مفعول به. أعني: فعل أمر ونون وقاية وياء مفعول. — عبد: منادى منصوب (مضاف). الله: مضاف إليه. اجتهد: فعل أمر. — مسلمون: منادى نكرة مقصودة مبني على الواو في محل نصب. — رجلان: منادى نكرة مقصودة مبني على الألف في محل نصب. — رجلين: منادى نكرة غير مقصودة منصوب بالياء."},
{"q":"أعرب: يا جبال أوبي معه. يا داود إنا جعلناك خليفة. يا فتًى لا تعبث. يا ويلنا إنا كنا ظالمين. يا قاضي الحاجات اقض حاجتي. يا أيها المدثر.","a":"يا: نداء. جبال: منادى نكرة مقصودة مبني على الضم. أوبي: فعل أمر مبني على حذف النون (ياء المخاطبة). معه: ظرف. — يا داود: منادى مبني على الضم. إنا: إن واسمها. جعلناك: ماضٍ + نا فاعل + كاف مفعول أول. خليفة: مفعول ثانٍ. — يا فتًى: منادى نكرة مقصودة مبني على ضمة مقدرة. لا: ناهية. تعبث: مضارع مجزوم. — يا ويلنا: ويل منادى منصوب (مضاف)، ونا مضاف إليه. إنا كنا ظالمين: جملة. — يا قاضي: منادى منصوب بفتحة مقدرة (مضاف). الحاجات: مضاف إليه. اقض: فعل أمر. حاجتي: مفعول به. — يا: نداء. أيها: أي منادى مبني على الضم، وها تنبيه. المدثر: نعت لأي مرفوع."}
]},
{"id":"mafool-ajlih","title":"المفعول من أجله",
"matn":"المَفْعُولُ مِنْ أَجْلِهِ هُوَ الاسْمُ المَنْصُوبُ الَّذِي يُذْكَرُ بَيَانًا لِسَبَبِ وُقُوعِ الفِعْلِ.",
"nazm":[["وَهُوَ الَّذِي جَاءَ بَيَانًا لِسَبَبْ","كَيْنُونَةِ العَامِلِ فِيهِ وَانْتَصَبْ"]],
"alfia":[["وَالْمَفْعُولُ لِأَجْلِهِ مَنْصُوبٌ","بِشَرْطِ أَنْ يَكُونَ مَصْدَرًا"]],
"qas":[
{"q":"ما هو المفعول لأجله؟","a":"الاسم المنصوب الذي يُذكر بيانًا لسبب وقوع الفعل."},
{"q":"ما شروط الاسم الذي يقع مفعولًا لأجله؟","a":"خمسة: مصدر، وقلبي، وعلة لما قبله، ومتحد مع عامله في الوقت، ومتحد معه في الفاعل."},
{"q":"كم حالة للاسم الواقع مفعولًا له؟","a":"ثلاثة: مقترن بـ«أل»، أو مضاف، أو مجرد."},
{"q":"ما حكم المفعول له المقترن بأل والمضاف والمجرد؟","a":"المقترن: الأكثر جره بالحرف ويقل نصبه. المضاف: يجوز جره ونصبه مستويًا. المجرد: الأكثر نصبه ويقل جره."},
{"q":"أعرب: قام أبو زيد إجلالًا لأخي عمرو. قرأ الطالب ابتغاءَ العلم. قمتُ إكرامًا للشيخ. ذهبتُ إلى المسجد طلبًا للأجر.","a":"قام: ماضٍ. أبو: فاعل مرفوع بالواو، وأبو مضاف. زيد: مضاف إليه. إجلالًا: مفعول لأجله منصوب. لأخي: جار ومجرور. عمرو: بدل مجرور. — قرأ: ماضٍ. الطالب: فاعل مرفوع. ابتغاءَ: مفعول لأجله منصوب، وابتغاء مضاف. العلم: مضاف إليه. — قمتُ: فعل وفاعل. إكرامًا: مفعول لأجله منصوب. للشيخ: جار ومجرور. — ذهبتُ: فعل وفاعل. إلى المسجد: جار ومجرور. طلبًا: مفعول لأجله منصوب. للأجر: جار ومجرور."},
{"q":"لماذا لم يُعرب «حاجًّا» في «دخل الرجل في مكة حاجًّا» مفعولًا لأجله؟","a":"لأن من شروط المفعول لأجله أن يكون مصدرًا، و«حاجًّا» اسم فاعل، فيُعرب حالًا منصوبًا."}
]},
{"id":"mafool-maah","title":"المفعول معه",
"matn":"المَفْعُولُ مَعَهُ هُوَ الاسْمُ المَنْصُوبُ الَّذِي يُذْكَرُ لِبَيَانِ مَنْ فُعِلَ مَعَهُ الفِعْلُ.",
"nazm":[["وَهُوَ اسْمٌ انْتَصَبَ بَعْدَ وَاوِ","مَعِيَّةٍ فِي قَوْلِ كُلِّ رَاوِ"]],
"alfia":[["وَالْمَفْعُولُ مَعَهُ مَنْصُوبٌ","بَعْدَ وَاوٍ تُفِيدُ الْمَعِيَّةَ"]],
"qas":[
{"q":"ما هو المفعول معه؟","a":"الاسم الفضلة المنصوب بعد واو تفيد المعية نصًّا، الدال على الذات التي وقع الفعل بمصاحبتها."},
{"q":"إلى كم قسم ينقسم؟","a":"قسمان: ما يتعين نصبه، وما يجوز نصبه وإتباعه لما قبله معطوفًا عليه."},
{"q":"ما الذي يعمل في المفعول معه؟","a":"الفعل (حضر الأمير والجيشَ)، أو الاسم الدال على معنى الفعل المشتمل على حروفه — كاسم الفاعل (الأمير حاضر والجيشَ)."},
{"q":"مَثِّل للقسمين.","a":"يتعين نصبه: «استوى الماءُ والخشبةَ» — لا يصح عطف الخشبة على الماء لأن الاستواء لا ينسب للخشبة. يجوز نصبه أو إتباعه: «جاء الأميرُ والجيشُ/الجيشَ» — يصح عطف الجيش على الأمير."},
{"q":"أعرب: استوى الماء والخشبة. جاء الأمير والجيش.","a":"استوى: ماضٍ. الماء: فاعل مرفوع. و: واو المعية. الخشبة: مفعول معه منصوب. — جاء: ماضٍ. الأمير: فاعل مرفوع. و: الواو (عاطفة أو للمعية). الجيش: معطوف مرفوع (أو مفعول معه منصوب)."}
]},
{"id":"makhfudat","title":"المخفوضات",
"matn":"المَخْفُوضَاتُ ثَلَاثَةُ أَنْوَاعٍ: مَخْفُوضٌ بِالحَرْفِ، وَمَخْفُوضٌ بِالإِضَافَةِ، وَتَابِعٌ لِلْمَخْفُوضِ.",
"nazm":[["الخَفْضُ بِالحَرْفِ وَبِالإِضَافَةِ","كَمِثْلِ أَكْرِمْ بِأَبِي قُحَافَةَ"]],
"alfia":[["وَالْخَفْضُ بِالْحَرْفِ وَبِالْإِضَافَةِ","وَبِالتَّبَعِيَّةِ الَّتِي قَدْ خُصَّتِ"]],
"qas":[
{"q":"على كم نوع تتنوع المخفوضات؟","a":"ثلاثة: بالحرف، وبالإضافة، وبالتبعية. وزاد بعضهم: بالمجاورة."},
{"q":"ما المعاني التي تدل عليها: من، عن، في، رُبَّ، الكاف، اللام؟","a":"من: الابتداء، التبعيض، التعليل، مرادفة عن، مرادفة الباء. عن: المجاوزة. في: الظرفية، المصاحبة، التعليل، الاستعلاء، مرادفة إلى. رُبَّ: التقليل أو التكثير أو التوقع. الكاف: التشبيه. اللام: الاستحقاق، الاختصاص، الملك، التمليك، شبه التمليك، موافقة إلى."},
{"q":"على كم نوع تأتي الإضافة؟","a":"ثلاثة: على معنى «من» (خاتم حديد)، وعلى معنى «في» (مكر الليل)، وعلى معنى اللام (غلام زيد)."},
{"q":"ما تقدير الإضافة في: بيت الضيافة، سرج الدابة، بيت الطين؟","a":"بيت الضيافة: اللام. سرج الدابة: اللام. بيت الطين: من."},
{"q":"ما الذي جر لفظ الجلالة في ﴿تَاللَّهِ لَأَكِيدَنَّ أَصْنَامَكُمْ﴾؟","a":"تاء القسم."},
{"q":"هات مثالين لكل من: على، الباء، إلى، واو القسم.","a":"على: ﴿وَعَلَيْهَا وَعَلَى الْفُلْكِ تُحْمَلُونَ﴾ — ﴿أَوْ أَجِدُ عَلَى النَّارِ هُدًى﴾. الباء: ﴿ذَهَبَ اللَّهُ بِنُورِهِمْ﴾ — ﴿لَذَهَبَ بِسَمْعِهِمْ﴾. إلى: ﴿أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ﴾ — ﴿إِلَى الْمَسْجِدِ الْأَقْصَى﴾. واو القسم: ﴿وَالْقُرْآنِ الْحَكِيمِ﴾ — ﴿وَالتِّينِ وَالزَّيْتُونِ﴾."},
{"q":"أعرب: الحمد لله رب العالمين. إن المتقين في مقام أمين. تبت يدا أبي لهب.","a":"الحمد: مبتدأ مرفوع. لله: اللام حرف جر، ولفظ الجلالة مجرور، والجار والمجرور متعلقان بمحذوف خبر. رب: نعت للفظ الجلالة مجرور، ورب مضاف. العالمين: مضاف إليه مجرور بالياء. وفي الآية أنواع المخفوضات كلها: بالحرف (لله)، بالإضافة (العالمين)، وبالتبعية (رب). — إن: توكيد ونصب. المتقين: اسم إن منصوب بالياء. في: حرف جر. مقام: اسم مجرور، والجار والمجرور متعلق بمحذوف خبر إن. أمين: نعت مجرور. — تبت: ماضٍ والتاء للتأنيث. يدا: فاعل مرفوع بالألف (مثنى)، ويدا مضاف. أبي: مضاف إليه مجرور بالياء (الأسماء الخمسة)، وأبي مضاف. لهب: مضاف إليه مجرور."}
]}
]}
</script>

<script>
/* ============================================================
   البيانات والحالة
   ============================================================ */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const CHAPTERS = DATA.chapters;
const SETTINGS_KEY = 'agrumiyya-v5';
const FAV_KEY = 'agrumiyya-favs-v5';
const DEFAULT_SETTINGS = {theme:'light',color:'brown',fontSize:16,fontFamily:'Amiri',bookFilter:'all'};

let SETTINGS = {...DEFAULT_SETTINGS};
let FAVORITES = [];
let STATE = {currentChapter:0, currentView:'reader', activeGame:null, playAll:null, answersVisible:false, quiz:null};

/* ============================================================
   أدوات عامة
   ============================================================ */
const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stripHTML(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent||'';}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function showToast(msg, ok=true){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'var(--accent)' : '#c44';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); showToast('✓ تم النسخ'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('✓ تم النسخ'); }
    catch(e2){ showToast('تعذّر النسخ', false); }
    document.body.removeChild(ta);
  }
}
async function shareContent(title, text){
  if(navigator.share){
    try{ await navigator.share({title, text}); showToast('✓ تمت المشاركة'); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  await copyText(text);
}

/* ============================================================
   الإعدادات
   ============================================================ */
function loadSettings(){
  try{const raw=localStorage.getItem(SETTINGS_KEY); if(raw) SETTINGS={...DEFAULT_SETTINGS,...JSON.parse(raw)};}catch(e){}
  applySettings();
}
function saveSettings(){ try{localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS));}catch(e){} }
function applySettings(){
  document.documentElement.setAttribute('data-theme', SETTINGS.theme);
  document.documentElement.setAttribute('data-color', SETTINGS.color);
  document.documentElement.style.setProperty('--base', SETTINGS.fontSize+'px');
  const fonts = {'Amiri':"'Amiri','Scheherazade New',serif",'Scheherazade New':"'Scheherazade New','Amiri',serif",'Lateef':"'Lateef','Amiri',serif",'Noto Naskh Arabic':"'Noto Naskh Arabic','Amiri',serif",'Cairo':"'Cairo','Amiri',sans-serif",'Reem Kufi':"'Reem Kufi','Amiri',sans-serif"};
  document.documentElement.style.setProperty('--font-body', fonts[SETTINGS.fontFamily]||fonts['Amiri']);
}
function loadFavorites(){
  try{const raw=localStorage.getItem(FAV_KEY); if(raw) FAVORITES=JSON.parse(raw)||[];}catch(e){FAVORITES=[];}
  updateFavCount();
}
function saveFavorites(){ try{localStorage.setItem(FAV_KEY, JSON.stringify(FAVORITES));}catch(e){} updateFavCount(); }
function updateFavCount(){ const el=document.getElementById('favCnt'); if(el) el.textContent = FAVORITES.length ? `(${FAVORITES.length})` : ''; }

const ICONS = {
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
  star:'<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
};

/* ============================================================
   المحفوظات
   ============================================================ */
function favKey(chId, type, idx){ return `${chId}:${type}:${idx}`; }
function isFav(key){ return FAVORITES.some(f=>f.key===key); }
function toggleFav(key, data){
  const idx = FAVORITES.findIndex(f=>f.key===key);
  if(idx>=0){ FAVORITES.splice(idx,1); showToast('أُزيل من المحفوظات', false); }
  else { FAVORITES.push({key, ...data, savedAt:Date.now()}); showToast('✓ حُفظ في المحفوظات'); }
  saveFavorites();
  document.querySelectorAll(`[data-favkey="${key}"]`).forEach(btn=>btn.classList.toggle('saved', isFav(key)));
}

/* ============================================================
   تبديل إظهار/إخفاء الأجوبة
   ============================================================ */
function toggleAnswers(){
  STATE.answersVisible = !STATE.answersVisible;
  document.querySelectorAll('.qaCard').forEach(card => {
    card.classList.toggle('showA', STATE.answersVisible);
  });
  document.querySelectorAll('.eyeToggle').forEach(btn => {
    btn.innerHTML = STATE.answersVisible ? EYE_OFF_ICON : EYE_ICON;
    btn.title = STATE.answersVisible ? 'إخفاء الأجوبة' : 'إظهار الأجوبة';
  });
}

/* ============================================================
   عرض القارئ
   ============================================================ */
function renderReader(){
  const container = document.getElementById('v-reader');
  const ch = CHAPTERS[STATE.currentChapter];
  if(!ch) return;

  let html = `<div class="bookSel">
    <button class="${SETTINGS.bookFilter==='all'?'active':''}" onclick="setBookFilter('all')">📚 الكل</button>
    <button class="${SETTINGS.bookFilter==='qa'?'active':''}" onclick="setBookFilter('qa')">💬 الأسئلة</button>
    <button class="${SETTINGS.bookFilter==='matn'?'active':''}" onclick="setBookFilter('matn')">📖 المتن</button>
    <button class="${SETTINGS.bookFilter==='nazm'?'active':''}" onclick="setBookFilter('nazm')">✍️ النظم</button>
    <button class="${SETTINGS.bookFilter==='alfia'?'active':''}" onclick="setBookFilter('alfia')">📜 الألفية</button>
  </div>
  <div class="chapter">
    <div class="chHead">
      <span class="chN">${STATE.currentChapter+1}</span>
      <h2>${ch.title}</h2>
      <div class="acts">
        <button class="iBtn" onclick="copyChapter()" title="نسخ الباب">${ICONS.copy}</button>
        <button class="iBtn" onclick="shareChapter()" title="مشاركة الباب">${ICONS.share}</button>
      </div>
    </div>`;

  // Matn
  if((SETTINGS.bookFilter==='all'||SETTINGS.bookFilter==='matn') && ch.matn){
    html += `<div class="secBlk"><div class="secLbl">📖 المتن</div>
      <div class="matnCard">${ch.matn}</div></div>`;
  }

  // Nazm
  if((SETTINGS.bookFilter==='all'||SETTINGS.bookFilter==='nazm') && ch.nazm && ch.nazm.length){
    html += `<div class="secBlk"><div class="secLbl">✍️ النظم (${ch.nazm.length} بيت)
      <span style="display:inline-flex;gap:2px;margin-right:auto">
        <button class="iBtn" onclick="copyAllNazm()" title="نسخ كل الأبيات">${ICONS.copy}</button>
        <button class="iBtn" onclick="shareAllNazm()" title="مشاركة كل الأبيات">${ICONS.share}</button>
        <button class="iBtn fav ${ch.nazm.every((v,i)=>isFav(favKey(ch.id,'nazm',i)))?'saved':''}" onclick="toggleFavAllNazm()" title="حفظ كل الأبيات">${ICONS.star}</button>
      </span>
    </div><div class="poemCard">`;
    ch.nazm.forEach((v,i)=>{
      const key = favKey(ch.id, 'nazm', i);
      const fc = isFav(key) ? 'saved' : '';
      html += `<div class="bayt">
        <button class="iBtn fav ${fc}" style="position:absolute;top:2px;left:2px;width:22px;height:22px" data-favkey="${key}" onclick="toggleFav('${key}',{type:'nazm',sadr:'${esc(v[0]).replace(/'/g,"\\'")}',ajz:'${esc(v[1]||'').replace(/'/g,"\\'")}',chapter:'${esc(ch.title).replace(/'/g,"\\'")}',chapterId:'${ch.id}',idx:${i}})" title="حفظ">${ICONS.star}</button>
        <span class="sadr">${v[0]}</span>
        ${v[1]?`<span class="ajz">${v[1]}</span>`:''}
      </div>`;
    });
    html += `</div></div>`;
  }

  // Alfiyya
  if((SETTINGS.bookFilter==='all'||SETTINGS.bookFilter==='alfia') && ch.alfia && ch.alfia.length){
    html += `<div class="secBlk"><div class="secLbl">📜 شاهد من الألفية (${ch.alfia.length} بيت)
      <span style="display:inline-flex;gap:2px;margin-right:auto">
        <button class="iBtn" onclick="copyAllAlfia()" title="نسخ كل الأبيات">${ICONS.copy}</button>
        <button class="iBtn" onclick="shareAllAlfia()" title="مشاركة كل الأبيات">${ICONS.share}</button>
        <button class="iBtn fav ${ch.alfia.every((v,i)=>isFav(favKey(ch.id,'alfia',i)))?'saved':''}" onclick="toggleFavAllAlfia()" title="حفظ كل الأبيات">${ICONS.star}</button>
      </span>
    </div><div class="alfiaCard">`;
    ch.alfia.forEach((v,i)=>{
      const key = favKey(ch.id, 'alfia', i);
      const fc = isFav(key) ? 'saved' : '';
      html += `<div class="bayt">
        <button class="iBtn fav ${fc}" style="position:absolute;top:2px;left:2px;width:22px;height:22px" data-favkey="${key}" onclick="toggleFav('${key}',{type:'alfia',sadr:'${esc(v[0]).replace(/'/g,"\\'")}',ajz:'${esc(v[1]||'').replace(/'/g,"\\'")}',chapter:'${esc(ch.title).replace(/'/g,"\\'")}',chapterId:'${ch.id}',idx:${i}})" title="حفظ">${ICONS.star}</button>
        <span class="sadr">${v[0]}</span>
        ${v[1]?`<span class="ajz">${v[1]}</span>`:''}
      </div>`;
    });
    html += `</div></div>`;
  }

  // Q&A
  if((SETTINGS.bookFilter==='all'||SETTINGS.bookFilter==='qa') && ch.qas && ch.qas.length){
    const eyeIcon = STATE.answersVisible ? EYE_OFF_ICON : EYE_ICON;
    const eyeTitle = STATE.answersVisible ? 'إخفاء الأجوبة' : 'إظهار الأجوبة';
    html += `<div class="secBlk"><div class="secHead">
      <div class="secLbl">💬 الأسئلة والأجوبة (${ch.qas.length} سؤالًا)</div>
      <button class="eyeToggle" onclick="toggleAnswers()" title="${eyeTitle}">${eyeIcon}</button>
    </div>`;
    ch.qas.forEach((qa,j)=>{
      const show = STATE.answersVisible ? 'showA' : '';
      html += `<div class="qaCard ${show}" id="qa-${ch.id}-${j}">
        <div class="q">
          <span class="lbl">س ${j+1}</span><p>${qa.q}</p>
        </div>
        <div class="a">
          <span class="lbl">ج</span>
          <div class="aBody">${qa.a}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Chapter navigation
  html += `<div class="chNav">
    <button onclick="prevChapter()" ${STATE.currentChapter===0?'disabled':''}>◀ الباب السابق</button>
    <button class="next" onclick="nextChapter()" ${STATE.currentChapter===CHAPTERS.length-1?'disabled':''}>الباب التالي ▶</button>
  </div>`;
  html += `</div>`;
  container.innerHTML = html;

  // TOC
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  CHAPTERS.forEach((c,i)=>{
    const a = document.createElement('a');
    a.className = 'tocI' + (i===STATE.currentChapter?' active':'');
    a.innerHTML = `<span class="num">${i+1}</span><span>${c.title}</span>`;
    a.addEventListener('click', ()=>{ STATE.currentChapter=i; renderReader(); window.scrollTo({top:0,behavior:'smooth'}); closeMobileSidebar(); });
    toc.appendChild(a);
  });
  document.getElementById('tocProg').textContent = `${STATE.currentChapter+1} / ${CHAPTERS.length}`;
  document.getElementById('brandMeta').textContent = `${CHAPTERS.length} بابًا · ${CHAPTERS.reduce((s,c)=>s+(c.qas?.length||0),0)} سؤالًا`;
  document.getElementById('progressBar').style.width = `${((STATE.currentChapter+1)/CHAPTERS.length)*100}%`;
}

function setBookFilter(f){ SETTINGS.bookFilter=f; saveSettings(); renderReader(); }
function prevChapter(){ if(STATE.currentChapter>0){ STATE.currentChapter--; renderReader(); window.scrollTo({top:0,behavior:'smooth'}); } }
function nextChapter(){ if(STATE.currentChapter<CHAPTERS.length-1){ STATE.currentChapter++; renderReader(); window.scrollTo({top:0,behavior:'smooth'}); } }

/* ============================================================
   نسخ/مشاركة
   ============================================================ */
function getCurrentChapter(){ return CHAPTERS[STATE.currentChapter]; }
function buildChapterText(ch){
  let t = `📖 ${ch.title}\n\n`;
  if(ch.matn) t += `【المتن】\n${ch.matn}\n\n`;
  if(ch.nazm?.length) t += `【النظم】\n${ch.nazm.map(v=>v.join(' ❁ ')).join('\n')}\n\n`;
  if(ch.alfia?.length) t += `【شاهد الألفية】\n${ch.alfia.map(v=>v.join(' ❁ ')).join('\n')}\n\n`;
  if(ch.qas?.length) t += `【الأسئلة】\n${ch.qas.map((qa,i)=>`س${i+1}: ${qa.q}\nج: ${qa.a}`).join('\n\n')}`;
  return t;
}
function copyChapter(){ copyText(buildChapterText(getCurrentChapter())); }
function shareChapter(){ const ch=getCurrentChapter(); shareContent(ch.title, buildChapterText(ch)); }
function copyAllNazm(){ const ch=getCurrentChapter(); if(ch.nazm) copyText(`✍️ النظم — ${ch.title}\n\n${ch.nazm.map(v=>v.join('\n')).join('\n\n')}`); }
function shareAllNazm(){ const ch=getCurrentChapter(); if(ch.nazm) shareContent('النظم — '+ch.title, ch.nazm.map(v=>v.join('\n')).join('\n\n')); }
function toggleFavAllNazm(){
  const ch=getCurrentChapter(); if(!ch.nazm) return;
  const allFav = ch.nazm.every((v,i)=>isFav(favKey(ch.id,'nazm',i)));
  if(allFav){
    ch.nazm.forEach((v,i)=>{ const k=favKey(ch.id,'nazm',i); const idx=FAVORITES.findIndex(f=>f.key===k); if(idx>=0) FAVORITES.splice(idx,1); });
    showToast('أُزيلت جميع الأبيات', false);
  } else {
    ch.nazm.forEach((v,i)=>{ const k=favKey(ch.id,'nazm',i); if(!isFav(k)) FAVORITES.push({key:k,type:'nazm',sadr:v[0],ajz:v[1]||'',chapter:ch.title,chapterId:ch.id,idx:i,savedAt:Date.now()}); });
    showToast('✓ حُفظت جميع الأبيات');
  }
  saveFavorites(); renderReader();
}
function copyAllAlfia(){ const ch=getCurrentChapter(); if(ch.alfia) copyText(`📜 شاهد الألفية — ${ch.title}\n\n${ch.alfia.map(v=>v.join('\n')).join('\n\n')}`); }
function shareAllAlfia(){ const ch=getCurrentChapter(); if(ch.alfia) shareContent('الألفية — '+ch.title, ch.alfia.map(v=>v.join('\n')).join('\n\n')); }
function toggleFavAllAlfia(){
  const ch=getCurrentChapter(); if(!ch.alfia) return;
  const allFav = ch.alfia.every((v,i)=>isFav(favKey(ch.id,'alfia',i)));
  if(allFav){
    ch.alfia.forEach((v,i)=>{ const k=favKey(ch.id,'alfia',i); const idx=FAVORITES.findIndex(f=>f.key===k); if(idx>=0) FAVORITES.splice(idx,1); });
    showToast('أُزيلت جميع الأبيات', false);
  } else {
    ch.alfia.forEach((v,i)=>{ const k=favKey(ch.id,'alfia',i); if(!isFav(k)) FAVORITES.push({key:k,type:'alfia',sadr:v[0],ajz:v[1]||'',chapter:ch.title,chapterId:ch.id,idx:i,savedAt:Date.now()}); });
    showToast('✓ حُفظت جميع الأبيات');
  }
  saveFavorites(); renderReader();
}

/* ============================================================
   المحفوظات
   ============================================================ */
function renderFavs(){
  const c = document.getElementById('v-favs');
  if(!FAVORITES.length){
    c.innerHTML = `<div class="empty"><span class="ico">⭐</span>لم تحفظ أي بيت بعد<br><small>اضغط على النجمة بجانب أي بيت لحفظه</small></div>`;
    return;
  }
  let html = `<div class="chHead"><h2>⭐ المحفوظات (${FAVORITES.length})</h2><button class="miniBtn" onclick="clearFavs()" style="background:#ffe4e8;color:#c44">🗑 حذف الكل</button></div>`;
  FAVORITES.slice().reverse().forEach((f,ri)=>{
    const i = FAVORITES.length-1-ri;
    html += `<div class="favItem">
      <div class="favActs">
        <button class="iBtn" onclick="copyFav(${i})" title="نسخ">${ICONS.copy}</button>
        <button class="iBtn" onclick="shareFav(${i})" title="مشاركة">${ICONS.share}</button>
        <button class="iBtn" onclick="removeFav(${i})" style="color:#c44">✕</button>
      </div>
      <div class="favCh">📖 ${f.chapter||''}</div>
      <div class="favV"><span class="sadr">${f.sadr||''}</span>${f.ajz?`<span class="ajz">${f.ajz}</span>`:''}</div>
    </div>`;
  });
  c.innerHTML = html;
}
function copyFav(i){ const f=FAVORITES[i]; if(f) copyText(`${f.chapter}\n\n${f.sadr}\n${f.ajz}`); }
function shareFav(i){ const f=FAVORITES[i]; if(f) shareContent(f.chapter, `${f.sadr}\n${f.ajz}\n\n— ${f.chapter}`); }
function removeFav(i){ FAVORITES.splice(i,1); saveFavorites(); renderFavs(); document.querySelectorAll('[data-favkey]').forEach(b=>b.classList.toggle('saved', FAVORITES.some(f=>f.key===b.dataset.favkey))); }
function clearFavs(){ if(!confirm('حذف جميع المحفوظات؟')) return; FAVORITES=[]; saveFavorites(); renderFavs(); document.querySelectorAll('[data-favkey]').forEach(b=>b.classList.remove('saved')); showToast('تم حذف الكل'); }

/* ============================================================
   الاختبار
   ============================================================ */
function renderQuiz(){
  const c = document.getElementById('v-quiz');
  if(STATE.quiz?.active){ renderQuizQuestion(); return; }
  c.innerHTML = `
  <div class="setupBox">
    <h3>📝 إعداد الاختبار</h3>
    <div class="fld"><label>نوع الأسئلة</label>
      <select id="qzType" class="setSel" style="width:100%;max-width:none">
        <option value="mix">🔀 مختلط</option>
        <option value="qa">💬 أسئلة فقط</option>
        <option value="nazm">✍️ أبيات النظم فقط</option>
        <option value="alfia">📜 شواهد الألفية فقط</option>
      </select>
    </div>
    <div class="fld"><label>عدد الأسئلة</label>
      <input type="number" id="qzCount" value="10" min="1" max="200" style="width:120px">
    </div>
    <div class="fld"><label>⏱ التوقيت بالدقائق <small>(افتراضي: دقيقة لكل سؤال — اتركه فارغًا للاختبار بدون وقت)</small></label>
      <input type="number" id="qzTime" value="10" min="0" max="180" placeholder="بدون توقيت" style="width:120px">
    </div>
    <div class="fld"><label>الأبواب <small>(اتركها فارغة = الكل)</small></label>
      <div class="miniRow"><button class="miniBtn" onclick="togAllCh(true)">تحديد الكل</button><button class="miniBtn" onclick="togAllCh(false)">إلغاء الكل</button></div>
      <div class="chGrid" id="chGrid">${CHAPTERS.map((ch,i)=>`<label class="chChk"><input type="checkbox" value="${i}" class="qCh"><span>${ch.title}</span></label>`).join('')}</div>
    </div>
    <div style="text-align:center;margin-top:14px"><button class="btn btnP" onclick="startQuiz()">🚀 ابدأ الاختبار</button></div>
  </div>`;
  c.querySelectorAll('.qCh').forEach(cb=>cb.addEventListener('change', ()=>cb.closest('.chChk').classList.toggle('checked', cb.checked)));
  // مزامنة تلقائية للتوقيت مع عدد الأسئلة
  const countEl = c.querySelector('#qzCount');
  const timeEl = c.querySelector('#qzTime');
  if(countEl && timeEl){
    countEl.addEventListener('input', ()=>{
      const n = Math.max(1, Math.min(200, parseInt(countEl.value,10)||10));
      timeEl.value = Math.min(180, Math.max(3, n));
    });
  }
}
function togAllCh(v){ document.querySelectorAll('.qCh').forEach(cb=>{cb.checked=v; cb.closest('.chChk').classList.toggle('checked', v);}); }
function startQuiz(){
  const type = document.getElementById('qzType').value;
  const count = Math.max(1, Math.min(200, parseInt(document.getElementById('qzCount').value,10)||10));
  const timeInput = document.getElementById('qzTime').value;
  const totalTime = timeInput ? Math.max(0, parseInt(timeInput,10)*60) : 0;
  const selected = Array.from(document.querySelectorAll('.qCh:checked')).map(cb=>parseInt(cb.value,10));
  const chapters = selected.length ? selected.map(i=>CHAPTERS[i]) : CHAPTERS;

  let pool = [];
  chapters.forEach(ch=>{
    if((type==='mix'||type==='qa') && ch.qas) ch.qas.forEach((qa,i)=>pool.push({type:'qa', question:qa.q, correct:stripHTML(qa.a).substring(0,90), chapter:ch.title, chapterId:ch.id}));
    if((type==='mix'||type==='nazm') && ch.nazm) ch.nazm.forEach((v,i)=>pool.push({type:'nazm', question:`من أي باب هذا البيت؟\n«${v[0]} ${v[1]?'❁ '+v[1]:''}»`, correct:ch.title, chapterId:ch.id}));
    if((type==='mix'||type==='alfia') && ch.alfia) ch.alfia.forEach((v,i)=>pool.push({type:'alfia', question:`من أي باب هذا الشاهد؟\n«${v[0]} ${v[1]?'❁ '+v[1]:''}»`, correct:ch.title, chapterId:ch.id}));
  });
  if(!pool.length){ showToast('لا توجد أسئلة كافية', false); return; }
  pool = shuffle(pool).slice(0, count);
  const allTitles = CHAPTERS.map(c=>c.title);
  pool.forEach(q=>{
    if(q.type==='qa'){
      const wrongs = shuffle(chapters.flatMap(c=>(c.qas||[]).map(x=>stripHTML(x.a).substring(0,90))).filter(x=>x!==q.correct)).slice(0,3);
      q.options = shuffle([q.correct, ...wrongs]);
    } else {
      const wrongs = shuffle(allTitles.filter(t=>t!==q.correct)).slice(0,3);
      q.options = shuffle([q.correct, ...wrongs]);
    }
  });
  STATE.quiz = {active:true, questions:pool, currentIdx:0, answers:new Array(pool.length).fill(null), totalTime, timeLeft:totalTime, timerId:null};
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const c = document.getElementById('v-quiz');
  const q = STATE.quiz;
  if(q.currentIdx >= q.questions.length){ showQuizResult(); return; }
  if(q.timerId){ clearInterval(q.timerId); q.timerId=null; }
  const cur = q.questions[q.currentIdx];
  const ans = q.answers[q.currentIdx];
  const pct = (q.answers.filter(a=>a!==null).length/q.questions.length)*100;
  let html = `<div class="qzTop"><span class="cnt">${q.currentIdx+1}/${q.questions.length}</span><div class="bar"><div style="width:${pct}%"></div></div>${q.totalTime?`<span class="timer" id="qzTimer">⏱ ${fmtTime(q.timeLeft)}</span>`:''}</div>`;
  html += `<div class="qzCard">
    <div class="qzH"><span class="qzNum">سؤال ${q.currentIdx+1}</span><span class="qzType">${cur.type==='qa'?'💬 سؤال':cur.type==='nazm'?'✍️ بيت':'📜 شاهد'}</span></div>
    <div class="qzText">${esc(cur.question)}</div>
    <div class="qzOpts">`;
  cur.options.forEach(o=>{
    let cls='';
    if(ans!==null){ if(o===cur.correct) cls='correct'; else if(o===ans) cls='wrong'; }
    html += `<div class="qzOpt ${cls}" ${ans===null?`onclick="answerQuiz('${esc(o).replace(/'/g,"\\'")}')"`:''}>${esc(o)}</div>`;
  });
  html += `</div>`;
  if(ans!==null){
    const ok = ans===cur.correct;
    html += `<div class="qzFb show ${ok?'ok':'no'}">${ok?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: '+esc(cur.correct)}</div>`;
  }
  html += `</div><div class="qzNav">
    ${q.currentIdx>0?`<button class="btn btnS" onclick="prevQz()">← السابق</button>`:''}
    ${ans!==null?`<button class="btn btnS" onclick="gotoChapter('${cur.chapterId}')">📖 اذهب إلى الدرس</button>`:''}
    ${q.currentIdx<q.questions.length-1?`<button class="btn btnP" onclick="nextQz()">التالي →</button>`:`<button class="btn btnP" onclick="showQuizResult()">عرض النتيجة</button>`}
  </div>`;
  c.innerHTML = html;
  if(q.totalTime && ans===null) startTimer();
}
function fmtTime(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function startTimer(){
  STATE.quiz.timerId = setInterval(()=>{
    STATE.quiz.timeLeft--;
    const el = document.getElementById('qzTimer');
    if(el){ el.textContent = `⏱ ${fmtTime(STATE.quiz.timeLeft)}`; if(STATE.quiz.timeLeft<=30) el.classList.add('warn'); }
    if(STATE.quiz.timeLeft<=0){ clearInterval(STATE.quiz.timerId); STATE.quiz.timerId=null; showQuizResult(); }
  }, 1000);
}
function answerQuiz(o){ STATE.quiz.answers[STATE.quiz.currentIdx]=o; if(STATE.quiz.timerId){clearInterval(STATE.quiz.timerId); STATE.quiz.timerId=null;} renderQuizQuestion(); }
function nextQz(){ if(STATE.quiz.currentIdx<STATE.quiz.questions.length-1){ STATE.quiz.currentIdx++; STATE.quiz.timeLeft=STATE.quiz.totalTime; renderQuizQuestion(); } else showQuizResult(); }
function prevQz(){ if(STATE.quiz.currentIdx>0){ STATE.quiz.currentIdx--; STATE.quiz.timeLeft=STATE.quiz.totalTime; renderQuizQuestion(); } }
function gotoChapter(id){ const i = CHAPTERS.findIndex(c=>c.id===id); if(i>=0){ STATE.currentChapter=i; switchView('reader'); showToast('📖 انتقلت إلى الدرس'); } }
function showQuizResult(){
  if(STATE.quiz.timerId){ clearInterval(STATE.quiz.timerId); STATE.quiz.timerId=null; }
  const correct = STATE.quiz.questions.filter((q,i)=>STATE.quiz.answers[i]===q.correct).length;
  const pct = Math.round((correct/STATE.quiz.questions.length)*100);
  let emoji='📚', grade='يحتاج مراجعة';
  if(pct>=90){emoji='🏆';grade='ممتاز';}else if(pct>=80){emoji='⭐';grade='جيد جدًا';}else if(pct>=70){emoji='👍';grade='جيد';}else if(pct>=60){emoji='✅';grade='مقبول';}
  document.getElementById('v-quiz').innerHTML = `<div class="result">
    <div style="font-size:3.5rem">${emoji}</div>
    <div class="score">${correct} / ${STATE.quiz.questions.length}</div>
    <div class="pct">${pct}% — ${grade}</div>
    <div class="lbl">أجبت على ${correct} من ${STATE.quiz.questions.length} سؤالًا بشكل صحيح</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px">
      <button class="btn btnP" onclick="resetQuiz()">🔄 اختبار جديد</button>
      <button class="btn btnS" onclick="showQuizReview()">📝 مراجعة</button>
    </div>
  </div>`;
}
function showQuizReview(){
  let html = `<div class="chHead"><h2>📝 مراجعة</h2><button class="miniBtn" onclick="showQuizResult()">← النتيجة</button></div>`;
  STATE.quiz.questions.forEach((q,i)=>{
    const ans = STATE.quiz.answers[i]; const ok = ans===q.correct;
    html += `<div class="qzCard"><div class="qzH"><span class="qzNum">${i+1}</span><span class="qzType">${ok?'✓':'✗'}</span></div>
      <div class="qzText">${esc(q.question)}</div><div class="qzOpts">`;
    q.options.forEach(o=>{ let cls=''; if(o===q.correct)cls='correct'; else if(o===ans&&!ok)cls='wrong'; html+=`<div class="qzOpt ${cls}">${esc(o)}</div>`; });
    html += `</div></div>`;
  });
  document.getElementById('v-quiz').innerHTML = html;
}
function resetQuiz(){ STATE.quiz=null; renderQuiz(); }

/* ============================================================
   الألعاب - منظمة ومرتبة

const GAMES = [
  {id:'match', ico:'🎯', name:'المطابقة', desc:'طابق المصطلح بتعريفه'},
  {id:'fill', ico:'✏️', name:'أكمل الفراغ', desc:'اختر الكلمة الصحيحة'},
  {id:'arrange', ico:'🧩', name:'رتب الكلمات', desc:'رتب الكلمات لتكوين جملة'},
  {id:'memory', ico:'🧠', name:'الذاكرة', desc:'طابق البطاقات المتشابهة'},
  {id:'guess', ico:'🎲', name:'خمن الباب', desc:'حدد الباب من البيت'},
  {id:'speed', ico:'⚡', name:'تحدي السرعة', desc:'أجب على أكبر عدد في 60 ثانية'}
];

const GAME_CATS = [
  {title:'📚 المستوى الأول — المفردات والتعريفات', games:['match','fill']},
  {title:'🧩 المستوى الثاني — الترتيب والذاكرة', games:['arrange','memory']},

];

function renderGames(){
  const c = document.getElementById('v-games');

function openGame(id){ STATE.activeGame=id; renderGames(); }
function closeGame(){ STATE.activeGame=null; STATE.playAll=null; renderGames(); }
function startAllGames(){
  STATE.playAll = {active:true, index:0};
  STATE.activeGame = GAMES[0].id;
  renderGames();
}
function nextInPlayAll(){
  if(!STATE.playAll) return;
  STATE.playAll.index++;
  if(STATE.playAll.index >= GAMES.length){
    STATE.playAll = null;
    STATE.activeGame = null;
    const c = document.getElementById('v-games');
    c.innerHTML = `<div class="result">
      <div style="font-size:3.5rem">🏆</div>
      <div class="lbl" style="font-size:1.2rem">أكملت جميع الألعاب!</div>

        <button class="btn btnS" onclick="closeGame()">← الألعاب</button>
      </div>
    </div>`;

  }

}

function renderGame(id){
  const c = document.getElementById('v-games');
  const g = GAMES.find(x=>x.id===id);

  c.innerHTML = `<div class="gameWrap">

      <button class="btn btnS" onclick="closeGame()">← الألعاب</button>
      <h3>${g.ico} ${g.name}</h3>
      ${inPlayAll ? `
        <span class="playAllBadge">لعبة ${STATE.playAll.index+1} / ${GAMES.length}</span>
        <button class="btn btnP" onclick="nextInPlayAll()">${STATE.playAll.index === GAMES.length-1 ? 'إنهاء ✓' : 'التالي ←'}</button>
      ` : ''}
    </div>
    <div class="gameArea" id="gameArea"></div>
  </div>`;
  if(id==='match') initMatch();
  else if(id==='arrange') initArrange();
