<!DOCTYPE html>

<html lang="ar" dir="rtl" data-theme="light" data-color="brown">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مكتبة الآجرومية الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Scheherazade+New:wght@400;700&family=Lateef&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--base:16px;--font-body:'Amiri','Scheherazade New',serif;--font-ui:'Cairo',sans-serif;--bg:#f7f3ea;--surface:#fff;--surface2:#f3ecdd;--text:#2a2016;--text2:#5c4b36;--muted:#8a7a63;--border:#e5d9c3;--accent:#8b4513;--accent2:#b8860b;--accentS:#f0e0c0;--qb:linear-gradient(135deg,#fff8e7,#fdf0d5);--poem:linear-gradient(135deg,#f5f0e0,#ede2c8);--matn:linear-gradient(135deg,#eef5e8,#e2ebd9);--alfia:linear-gradient(135deg,#f3ecf9,#e8d8f5);--sh:0 4px 20px rgba(139,69,19,.08);--sh2:0 12px 40px rgba(139,69,19,.14);--r:14px;--hdr:110px;--side:280px}
[data-color="green"]{--accent:#2d6a4f;--accent2:#52b788;--accentS:#d8f3dc;--qb:linear-gradient(135deg,#edf7f0,#d8f3dc);--matn:linear-gradient(135deg,#e8f4ed,#d8ebde);--poem:linear-gradient(135deg,#eef7f1,#e2ede6);--alfia:linear-gradient(135deg,#e8f0ec,#dce8e2)}
[data-color="blue"]{--accent:#1d4e89;--accent2:#4895ef;--accentS:#d6e8fa;--qb:linear-gradient(135deg,#ecf3fc,#d6e8fa);--matn:linear-gradient(135deg,#e6f0f9,#d8e5f3);--poem:linear-gradient(135deg,#ecf3fa,#e2ecf7);--alfia:linear-gradient(135deg,#e6edf5,#dae3ee)}
[data-color="purple"]{--accent:#5a189a;--accent2:#9d4edd;--accentS:#e8d8f5;--qb:linear-gradient(135deg,#f3ecf9,#e8d8f5);--matn:linear-gradient(135deg,#f0e9f5,#e6dff0);--poem:linear-gradient(135deg,#f3ecf7,#eae2f2);--alfia:linear-gradient(135deg,#eee6f5,#e4daee)}
[data-color="teal"]{--accent:#006d77;--accent2:#2a9d8f;--accentS:#d1e8ea;--qb:linear-gradient(135deg,#ebf5f6,#d1e8ea);--matn:linear-gradient(135deg,#e6f0f1,#d8e8e9);--poem:linear-gradient(135deg,#edf4f5,#e2eaeb);--alfia:linear-gradient(135deg,#e4eded,#dae5e5)}
[data-color="rose"]{--accent:#a4133c;--accent2:#ff4d6d;--accentS:#ffd6de;--qb:linear-gradient(135deg,#fdf0f3,#ffd6de);--matn:linear-gradient(135deg,#faebef,#f2dde2);--poem:linear-gradient(135deg,#fdf0f2,#f2e2e5);--alfia:linear-gradient(135deg,#f5e8ec,#eedde3)}
[data-theme="dark"]{--bg:#14100c;--surface:#211a13;--surface2:#2b2218;--text:#f0e6d6;--text2:#d4c5ad;--muted:#9c8b74;--border:#3a2f22;--accent:#e0a86a;--accent2:#f0c674;--accentS:#3a2b1a;--qb:linear-gradient(135deg,#2b2218,#241c13);--poem:linear-gradient(135deg,#2b2418,#241c13);--matn:linear-gradient(135deg,#1d2617,#182012);--alfia:linear-gradient(135deg,#261e2e,#1e1828);--sh:0 4px 20px rgba(0,0,0,.4);--sh2:0 12px 40px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 10px)}
body{font-family:var(--font-ui);font-size:var(--base);background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden;transition:background .28s,color .28s}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:2000;transition:opacity .5s,visibility .5s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loader .basmala{font-family:var(--font-body);font-size:1.4rem;color:var(--accent);font-weight:700;text-align:center;padding:0 20px}
#loader .ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader .msg{font-size:.85rem;color:var(--muted)}
#progressBar{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:1000;transition:width .1s linear}
header#top{position:fixed;top:0;right:0;left:0;min-height:var(--hdr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;flex-direction:column;z-index:900;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.topRow{display:flex;align-items:center;gap:6px;padding:6px 10px;height:52px}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-left:auto;flex:1;min-width:0}
.brand h1{font-family:var(--font-body);font-size:.95rem;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:.65rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hBtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;flex-shrink:0}
.hBtn:hover{background:var(--surface2);color:var(--accent)}
.hBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mainNav{display:flex;gap:2px;padding:0 6px 6px;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none;height:48px;align-items:center}
.mainNav::-webkit-scrollbar{display:none}
.nBtn{padding:6px 10px;border-radius:9px;font-size:.72rem;font-weight:600;color:var(--text2);white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:4px}
.nBtn:hover{background:var(--surface2);color:var(--accent)}
.nBtn.active{background:var(--accent);color:#fff}
.nBtn .ic{font-size:.85rem}
#side{position:fixed;top:var(--hdr);right:0;bottom:0;width:var(--side);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:800;transition:transform .28s;box-shadow:-4px 0 20px rgba(0,0,0,.03)}
#side .sh{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#side .sh h2{font-family:var(--font-body);font-size:.9rem;color:var(--accent);font-weight:700}
#side .sh span{font-size:.62rem;color:var(--muted);font-weight:600}
#toc{overflow-y:auto;flex:1;padding:6px 4px 16px;scrollbar-width:thin}
#toc::-webkit-scrollbar{width:6px}
#toc::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tocI{display:flex;align-items:center;gap:6px;padding:6px 10px;margin:1px 0;border-radius:8px;font-size:.73rem;color:var(--text2);border-right:3px solid transparent;transition:all .28s;cursor:pointer;line-height:1.35}
.tocI:hover{background:var(--surface2);color:var(--accent)}
.tocI.active{background:var(--accentS);color:var(--accent);border-right-color:var(--accent);font-weight:700}
.tocI .num{font-size:.58rem;font-weight:700;color:var(--accent2);background:var(--accentS);width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tocI.active .num{background:var(--accent);color:#fff}
#sideToggle{display:none}
main{margin-right:var(--side);padding-top:calc(var(--hdr) + 12px);padding-bottom:60px;min-height:100vh;transition:margin .28s}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}
.view{display:none}
.view.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Chapter */
.chapter{margin-bottom:28px}
.chHead{background:var(--qb);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chHead .chN{font-size:.68rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 9px;border-radius:6px}
.chHead h2{font-family:var(--font-body);font-size:clamp(1rem,2.3vw,1.35rem);color:var(--accent);font-weight:700;flex:1;margin:0;min-width:100px}
.chHead .acts{display:flex;gap:2px;margin-right:auto}
.iBtn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
.iBtn:hover{background:var(--surface2);color:var(--accent)}
.iBtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iBtn.fav{color:var(--accent2)}
.iBtn.fav.saved{color:#e63946;background:#ffe4e8}
.iBtn.fav.saved svg{fill:currentColor}
.secBlk{margin-bottom:14px}
.secLbl{font-size:.7rem;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--surface2);border-radius:20px}
/* عنوان قسم مع زر العين */
.secHead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.eyeToggle{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .2s;margin-right:auto}
.eyeToggle:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.05)}
.eyeToggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* المتن */
.matnCard{background:var(--matn);border:1px solid var(--border);border-right:4px solid #5a8f4e;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);font-family:var(--font-body);font-size:1.05rem;line-height:2.05;color:var(--text);text-align:justify;font-weight:700}
[data-theme="dark"] .matnCard{border-right-color:#95d5b2}
.poemCard{background:var(--poem);border:1px solid var(--border);border-right:4px solid var(--accent2);border-radius:var(--r);padding:8px 14px;box-shadow:var(--sh);text-align:center;margin-bottom:8px}
.alfiaCard{background:var(--alfia);border:1px solid var(--border);border-right:4px solid #7c3aed;border-radius:var(--r);padding:8px 14px;box-shadow:var(--sh);text-align:center;margin-bottom:8px}
[data-theme="dark"] .alfiaCard{border-right-color:#c084fc}
.bayt{font-family:var(--font-body);font-size:1rem;line-height:1.85;color:var(--text);font-weight:700;padding:4px 2px;border-bottom:1px dashed var(--border);display:flex;flex-direction:column;gap:1px;position:relative}
.bayt:last-child{border-bottom:none}
.bayt .sadr{display:block}
.bayt .ajz{display:block;color:var(--accent)}
.alfiaCard .bayt .ajz{color:#7c3aed}
[data-theme="dark"] .alfiaCard .bayt .ajz{color:#c084fc}
/* الأسئلة */
.qaCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);position:relative}
.qaCard .q{padding:11px 14px;background:var(--qb);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start}
.qaCard .q .lbl{font-weight:700;font-size:.68rem;background:var(--accent);color:#fff;padding:2px 9px;border-radius:6px;flex-shrink:0;margin-top:3px;font-family:var(--font-ui)}
.qaCard .q p{font-family:var(--font-body);font-size:1.06rem;color:var(--text);font-weight:700;line-height:1.55;flex:1}
.qaCard .a{padding:12px 14px;background:var(--surface);display:none;font-family:var(--font-body);font-size:.98rem;color:var(--text);line-height:1.9;position:relative;font-weight:600}
.qaCard .a .lbl{font-weight:700;font-size:.65rem;background:var(--accent2);color:#fff;padding:1px 8px;border-radius:5px;margin-left:6px;font-family:var(--font-ui);vertical-align:middle}
.qaCard.showA .a{display:block}
.qaCard .aBody{flex:1}
.qaCard .aBody p{margin-bottom:5px}
.qaCard .aBody p:last-child{margin-bottom:0}
.qaCard .aBody strong{color:var(--accent)}
.chNav{display:flex;gap:8px;margin:18px 0 8px;flex-wrap:wrap;justify-content:space-between}
.chNav button{padding:9px 14px;border-radius:9px;font-weight:700;font-size:.78rem;background:var(--surface2);color:var(--text2);border:1px solid var(--border);transition:all .2s;display:flex;align-items:center;gap:6px;min-width:auto}
.chNav button:hover:not(:disabled){background:var(--accentS);color:var(--accent);border-color:var(--accent)}
.chNav button:disabled{opacity:.4;cursor:not-allowed}
.chNav .next{background:var(--accent);color:#fff;border-color:var(--accent)}
.chNav .next:hover:not(:disabled){background:var(--accent2);color:#fff}
/* Book selector */
.bookSel{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.bookSel::-webkit-scrollbar{display:none}
.bookSel button{padding:6px 11px;border-radius:7px;font-size:.72rem;font-weight:700;color:var(--text2);transition:all .2s;white-space:nowrap;flex-shrink:0}
.bookSel button.active{background:var(--accent);color:#fff}
/* Favorites */
.favItem{background:var(--poem);border:1px solid var(--border);border-right:4px solid #e63946;border-radius:var(--r);padding:10px 14px;margin-bottom:8px;position:relative;font-family:var(--font-body)}
.favItem .favCh{font-size:.65rem;color:var(--accent);font-weight:700;margin-bottom:4px;font-family:var(--font-ui)}
.favItem .favV{text-align:center;font-size:1rem;line-height:1.85;color:var(--text);font-weight:700}
.favItem .favV .sadr{display:block}
.favItem .favV .ajz{display:block;color:var(--accent)}
.favItem .favActs{position:absolute;top:6px;left:6px;display:flex;gap:2px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-family:var(--font-body);font-size:1rem}
.empty .ico{font-size:2.5rem;margin-bottom:10px;display:block;opacity:.5}
/* Quiz */
.setupBox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.setupBox h3{font-family:var(--font-body);color:var(--accent);font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.78rem;font-weight:700;color:var(--text2);margin-bottom:5px}
.fld label small{color:var(--muted);font-weight:600}
.fld input[type="number"],.fld input[type="text"],.fld select{padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-ui);font-size:.85rem;color:var(--text);width:100%;max-width:280px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS)}
.chGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;max-height:220px;overflow-y:auto;padding:8px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)}
.chChk{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;font-size:.72rem;color:var(--text2);cursor:pointer}
.chChk:hover{background:var(--accentS)}
.chChk input{accent-color:var(--accent);width:14px;height:14px}
.chChk.checked{background:var(--accentS);color:var(--accent);font-weight:700}
.miniRow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.miniBtn{padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:700;background:var(--surface2);color:var(--text2);border:1px solid var(--border);transition:all .2s}
.miniBtn:hover{background:var(--accentS);color:var(--accent);border-color:var(--accent)}
.btn{padding:10px 20px;border-radius:9px;font-weight:700;font-size:.85rem;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btnP{background:var(--accent);color:#fff}
.btnP:hover{background:var(--accent2)}
.btnS{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btnS:hover{background:var(--accentS);color:var(--accent)}
.qzTop{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.8rem;position:sticky;top:calc(var(--hdr) + 6px);z-index:50;box-shadow:var(--sh)}
.qzTop .bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.qzTop .bar div{height:100%;background:var(--accent);transition:width .3s}
.qzTop .cnt{color:var(--accent);font-weight:700;font-family:var(--font-ui)}
.timer{display:flex;align-items:center;gap:4px;padding:3px 10px;background:var(--accentS);border-radius:7px;font-weight:700;color:var(--accent);font-size:.78rem}
.timer.warn{background:#ffe4e8;color:#c44;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.qzCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.qzCard .qzH{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.qzCard .qzNum{font-size:.68rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 9px;border-radius:6px;font-family:var(--font-ui)}
.qzCard .qzType{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accentS);color:var(--accent)}
.qzText{font-family:var(--font-body);font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px;padding:10px 12px;background:var(--qb);border-radius:8px;border-right:3px solid var(--accent);white-space:pre-line}
.qzOpts{display:flex;flex-direction:column;gap:6px}
.qzOpt{padding:10px 12px;background:var(--surface2);border:2px solid var(--border);border-radius:8px;font-family:var(--font-body);font-size:.95rem;cursor:pointer;transition:all .2s;text-align:right;line-height:1.5;font-weight:600}
.qzOpt:hover{border-color:var(--accent);background:var(--accentS)}
.qzOpt.correct{border-color:#28a745;background:#d4edda;color:#155724;font-weight:700}
.qzOpt.wrong{border-color:#dc3545;background:#f8d7da;color:#721c24;font-weight:700}
[data-theme="dark"] .qzOpt.correct{background:#1e3a1e;color:#b7e4c7;border-color:#28a745}
[data-theme="dark"] .qzOpt.wrong{background:#3d1a1a;color:#f8c4ce;border-color:#dc3545}
.qzFb{margin-top:8px;padding:6px 10px;border-radius:7px;font-size:.8rem;font-weight:700;display:none}
.qzFb.show{display:block}
.qzFb.ok{background:#d4edda;color:#155724}
.qzFb.no{background:#f8d7da;color:#721c24}
[data-theme="dark"] .qzFb.ok{background:#1e3a1e;color:#b7e4c7}
[data-theme="dark"] .qzFb.no{background:#3d1a1a;color:#f8c4ce}
.qzNav{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.result{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:22px;text-align:center;box-shadow:var(--sh2)}
.result .score{font-family:var(--font-body);font-size:2.6rem;font-weight:700;color:var(--accent);margin:8px 0}
.result .pct{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.result .lbl{font-family:var(--font-body);font-size:1.05rem;color:var(--text2);margin-bottom:12px;font-weight:700}
/* Games */
.gameCat{margin-bottom:18px}
.gameCatTitle{font-family:var(--font-body);color:var(--accent);font-size:.95rem;font-weight:700;margin-bottom:8px;padding:7px 12px;background:var(--surface2);border-radius:9px;border-right:4px solid var(--accent)}
.gameMenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.gameTile{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:var(--sh)}
.gameTile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--sh2)}
.gameTile .ico{font-size:2.2rem;display:block;margin-bottom:8px}
.gameTile h4{font-family:var(--font-body);color:var(--accent);font-size:.95rem;font-weight:700;margin-bottom:4px}
.gameTile p{font-size:.68rem;color:var(--muted);line-height:1.4}
.gameWrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.gameHeader{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}

{"q":"ما الذي تختص به واو القسم؟","a":"تختص بالدخول على الاسم الظاهر دون المضمر."},
{"q":"ما الذي تختص به تاء القسم؟","a":"لا تدخل إلا على لفظ الجلالة، وقد سُمع جرها بالرب مضافًا إلى الكعبة: «تَرَبِّ الكعبة»."},
{"q":"مَثِّل لباء القسم بمثالين مختلفين.","a":"﴿وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ﴾ — «بالله أُقسم»."},
{"q":"مَيِّز الأسماء في: بسم الله الرحمن الرحيم — الحمد لله رب العالمين — ﴿إِنَّ الصَّلَاةَ تَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ﴾.","a":"اسم: الخفض بحرف. الله: الألف واللام + الخفض. الرحمن والرحيم: الألف واللام + الخفض. الصلاة: الألف واللام. الفحشاء والمنكر: الألف واللام + الخفض."},
{"q":"هل يجتمع التنوين والألف واللام؟","a":"لا يجتمعان."},
{"q":"هل تجتمع علامات الاسم الأربعة في كلمة واحدة؟","a":"لا، لأن التنوين والألف واللام لا يجتمعان. وأقصى ما يجتمع ثلاث علامات (مثل: جئتُ من المسجد)."}
]},
{"id":"alamat-fil","title":"علامات الفعل",
"matn":"وَالفِعْلُ يُعْرَفُ بِقَدْ، وَالسِّينِ، وَسَوْفَ، وَتَاءِ التَّأْنِيثِ السَّاكِنَةِ.",
"nazm":[["وَالفِعْلُ بِالسِّينِ وَسَوْفَ وَبِقَدْ","فَاعْلَمْ وَنَا التَّأْنِيثِ مَيْزُهُ وَرَدْ"]],
"alfia":[["وَنُونُ أَفْعَالِ الرُّبَاعِيِّ إِذَا","خُصَّتْ بِتَاءِ فَاعِلٍ وَقَدْ نُسِخَا"]],
"qas":[
{"q":"ما هي علامات الفعل؟","a":"قد، والسين، وسوف، وتاء التأنيث الساكنة."},
{"q":"إلى كم قسم تنقسم علامات الفعل؟","a":"ثلاثة: قسم يختص بالماضي (تاء التأنيث الساكنة)، وقسم يختص بالمضارع (السين وسوف)، وقسم يشترك (قد)."},
{"q":"ما المعاني التي تدل عليها «قد»؟","a":"مع الماضي: التحقيق والتقريب. ومع المضارع: التقليل (قد يصدق الكذوب)، والتكثير (قد ينال المجتهد بغيته)، والتحقيق (﴿وَقَدْ يَعْلَمُ اللَّهُ الْمُعَوِّقِينَ مِنْكُمْ﴾)."},
{"q":"على أي شيء تدل تاء التأنيث الساكنة؟","a":"على أن الاسم الذي أُسند إليه الفعل مؤنث، فاعلًا أو نائب فاعل."},
{"q":"«شجرة» هل هي فعل؟","a":"لا، اسمها لأنها تقبل علامات الاسم، وتاؤها متحركة بحركة إعراب لا ساكنة."},
{"q":"ما المعنى الذي تدل عليه «السين» و«سوف»؟","a":"التنفيس: تخليص المضارع من الزمن الضيق (الحال) إلى الزمن الواسع (الاستقبال)."},
{"q":"هل تعرف علامة تميز فعل الأمر؟","a":"قال ابن مالك: «وماضي الأفعال بالتاء مِزْ، وسم بالنون فعل الأمر إن أمرٌ فُهِمْ». فعلامة الأمر: قبوله نون التوكيد، ودلالته على الطلب بصيغته الذاتية."},
{"q":"مَيِّز الأسماء والأفعال في: ﴿إِنْ تُبْدُوا خَيْرًا أَوْ تُخْفُوهُ﴾.","a":"خيرًا: اسم (تنوين). تُبدوا: مضارع. تُخفوه: مضارع."}
]},
{"id":"shamila","title":"أسئلة شاملة",
"matn":"",
"nazm":[],
"alfia":[],
"qas":[
{"q":"ما هي علامة الحرف؟","a":"عدم العلامة: ما لا يدخل عليه علامة الاسم ولا الفعل."},
{"q":"ضَعْ كل كلمة في كلام مفيد: النخلة، الفيل، ينام، فَهِم، الحديقة، الأرض، الماء، يأكل، الثمرة، الفاكهة، يحصد، يذاكر.","a":"النخلة: قال ﷺ «الخمر من هاتين الشجرتين: النخلة والعنبة». الفيل: ﴿أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ﴾. ينام: كان ﷺ ينام وهو جنب ولا يمس ماء. فهم: فهمتُ الدرسَ فهمًا جيدًا. الحديقة: قال ﷺ لامرأة ثابت: «أتردِّين عليه حديقته؟». الأرض: ﴿إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا﴾. الماء: ﴿وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ﴾. يأكل: «لا يغرس مسلم غرسًا فيأكل منه إنسان إلا كانت له صدقة». يحصد: الفلاحُ يحصد زرعه صباحًا. يذاكر: إن يذاكر الطالبُ ينجح."},
{"q":"بيِّن الأفعال والأسماء والحروف في: ﴿مَا جَعَلَ اللَّهُ لِرَجُلٍ مِنْ قَلْبَيْنِ فِي جَوْفِهِ﴾... يحرص العاقل... احرث...","a":"جعل: ماض. يحرص: مضارع. احرث: أمر. الله: اسم. ما: حرف. رجل: اسم. اللام: حرف. جوفه: اسم. في: حرف. العاقل: اسم."},
{"q":"ضَعْ كلمة يتم بها المعنى وبيّن عدد الأجزاء ونوعها: يحفظ الدرس. زرعتُ الأرض.","a":"يحفظ الطالب الدرس: 3 أجزاء — يحفظ (فعل مضارع)، الطالب (اسم)، الدرس (اسم). زرعتُ الأرض: 3 أجزاء — زرع (ماضٍ)، التاء (ضمير اسم)، الأرض (اسم)."}
]},
{"id":"irab","title":"باب الإعراب",
"matn":"الإِعْرَابُ هُوَ تَغْيِيرُ أَوَاخِرِ الكَلِمِ؛ لِاخْتِلَافِ العَوَامِلِ الدَّاخِلَةِ عَلَيْهَا، لَفْظًا أَوْ تَقْدِيرًا.",
"nazm":[["الإِعْرَابُ تَغْيِيرُ أَوَاخِرِ الكَلِمْ","تَقْدِيرًا أَوْ لَفْظًا فَذَا الخَدَّ اغْتَنِمْ"],["وَذَلِكَ التَّغْيِيرُ لِاضْطِرَابِ","عَوَامِلٍ تَدْخُلُ لِلْإِعْرَابِ"]],
"alfia":[["الإِعْرَابُ تَغْيِيرُ أَوَاخِرِ الكَلِمْ","تَقْدِيرًا أَوْ لَفْظًا فَذَا الخَدَّ اغْتَنِمْ"]],
"qas":[
{"q":"ما هو الإعراب لغة واصطلاحًا؟","a":"لغةً: الإظهار والإبانة. اصطلاحًا: تغيير أواخر الكلم لاختلاف العوامل الداخلة عليها، لفظًا أو تقديرًا."},
{"q":"ما هو البناء لغة واصطلاحًا؟","a":"لغةً: وضع شيء على شيء للثبوت واللزوم. اصطلاحًا: لزوم آخر الكلمة حالة واحدة لغير عامل ولا اعتلال."},
{"q":"ما هو المعرب؟ وما هو المبني؟","a":"المعرب: ما يتغير آخره لفظًا أو تقديرًا بتغير العوامل. المبني: ما يلزم آخره حالة واحدة فلا يتغير."},
{"q":"ما المقصود بـ«تغيير أواخر الكلم»؟","a":"تغيير أحوال أواخر الكلم (الحركة)، لا نفس الأواخر."},
{"q":"ما الذي خرج بقول المؤلف «تغيير أواخر الكلم»؟","a":"تغيير أوائلها وأوسطها، فلا مبحث فيه في النحو بل في الصرف. مثاله: «فَلْس» عند التصغير «فُلَيْس»."},
{"q":"ما معنى «لاختلاف العوامل الداخلة عليها» وما الذي خرج به؟","a":"معناه: أن أحوال أواخر الكلمات تتغير من أجل اختلاف العوامل. وخرج به: التغيير بسبب اختلاف اللغات، والتغيير بسبب اختلاف المخاطب — فلا يعدان إعرابًا."},
{"q":"إلى كم قسم ينقسم التغيير؟","a":"قسمان: لفظي وتقديري غير ظاهر. لفظي إن كان الحرف الأخير صحيحًا، وتقديري إن كان معتلًّا."},
{"q":"ما هو التغيير اللفظي وما هو التقديري؟","a":"اللفظي: الملفوظ به (يضربُ زيدٌ، لن أضربَ زيدًا). التقديري: الذي يمنع من التلفظ به مانع — تعذُّر أو استثقال أو مناسبة (جاء الفتى، مررتُ بالفتى)."},
{"q":"ما هي حروف العلة؟","a":"الألف، والياء المكسور ما قبلها، والواو المضموم ما قبلها."},
{"q":"ما هي أحكام حروف العلة؟","a":"الألف: تُقدَّر عليها جميع الحركات (التعذر). والياء والواو: تُقدَّر عليهما الضمة والكسرة (الثقل)، وتظهر الفتحة لخفتها."},
{"q":"ائتِ بثلاثة أمثلة لكلام مفيد في كل مثال اسم معرب بحركة مقدرة منع من ظهورها التعذر.","a":"الأول: ﴿قَالُوا سَمِعْنَا فَتًى يَذْكُرُهُمْ﴾ — فتى مفعول به منصوب بفتحة مقدرة. الثاني: ﴿إِنَّمَا الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ﴾ — عيسى بدل مرفوع بضمة مقدرة. الثالث: ﴿وَإِذْ نَادَى رَبُّكَ مُوسَى﴾ — موسى مفعول به منصوب بفتحة مقدرة."},
{"q":"ائتِ بمثالين في كل منهما اسم معرب بحركة مقدرة منع من ظهورها الثقل.","a":"﴿فَتَوَلَّ عَنْهُمْ يَوْمَ يَدْعُ الدَّاعِ﴾ — الداع فاعل بضمة مقدرة. ﴿وَتَأْتُونَ فِي نَادِيكُمُ الْمُنْكَرَ﴾ — ناديكم اسم مجرور بكسرة مقدرة."},
{"q":"ائتِ بثلاثة أمثلة في كل مثال منها اسم مبني.","a":"﴿كَيْفَ تَكْفُرُونَ بِاللَّهِ﴾ — كيف اسم مبني. ﴿وَيَقُولُونَ هَؤُلَاءِ شُفَعَاؤُنَا﴾ — هؤلاء اسم مبني. ﴿أُولَئِكَ الَّذِينَ صَدَقُوا﴾ — أولئك اسم مبني."},
{"q":"ائتِ بثلاثة أمثلة في كل مثال منها اسم معرب بحركة مقدرة منع من ظهورها المناسبة.","a":"﴿لَئِنْ أَقَمْتُمُ الصَّلَاةَ وَآتَيْتُمُ الزَّكَاةَ وَآمَنْتُمْ بِرُسُلِي﴾ — «رسلي» مجرور بكسرة مقدرة. ﴿إِنْ كُنْتُمْ خَرَجْتُمْ جِهَادًا فِي سَبِيلِي وَابْتِغَاءَ مَرْضَاتِي﴾ — «مرضاتي» مجرور بكسرة مقدرة. ﴿وَإِنَّ اللَّهَ رَبِّي وَرَبُّكُمْ﴾ — «ربي» خبر إن مرفوع بضمة مقدرة."}
]},
{"id":"anwa-irab","title":"أنواع الإعراب",
"matn":"وَأَقْسَامُهُ أَرْبَعَةٌ: رَفْعٌ، وَنَصْبٌ، وَخَفْضٌ، وَجَزْمٌ. فَلِلْأَسْمَاءِ مِنْ ذَلِكَ الرَّفْعُ، وَالنَّصْبُ، وَالخَفْضُ، وَلَا جَزْمَ. وَلِلْأَفْعَالِ مِنْ ذَلِكَ الرَّفْعُ، وَالنَّصْبُ، وَالجَزْمُ، وَلَا خَفْضَ.",
"nazm":[["أَقْسَامُهُ أَرْبَعَةٌ تُؤَمُّ","رَفْعٌ وَنَصْبٌ ثُمَّ خَفْضٌ جَزْمٌ"],["فَالْأَوَّلَانِ دُونَ رَيْبٍ وَقَعَا","فِي الاسْمِ وَالفِعْلِ المُضَارِعِ مَعَا"],["وَالاسْمُ قَدْ خُصِّصَ بِالخَفْضِ كَمَا","قَدْ خُصِّصَ الفِعْلُ بِجَزْمٍ فَاعْلَمَا"]],
"alfia":[["وَالاسْمُ قَدْ خُصِّصَ بِالخَفْضِ كَمَا","قَدْ خُصِّصَ الفِعْلُ بِجَزْمٍ فَاعْلَمَا"]],
"qas":[
{"q":"ما هي أقسام الإعراب؟","a":"أربعة: الرفع، والنصب، والخفض، والجزم."},
{"q":"ما الدليل على انحصارها؟","a":"التتبع والاستقراء لكلام العرب."},
{"q":"عَرِّف الرفع لغة واصطلاحًا.","a":"لغةً: العلو والارتفاع. اصطلاحًا: تغير مخصوص علامته الضمة وما ناب عنها."},
{"q":"ما هو معنى النصب لغة واصطلاحًا؟","a":"لغةً: الاستواء والاستقامة. اصطلاحًا: تغير مخصوص علامته الفتحة وما ناب عنها."},
{"q":"ما هو معنى الخفض لغة واصطلاحًا؟","a":"لغةً: ضد الرفع. اصطلاحًا: تغير مخصوص علامته الكسرة وما ناب عنها."},
{"q":"ما هو معنى الجزم لغة واصطلاحًا؟","a":"لغةً: القطع. اصطلاحًا: تغير مخصوص علامته السكون وما ناب عنها."},
{"q":"ما هي أنواع الإعراب التي يشترك فيها الاسم والفعل؟","a":"الرفع والنصب."},
{"q":"ما الذي يختص به الاسم؟","a":"الخفض، فلا يوجد فعل مخفوض."},
{"q":"ما الذي يختص به الفعل؟","a":"الجزم، فلا يوجد اسم مجزوم."},
{"q":"مَثِّل بأربعة أمثلة لكل من: الاسم المرفوع، الفعل المنصوب، الاسم المخفوض، الفعل المجزوم.","a":"المرفوع: ﴿لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ﴾ — الله فاعل مرفوع. المنصوب: ﴿لَنْ نَبْرَحَ عَلَيْهِ عَاكِفِينَ﴾ — نبرح منصوب. المخفوض: ﴿عَنْ سَبِيلِهِ﴾ — سبيله مجرور. المجزوم: ﴿وَمَا تَفْعَلُوا مِنْ خَيْرٍ يَعْلَمْهُ اللَّهُ﴾ — تفعلوا ويعلمه مجزومان."}
]},
{"id":"alamat-irab","title":"علامات الإعراب والضمة",
"matn":"لِلرَّفْعِ أَرْبَعُ عَلَامَاتٍ: الضَّمَّةُ، وَالوَاوُ، وَالأَلِفُ، وَالنُّونُ. وَلِلنَّصْبِ خَمْسُ عَلَامَاتٍ: الفَتْحَةُ، وَالأَلِفُ، وَالكَسْرَةُ، وَاليَاءُ، وَحَذْفُ النُّونِ. وَلِلخَفْضِ ثَلَاثُ عَلَامَاتٍ: الكَسْرَةُ، وَاليَاءُ، وَالفَتْحَةُ. وَلِلْجَزْمِ عَلَامَتَانِ: السُّكُونُ، وَالحَذْفُ.",
"nazm":[["ضَمٌّ وَوَاوٌ أَلِفٌ وَالنُّونُ","عَلَامَةُ الرَّفْعِ بِهَا تَكُونُ"],["فَارْفَعْ بِضَمَّةٍ مُفْرَدَ الأَسْمَاءِ","جَاءَ زَيْدٌ صَاحِبُ العَلَاءِ"],["وَارْفَعْ بِهِ الجَمْعَ المُكَسَّرَ وَمَا","جُمِعَ مِنْ مُؤَنَّثٍ فَسَلِمَا"],["وَارْفَعْ بِنُونٍ يَفْعَلَانِ يَفْعَلُونَ","وَتَفْعَلَانِ تَفْعَلِينَ تَفْعَلُونَ"]],
"alfia":[["وَلِلْمَرْفُوعَاتِ أَرْبَعُ عَلَامَاتٍ","فَاعْلَمْ وَالْأَصْلُ فِي ذَاكَ الضَّمُّ"]],
"qas":[
{"q":"كم علامات الرفع؟ وما دليل انحصارها؟","a":"أربعة: الضمة، والواو، والألف، والنون. ودليل انحصارها التتبع والاستقراء."},
{"q":"في كم موضع تكون الضمة علامة للرفع؟","a":"أربعة: الاسم المفرد، وجمع التكسير، وجمع المؤنث السالم، والفعل المضارع الذي لم يتصل بآخره شيء."},
{"q":"ما المراد بالاسم المفرد هنا؟","a":"ما دلّ على واحد أو واحدة — ليس مثنى ولا مجموعًا ولا ملحقًا ولا من الأسماء الخمسة، مذكرًا أو مؤنثًا، ضمة ظاهرة أو مقدرة."},
{"q":"مَثِّل للاسم المفرد بأربعة أمثلة: مذكر ظاهرة، مذكر مقدرة، مؤنث ظاهرة، مؤنث مقدرة.","a":"الأول: ﴿قَالَ نُوحٌ﴾ — مذكر بضمة ظاهرة. الثاني: ﴿قَالَ مُوسَى﴾ — مذكر بضمة مقدرة. الثالث: ﴿قَالَتْ نَمْلَةٌ﴾ — مؤنث بضمة ظاهرة. الرابع: ﴿قَالَ هِيَ عَصَايَ﴾ — مؤنث بضمة مقدرة."},
{"q":"ما هو جمع التكسير؟ وعلى كم نوع يكون التغير فيه؟","a":"ما دلّ على أكثر من اثنين أو اثنتين مع تغير في صيغة مفرده. والتغير ستة: بالشكل، بالنقص، بالزيادة، بالشكل والنقص، بالشكل والزيادة، بالكل."},
{"q":"مَثِّل لجمع التكسير الدال على مذكّرين (الضمة مقدرة) ومؤنثات (الضمة ظاهرة).","a":"مثال المذكرين: «حضر الجرحى وغِلماني» — ضمة مقدرة (تعذر / مناسبة). مثال المؤنثات: «قامت الزيانبُ» — ضمة ظاهرة."},
{"q":"ما هو جمع المؤنث السالم؟ وهل تكون الضمة مقدرة فيه؟","a":"ما دلّ على أكثر من اثنين أو اثنتين بزيادة ألف وتاء. والضمة لا تكون مقدرة إلا عند إضافته لياء المتكلم (شجراتي)."},
{"q":"متى يُرفع الفعل المضارع بالضمة؟","a":"إذا لم يتصل بآخره شيء. فإن اتصل بنون التوكيد أو نون النسوة بُني. وإن اتصل بألف الاثنين أو واو الجماعة أو ياء المخاطبة رُفع بثبوت النون."},
{"q":"«النساءُ يَعْفُونَ» — هل الفعل مرفوع بالضمة؟","a":"لا؛ لاتصاله بنون النسوة."},
{"q":"﴿كَلَّا لَيُنْبَذَنَّ﴾ — هل الفعل مرفوع بالضمة؟","a":"لا؛ لاتصاله بنون التوكيد."},
{"q":"«الرجالُ يقومون» — هل الفعل مرفوع بالضمة؟","a":"لا؛ لاتصاله بواو الجماعة، والرفع بثبوت النون."},
{"q":"بيِّن المرفوعات بالضمة الظاهرة والمقدرة من: «قالت أعرابية لرجل ما لك تُغْطَى ولا تَعِدُ... يَنفَسِحُ به البصر، وتَطِيبُ بذِكره النفوس...».","a":"أعرابية: ضمة ظاهرة. تُغْطَى: ضمة مقدرة (ثقل). تَعِدُ: ضمة ظاهرة. يَنفَسِحُ: ظاهرة. البصر: ظاهرة. الأمل: ظاهرة. النفوس: ظاهرة. تَطِيبُ: ظاهرة. العيش: مقدرة (تعذر). المودّات: ظاهرة. يُرْبَحُ: ظاهرة. المدح: ظاهرة. الوفاء: ظاهرة."}
]},
{"id":"waw","title":"نيابة الواو عن الضمة",
"matn":"وَأَمَّا الوَاوُ فَتَكُونُ عَلَامَةً لِلرَّفْعِ فِي مَوْضِعَيْنِ: فِي جَمْعِ المُذَكَّرِ السَّالِمِ، وَفِي الأَسْمَاءِ الخَمْسَةِ، وَهِيَ: أَبُوكَ، وَأَخُوكَ، وَحَمُوكَ، وَفُوكَ، وَذُو مَالٍ.",
"nazm":[["وَارْفَعْ بِوَاوٍ خَمْسَةً أَخُوكَا","أَبُوكَ ذُو مَالٍ حَمُوكَ فُوكَا"],["وَهَكَذَا الجَمْعُ الصَّحِيحُ فَاعْرِفِ"]],
"alfia":[["وَارْفَعْ بِوَاوٍ وَبِيَاءٍ مُبْدَلًا","مِنْ أَلِفٍ كِلْتَاهُمَا قَدْ أُبْدِلَا"]],
"qas":[
{"q":"لماذا أتى المؤلف بالواو بعد الضمة؟","a":"لأن الضمة إذا أُشبعت تولّد منها الواو، فهي أقرب شيء للضمة."},
{"q":"في كم موضع تكون الواو علامة للرفع؟","a":"موضعان: جمع المذكر السالم، والأسماء الخمسة."},
{"q":"ما هو جمع المذكر السالم؟ مَثِّل في الرفع بثلاثة أمثلة.","a":"اسم دلّ على أكثر من اثنين بزيادة واو ونون في الرفع وياء ونون في النصب والجر، صالح للتجريد. الأمثلة: ﴿فَرِحَ الْمُخَلَّفُونَ﴾، ﴿لَكِنِ الرَّاسِخُونَ فِي الْعِلْمِ مِنْهُمْ وَالْمُؤْمِنُونَ﴾، ﴿وَلَوْ كَرِهَ الْمُجْرِمُونَ﴾."},
{"q":"اذكر الأسماء الخمسة وشروط رفعها بالواو.","a":"أبوك، وأخوك، وحموك، وفوك، وذو مال. ويشترط: الإفراد، والتكبير، والإضافة إلى غير ياء المتكلم."},
{"q":"ما الذي يشترط في «ذو» و«فوك» خاصة؟","a":"«ذو»: بمعنى صاحب، ومضافة إلى اسم جنس ظاهر غير صفة. «فوك»: خالية من الميم."},
{"q":"﴿أَنْتُمْ وَآبَاؤُكُمْ﴾ — علامة رفع «آباؤكم»؟","a":"الضمة؛ لأنها جمع تكسير، لا بالواو لأن شرط الرفع بالواو الإفراد."},
{"q":"﴿وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ﴾ — إعراب «ذو»؟","a":"خبر مرفوع بالواو نيابة عن الضمة، لأنه من الأسماء الخمسة، وهو مضاف."},
{"q":"«هذا فمُك» — لماذا لم تُرفع «فم» بالواو؟","a":"لأن من شروط الرفع بالواو أن تكون خالية من الميم، وهنا بها ميم فترفع بالضمة لأنها اسم مفرد."},
{"q":"أعرب: قعد أبوك وراءك. جاء أبوان.","a":"قعد أبوك: قعد فعل ماضٍ، أبوك فاعل مرفوع بالواو (من الأسماء الخمسة). جاء أبوان: أبوان فاعل مرفوع بالألف لأنه مثنى، فقد شرط الإفراد."},
{"q":"بيِّن المرفوع بالضمة والواو من: ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ﴾ — إخوانك هم أعوانك — أبوك يتمنى لك الخير.","a":"المؤمنون: جمع مذكر سالم (بالواو). إخوانك: جمع تكسير (بالضمة). أعوانك: جمع تكسير (بالضمة). أبوك: من الأسماء الخمسة (بالواو)."},
{"q":"ضع اسمًا من الأسماء الخمسة مرفوعًا بالواو: إذا دعاك ... فأجبه. لقد كان معي ... بالأمس. ... كان صديقًا لي. هذا الكتاب أرسله لك ... علم.","a":"أبوك — أخوك — حموك — ذو علم."},
{"q":"ضع جمع تكسير مرفوعًا بالضمة الظاهرة في بعضها والمقدرة في بعضها: ... أعوانك عند الشدة. حضر ... فأكرمتهم. كان معنا أمس ... كرام. ... تفضح الكذوب.","a":"إخوانك — أصحابي — فتْيان — المحن."}
]},
{"id":"alif","title":"نيابة الألف عن الضمة",
"matn":"وَأَمَّا الأَلِفُ فَتَكُونُ عَلَامَةً لِلرَّفْعِ فِي تَثْنِيَةِ الأَسْمَاءِ خَاصَّةً.",
"nazm":[["وَرَفْعُ مَا ثَنَّيْتَهُ بِالْأَلِفِ"]],
"alfia":[["وَارْفَعْ بِأَلِفٍ كِلْتَاهُمَا"]],
"qas":[
{"q":"في كم موضع تكون الألف علامة على رفع الكلمة؟","a":"موضع واحد فقط، وهو المثنى."},
{"q":"ما هو المثنى؟ مَثِّل بمثالين.","a":"اسم دلّ على اثنين أو اثنتين بزيادة ألف ونون في الرفع وياء ونون في النصب والجر. مذكر: ﴿قَالَ رَجُلَانِ﴾. مؤنث: ﴿وَامْرَأَتَانِ مِمَّنْ تَرْضَوْنَ﴾."},
{"q":"رُدَّ الجموع إلى مفردها ثم ثنِّ: جمال، أفيال، سيوف، صهاريج، نجوم، حدائق، بساتين، قراطيس، مخابز، أحذية، قمص، أطباء، طرق، شرفاء، مقاعد، علماء، جدران، شبابيك، أبواب، نوافذ، آنسات، رُكّع، أمور، بلاد، أقطار، تفاحات.","a":"جمل/جملان، فيل/فيلان، سيف/سيفان، صهريج/صهريجان، نجم/نجمان، حديقة/حديقتان، بستان/بستانان، قرطاس/قرطاسان، مخبز/مخبزان، حذاء/حذاءان، قميص/قميصان، طبيب/طبيبان، طريق/طريقان، شريف/شريفان، مقعد/مقعدان، عالم/عالمان، جدار/جداران، شباك/شبكان، باب/بابان، نافذة/نافذتان، آنسة/آنستان، راكع/راكعان، أمر/أمران، بلد/بلدان، قطر/قطران، تفاحة/تفاحتان."},
{"q":"ضع المثنيات في جمل مفيدة: العالمان، الواليان، الأخوان، المجتهدان، الهاديان، الصديقان، الحديقتان، الفتاتان، الكتابان، الشريفان، القطران، الجداران، الطبيبان، الأمران، الفارسان، المقعدان، العذراوان، السيفان، الماجدان، الخطابان، الأبوان، البلدان، البستانان، الطريقان، راكعان، دولتان، بابان، تفاحتان، نجمان.","a":"العالمان المسلمان يخافان ربهما — جاء الواليان العادلان — ذهب الأخوان إلى المسجد — المجتهدان لهما أجر كبير — الكتاب والسنة هما الهاديان — التقى الصديقان — الحديقتان مملوءتان بالأشجار — جاءت الفتاتان — هذان الكتابان جاءا — جاء الشريفان — هذان القطران يدين أهلهما بالإسلام — ثبت الجداران — اعتنى الطبيبان بالمريض — هذان الأمران وصلا — حضر الفارسان — هذان المقعدان لكما — الفتاتان العذراوان تجيدان القراءة — برق السيفان — الطالبان الماجدان أحق بالاحترام — أتى الخطابان — حضر الأبوان — هذان البلدان انتصر فيهما المسلمون — البستانان خرجت ثمارهما طيبة — هذان الطريقان يوصلان إلى رضوان الله — هذان رجلان راكعان — مصر والجزائر دولتان — المعتزلة والرافضة بابان للشر — وقعت تفاحتان — سقط نجمان."},
{"q":"ضع مثنى: سافر ... إلى مصر ليشاهدا آثارها. حضر أخي ومعه ... فأكرمتهم. ولد الخالد ... فسمّى أحدهما محمدًا والآخر عليًّا.","a":"السائحان — صاحباه — ذَكَرانِ."},
{"q":"أعرب: جاء العمران (أبو بكر وعمر). قامت المرأتان. احترقت السيارتان. استنار القمران.","a":"جاء: ماضٍ. العمران: فاعل مرفوع بالألف (ملحق بالمثنى). أبو: بدل مرفوع بالواو. بكر: مضاف إليه. عمر: معطوف مرفوع. — قامت: ماضٍ والتاء للتأنيث. المرأتان: فاعل مرفوع بالألف (مثنى). — احترقت السيارتان: السيارتان فاعل مرفوع بالألف. — استنار القمران: القمران فاعل مرفوع بالألف (ملحق بالمثنى)."}
]},
{"id":"nun","title":"نيابة النون عن الضمة",
"matn":"وَأَمَّا النُّونُ فَتَكُونُ عَلَامَةً لِلرَّفْعِ فِي الفِعْلِ المُضَارِعِ؛ إِذَا اتَّصَلَ بِهِ ضَمِيرُ تَثْنِيَةٍ، أَوْ ضَمِيرُ جَمْعٍ، أَوْ ضَمِيرُ المُؤَنَّثَةِ المُخَاطَبَةِ.",
"nazm":[["وَارْفَعْ بِنُونٍ يَفْعَلَانِ يَفْعَلُونَ","وَتَفْعَلَانِ تَفْعَلِينَ تَفْعَلُونَ"]],
"alfia":[["وَالأَفْعَالُ الْخَمْسَةُ تُرْفَعُ بِالنُّونِ"]],
"qas":[
{"q":"في كم موضع تكون النون علامة على رفع الكلمة؟","a":"موضع واحد: الفعل المضارع إذا اتصل به ألف الاثنين أو الاثنتين، أو واو الجماعة، أو ياء المخاطبة."},
{"q":"بماذا يبدأ الفعل المضارع المسند إلى ألف الاثنين؟","a":"بالياء للغيبة أو التاء للخطاب. والمسند إلى ألف الاثنتين لا يكون مبدوءًا إلا بالتاء."},
{"q":"ما هي الأفعال الخمسة؟","a":"كل فعل مضارع اتصل بآخره ألف الاثنين، أو واو الجماعة، أو ياء المخاطبة. الأوزان: يفعلان، تفعلان، يفعلون، تفعلون، تفعلين."},
{"q":"ضع فعلاً من الأفعال الخمسة: الأولاد ... في النهر. الآباء ... على أبنائهم. أنتما ... ببطء. هؤلاء الرجال ... في الحقل. أنت يا زينب ... واجبك. الفتاتان ... الجندي. أنتم ... أوطانكم. أنت يا سعاد ... بالكرة.","a":"يسبحون — يعطفون — تمشيان — يزرعون — تؤدين — تحميان — تحبون — تلعبين."},
{"q":"استعمل في جملة: تلعبان، تؤدين، تزرعون، تحصدان، تحدثان، تسيرون، يسبحون، تخدمون، تنشئان، ترضين.","a":"أنتما تلعبان بالكرة — أنت تؤدين عملَك بنشاط — أنتم تزرعون الأرض بجد — أنتما تحصدان الزرع بسرعة — أنتما تحدثان بالواقع — أنتم تسيرون في طريق الخير — الصيادون يسبحون بمهارة — أنتم تخدمون أباكم — أنتما تنشئان روحًا طيبة — ألا ترضين يا أيتها الفتاة بما يرضي الله."},
{"q":"ضع فعلاً من الأفعال الخمسة مع: الطالبان، العِلمان، المسلمون، الرجال الذين يؤدون، أنتِ أيتها الفتاة، أنتم يا قوم، هؤلاء التلاميذ، إذا خالفتِ.","a":"الطالبان يجتهدان — العِلمان يلعبون — المسلمون يفدون الإسلام — الرجال الذين يؤدون يتقون الله — أنتِ تطلبين العلم — أنتم تحبون الله ورسوله — هؤلاء يتعلمون العقيدة — إذا خالفتِ فسوف تندمين."},
{"q":"بين المرفوع بالضمة/الألف/الواو/ثبوت النون من: «كُتاب الملوك عَيبتهم المصونة...» «الشجاعة غريزة يضعها الله لمن يشاء» «الشكر شكران: بإظهار النعمة...» «المتقون هم الذين يؤمنون بالله».","a":"كُتاب: مبتدأ بالضمة. عَيبتهم: خبر بالضمة. المصونة: نعت بالضمة. الشجاعة: بالضمة. غريزة: بالضمة. الله: بالضمة. يشاء: بالضمة. الشكر: بالضمة. شكران: بالضمة. أولهما: بالضمة. أبلغ: بالضمة. المتقون: بالواو (جمع مذكر سالم). يؤمنون: بثبوت النون (الأفعال الخمسة)."},
{"q":"أعرب: الرجال يقومون. أنتِ تقومين. جاءت المرأتان كلتاهما.","a":"الرجال: مبتدأ بالضمة. يقومون: مضارع مرفوع بثبوت النون (الأفعال الخمسة)، والواو فاعل. — أنتِ: مبتدأ. تقومين: مضارع بثبوت النون، والياء فاعل. — جاءت: ماضٍ. المرأتان: فاعل بالألف. كلتاهما: توكيد للمرأتان مرفوع بالألف (ملحق بالمثنى)."},
{"q":"بيِّن الصحيح: «قام أبوك» أم «قام أباك»؟ «قام أبو زيد» أم «قام أبا زيد»؟ «قام الزيدان» أم «قام الزيدين»؟ «الرجال يقوموا» أم «يقومون»؟ «قامت المسلمات» أم «قام المسلمات»؟ «قام رجلان اثنان»؟","a":"الصحيح: قام أبوك (فاعل بالواو). قام أبو زيد (فاعل بالواو). قام الزيدان (فاعل بالألف). الرجال يقومون (بثبوت النون). قامت المسلمات (فاعل بالضمة، جمع مؤنث سالم). قام رجلان اثنان (رجلان فاعل بالألف، اثنان توكيد ملحق بالمثنى)."},
{"q":"ما تقول في «كلا» و«كلتا»؟","a":"ملحقان بالمثنى، وشرط لحوقهما به أن يضافا إلى ضمير تثنية."}
]},
{"id":"nash","title":"علامات النصب والفتحة",
"matn":"وَلِلنَّصْبِ خَمْسُ عَلَامَاتٍ: الفَتْحَةُ، وَالأَلِفُ، وَالكَسْرَةُ، وَاليَاءُ، وَحَذْفُ النُّونِ. فَأَمَّا الفَتْحَةُ فَتَكُونُ عَلَامَةً لِلنَّصْبِ فِي ثَلَاثَةِ مَوَاضِعَ: فِي الاسْمِ المُفْرَدِ، وَجَمْعِ التَّكْسِيرِ، وَالفِعْلِ المُضَارِعِ إِذَا دَخَلَ عَلَيْهِ نَاصِبٌ وَلَمْ يَتَّصِلْ بِآخِرِهِ شَيْءٌ.",
"nazm":[["عَلَامَةُ النَّصْبِ لَهَا كُنْ مُحْصِيَا","الفَتْحَ وَالأَلِفَ وَالكَسْرَ وَيَا"],["مُكَسَّرُ الجُمُوعِ ثُمَّ المُفْرَدُ","ثُمَّ المُضَارِعُ الَّذِي كَتَسْعَدُ"]],
"alfia":[["وَلِلنَّصْبِ خَمْسُ عَلَامَاتٍ"]],
"qas":[
{"q":"كم للنصب من علامة؟","a":"خمس: الفتحة، والألف، والكسرة، والياء، وحذف النون."},
{"q":"لماذا ثنّى المؤلف بالألف بعد الفتحة؟","a":"لأن الفتحة إذا أُشبعت تولّد منها الألف."},
{"q":"في كم موضع تكون الفتحة علامة على النصب؟","a":"ثلاثة: الاسم المفرد، وجمع التكسير، والفعل المضارع الذي سبقه ناصب ولم يتصل بآخره شيء."},
{"q":"مَثِّل للاسم المفرد المنصوب بأربعة أمثلة.","a":"مذكر بفتحة ظاهرة: ﴿اشْتَرَوُا الْكُفْرَ﴾. مذكر بفتحة مقدرة: ﴿وَآتَيْنَا عِيسَى﴾. مؤنث بفتحة ظاهرة: ﴿عَرَضْنَا الْأَمَانَةَ﴾. مؤنث بفتحة مقدرة: ﴿ظَلَمْتُ نَفْسِي﴾."},
{"q":"مَثِّل لجمع التكسير المنصوب بأربعة أمثلة.","a":"رسلنا (ظاهرة مذكر). سُكارى (مقدرة مذكر). شجرها (ظاهرة مؤنث). نسائي (مقدرة مؤنث)."},
{"q":"متى يُنصب الفعل المضارع بالفتحة؟","a":"بشرطين: وجود ناصب، وعدم اتصال آخره بشيء (نونا التوكيد والنسوة والألف والواو والياء). فإن اتصل بنون التوكيد بُني على الفتح. وإن اتصل بنون النسوة بُني على السكون. وإن اتصل بألف الاثنين أو واو الجماعة أو ياء المخاطبة نُصب بحذف النون."},
{"q":"مَثِّل للفعل المضارع المنصوب بمثالين مختلفين.","a":"﴿لَنْ نَبْرَحَ عَلَيْهِ عَاكِفِينَ﴾ — منصوب بلن. ﴿أَنْ يُتِمَّ الرَّضَاعَةَ﴾ — منصوب بأن."},
{"q":"بماذا يُنصب الفعل المضارع الذي اتصل به ألف الاثنين؟","a":"بحذف النون."},
{"q":"إذا اتصل بآخر الفعل المضارع المسبوق بناصب نون توكيد فما حكمه؟","a":"يُبنى على الفتح في محل نصب."},
{"q":"مَثِّل للفعل المضارع المتصل بنون النسوة والمنصوب.","a":"﴿وَلَا يَحِلُّ لَهُنَّ أَنْ يَكْتُمْنَ﴾ — يكتمن مبني على السكون في محل نصب."},
{"q":"«أكرمتُ الطلبة» — لماذا نصبتها بالفتحة؟ وما مفردها؟","a":"لأنها جمع تكسير، ومفردها «الطالب»."},
{"q":"«أكرمتُ الطالب» — كيف تُحرّك الباء؟","a":"بالنصب: الطالبَ، لأنه مفعول به منصوب بالفتحة (اسم مفرد)."},
{"q":"استعمل في جمل منصوبة: الحقل، الزهرة، الطلاب، الكرة، الحديقة، النهر، الكتاب، البستان، القلم، الفرس، الغلمان، العذارى، العصا، الهدى، يشرب، يرضى، يرتجي، تسافر.","a":"زرع أبي الحقلَ قمحًا — قطفتُ الزهرة — أحببتُ الطلابَ — تركتُ الكرة — رأيتُ الحديقة — فجّرنا نهرًا — قرأتُ الكتابَ — رأيتُ البستان — إن القلمَ أداة — رأيتُ الفرس — رأيتُ الغلمانَ — أحببتُ العذارى — رأيتُ العصا — اتبعتُ الهدى — لن يشربَ — لن يرضى — لن يرتجي — لن تسافرَ."},
{"q":"ضع اسمًا منصوبًا بالفتحة: إن ... يعطفون على أبنائهم. أطع ... لأنه يهذبك. احترم ... لأنها ربتك. ذاكر ... قبل أن تحضرها. أدِّ ... فإنك بهذا تخدم وطنك. كن ... فإن الجبن لا يؤخر الأجل. الزم ... فإن الهذر عيب. احفظ ... عن التكلم في الناس. إن الرجل ... هو الذي يؤدي واجبه.","a":"الآباء — معلمك — أمّك — دروسك — واجبك — شجاعًا — الأدب — لسانك — المسلمَ."}
]},
{"id":"alif-fath","title":"نيابة الألف عن الفتحة",
"matn":"وَأَمَّا الأَلِفُ فَتَكُونُ عَلَامَةً لِلنَّصْبِ فِي الأَسْمَاءِ الخَمْسَةِ، نَحْوُ: رَأَيْتُ أَبَاكَ وَأَخَاكَ.",
"nazm":[["بِالْأَلِفِ الخَمْسَةَ نَصْبَهَا الْتَزِمُ"]],
"alfia":[["وَالأَسْمَاءُ الخَمْسَةُ تُنْصَبُ بِالأَلِفِ"]],
"qas":[
{"q":"في كم موضع تنوب الألف عن الفتحة؟","a":"موضع واحد فقط: الأسماء الخمسة."},
{"q":"مَثِّل للأسماء الخمسة في حال النصب بأربعة أمثلة.","a":"﴿وَأَنْ كَانَ ذَا مَالٍ﴾ — ذا خبر كان منصوب بالألف. ﴿سَنُرَاوِدُ عَنْهُ أَبَاهُ﴾ — أباه مفعول به. ﴿وَأَرْسَلْنَا إِلَى ثَمُودَ أَخَاهُمْ﴾ — أخاهم مفعول به. ﴿لِيَبْلُغَ فَاهُ﴾ — فاه مفعول به."},
{"q":"كيف تقول: رأيتُ فمَك، أم رأيتُ فاك؟ ثم أعرب.","a":"تقول: رأيتُ فمَك، أو بناء على لغة أخرى: رأيتُ فاك. — إعراب «فمك»: فم مفعول به منصوب بالفتحة، وفم مضاف، والكاف مضاف إليه. — إعراب «فاك»: فا مفعول به منصوب بالألف نيابة عن الفتحة، وفا مضاف، والكاف مضاف إليه."}
]},
{"id":"kasra-fath","title":"نيابة الكسرة عن الفتحة",
"matn":"وَأَمَّا الكَسْرَةُ فَتَكُونُ عَلَامَةً لِلنَّصْبِ فِي جَمْعِ المُؤَنَّثِ السَّالِمِ.",
"nazm":[["وَأَنْصِبْ بِكَسْرِ جَمْعَ تَأْنِيثٍ سَلِمْ"]],
"alfia":[["وَجَمْعُ الْمُؤَنَّثِ السَّالِمِ يُنْصَبُ بِالكَسْرَةِ"]],
"qas":[
{"q":"متى تكون الكسرة علامة للنصب؟","a":"في موضع واحد: جمع المؤنث السالم."},
{"q":"اجمع جمع مؤنث سالمًا: فاطمة، سُعدى، المدرِّسة، المهذِّبة، الحمام، ذكرى.","a":"فاطمات، سعديات، المدرِّسات، المهذِّبات، الحمامات، ذكريات."},
{"q":"ضع في جملة منصوبة: العاقلات، الفاطمات، سعديات، المدرِّسات، اللهاوات، الحمامات، ذكريات.","a":"إن النساء العاقلاتِ هن اللاتي يطعن ربهن — رأيتُ الفاطماتِ يمشين مشية حياء — إن سعدياتِ خرجن لأداء صلاة العيد — لعل المدرِّساتِ يخفن الله — إن اللهاواتِ تمنع دخول الجراثيم — رأيتُ الحماماتِ نظيفة — كأن ذكرياتِ الماضي تحققت الآن."},
{"q":"رُدَّ المثنيات إلى مفردها ثم اجمعها جمع مؤنث سالمًا: الزينبان، الحبليان، الكاتبتان، الرسالتان، الحمراوان.","a":"زينب/زينبات — حُبلى/حُبليات — كاتبة/كاتبات — رسالة/رسالات — حمراء/حمراوات."},
{"q":"أعرب: أكرمتُ المسلمات. خلق الله السماوات.","a":"أكرمتُ: فعل وفاعل. المسلمات: مفعول به منصوب بالكسرة نيابة عن الفتحة (جمع مؤنث سالم). — خلق: ماضٍ. الله: فاعل مرفوع بالضمة. السماوات: مفعول به منصوب بالكسرة نيابة عن الفتحة."},
{"q":"كيف تقول: رأيتُ رجلًا أم رأيتُ رجلٌ؟ ولماذا؟","a":"الصواب: رأيتُ رجلًا — مفعول به منصوب بالفتحة (اسم مفرد). ولو قلت «رجالات» تُنصب بالكسرة (جمع مؤنث سالم)."}
]},
{"id":"ya-fath","title":"نيابة الياء عن الفتحة",
"matn":"وَأَمَّا اليَاءُ فَتَكُونُ عَلَامَةً لِلنَّصْبِ فِي التَّثْنِيَةِ وَالجَمْعِ.",
"nazm":[["وَأَعْلَمْ بِأَنَّ الْجَمْعَ وَالْمُثَنَّى","نَصْبُهُمَا بِالْيَاءِ حَيْثُ عَنَّا"]],
"alfia":[["وَتُنْصَبُ بِاليَاءِ الْمُثَنَّى وَالْجَمْعُ"]],
"qas":[
{"q":"متى تكون الياء علامة للنصب؟","a":"في موضعين: التثنية (المثنى)، وجمع المذكر السالم."},
{"q":"ثنِّ واجمع جمع مذكر سالمًا ما يصح: محمد، فاطمة، بكر، السبع، الكاتب، النمر، القاضي، المصطفى.","a":"محمد: محمدان/محمدون — فاطمة: فاطمتان/لا — بكر: بكران/بكرون — السبع: السبعان/لا — الكاتب: الكاتبان/الكاتبون — النمر: النمران/لا — القاضي: القاضيان/القاضون — المصطفى: المصطفيان/المصطفون."},
{"q":"استعمل المثنيات المنصوبة: المحمدان، الفاطمتان، البكران، السبعان، الكاتبان، النمران، القاضيان، المصطفيان.","a":"إن المحمدين مطيعان لربهما — رأيتُ الفاطمتين تلبسان الحجاب — لعل البكرين قد عادا من المسجد — رأيتُ السبعين في حديقة الحيوان — ليت الكاتبين لم يقدحا — ضربتُ النمرين بالسوط — لعل القاضيين يحكمان بشرع الله — رأيتُ المصطفيين ساجدين لربهما."},
{"q":"استعمل الجموع المنصوبة: الراشدون، المفتون، العاقلون، الكاتبون، المصطفون.","a":"إن الخلفاء الراشدين أفضل هذه الأمة — رأيتُ المفتين يتحرّون الحق — ليت العاقلين يعملون بعقلهم — رأيتُ الكاتبين في معرض الكتاب — لعل العلماء المصطفين قد حضروا."}
]},
{"id":"hadhf-nun","title":"نيابة حذف النون عن الفتحة",
"matn":"وَأَمَّا حَذْفُ النُّونِ فَيَكُونُ عَلَامَةً لِلنَّصْبِ فِي الأَفْعَالِ الَّتِي رَفْعُهَا بِثَباتِ النُّونِ.",
"nazm":[["وَخَمْسَةُ الأَفْعَالِ نَصْبُهَا ثَبَتْ","بِحَذْفِ نُونِهَا إِذَا مَا نُصِبَتْ"]],
"alfia":[["وَالأَفْعَالُ الْخَمْسَةُ تُنْصَبُ بِحَذْفِ النُّونِ"]],
"qas":[
{"q":"في كم موضع يكون حذف النون علامة للنصب؟","a":"في الأفعال الخمسة."},
{"q":"مَثِّل للأفعال الخمسة المنصوبة بثلاثة أمثلة.","a":"﴿أَنْ يُخْرِجَاكُمْ﴾ — يخرجاكم منصوب بأن وعلامة نصبه حذف النون. ﴿حَتَّى تُنْفِقُوا﴾ — تنفقوا منصوب بحذف النون. ﴿وَلَنْ تَفْعَلُوا﴾ — تفعلوا منصوب بحذف النون."},
{"q":"مَثِّل للمثنى المنصوب بمثالين.","a":"﴿وَجَعَلْنَا اللَّيْلَ وَالنَّهَارَ آيَتَيْنِ﴾ — آيتين منصوب بالياء. ﴿وَاسْتَشْهِدُوا شَهِيدَيْنِ﴾ — شهيدين منصوب بالياء."},
{"q":"مَثِّل لجمع المذكر السالم المنصوب بمثالين.","a":"﴿إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾ — المقسطين منصوب بالياء. ﴿إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ﴾ — المنافقين منصوب بالياء."},
{"q":"مَثِّل لجمع المؤنث السالم المنصوب.","a":"﴿خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ﴾ — السماوات منصوب بالكسرة. ﴿أَنْ تُؤَدُّوا الْأَمَانَاتِ﴾ — الأمانات منصوب بالكسرة."},
{"q":"مَثِّل للأفعال الخمسة المنصوبة بثلاثة أمثلة وأعرب واحدًا.","a":"﴿يُرِيدَانِ أَنْ يُخْرِجَاكُمْ﴾ — يخرجاكم منصوب بأن (حذف النون). ﴿وَلَنْ تَنَالُوا الْبِرَّ حَتَّى تُنْفِقُوا﴾ — تنالوا وتنفقوا منصوبان. ﴿فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا﴾ — تفعلوا منصوب بلن. — إعراب «يخرجاكم»: فعل مضارع منصوب بأن وعلامة نصبه حذف النون، والألف فاعل."},
{"q":"أعرب: لن تفعلا. لن تفعلوا.","a":"لن: حرف نصب ونفي واستقبال. تفعلا: مضارع منصوب بلن وعلامة نصبه حذف النون (الأفعال الخمسة)، والألف فاعل. تفعلوا: مضارع منصوب بلن وعلامة نصبه حذف النون، والواو فاعل."}
]},
{"id":"khafd","title":"علامات الخفض والكسرة",
"matn":"وَلِلخَفْضِ ثَلَاثُ عَلَامَاتٍ: الكَسْرَةُ، وَاليَاءُ، وَالفَتْحَةُ. فَأَمَّا الكَسْرَةُ فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي ثَلَاثَةِ مَوَاضِعَ: فِي الاسْمِ المُفْرَدِ المُنْصَرِفِ، وَجَمْعِ التَّكْسِيرِ المُنْصَرِفِ، وَجَمْعِ المُؤَنَّثِ السَّالِمِ.",
"nazm":[["عَلَامَةُ الخَفْضِ الَّتِي بِهَا يَفِي","كَسْرٌ وَبَاءٌ ثُمَّ فَتْحٌ فَاقْتَفِ"],["فَالخَفْضُ بِالكَسْرِ لِمُفْرَدٍ وَفَا","وَجَمْعِ تَكْسِيرٍ إِذَا مَا انْصَرَفَا"],["وَجَمْعِ تَأْنِيثٍ سَلِيمِ المَبْنَى"]],
"alfia":[["وَالخَفْضُ بِالكَسْرَةِ فِي الْمُفْرَدِ"]],
"qas":[
{"q":"ما المواضع التي تكون الكسرة فيها علامة للخفض؟","a":"ثلاثة: الاسم المفرد المنصرف، وجمع التكسير المنصرف، وجمع المؤنث السالم."},
{"q":"ما معنى كون الاسم مفردًا منصرفًا؟","a":"مفردًا: ليس مثنى ولا مجموعًا ولا ملحقًا ولا من الأسماء الخمسة. منصرفًا: خاليًا من موانع الصرف، والصرف هو التنوين."},
{"q":"مَثِّل للاسم المفرد المنصرف المجرور بأربعة أمثلة ولجمع التكسير المنصرف المجرور.","a":"الاسم المفرد: ﴿رَسُولٍ كَرِيمٍ﴾، ﴿بِغَيْرِ عَمَدٍ﴾، ﴿فِي صُحُفٍ مُكَرَّمَةٍ﴾، ﴿وَكِتَابٍ مَسْطُورٍ﴾. جمع التكسير: ﴿قَوْمٌ مِنْ قَوْمٍ﴾، ﴿بِرُسُلٍ مِنْ قَبْلِكَ﴾، ﴿رِجَالٌ مِنَ الْإِنْسِ﴾، ﴿سَبْعَةُ أَبْحُرٍ﴾."},
{"q":"مَثِّل لجمع المؤنث السالم المجرور بمثالين.","a":"﴿تِسْعَ آيَاتٍ بَيِّنَاتٍ﴾، ﴿سَبْعَ سَمَاوَاتٍ﴾."}
]},
{"id":"ya-khafd","title":"نيابة الياء عن الكسرة",
"matn":"وَأَمَّا اليَاءُ فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي ثَلَاثَةِ مَوَاضِعَ: فِي الأَسْمَاءِ الخَمْسَةِ، وَفِي التَّثْنِيَةِ، وَالجَمْعِ.",
"nazm":[["وَأَخْفِضْ بِيَاءٍ يَا أَخِي المُثَنَّى","وَالجَمْعَ وَالخَمْسَةَ فَاعْرِفْ وَاعْتِرِفْ"]],
"alfia":[["وَتُخْفَضُ بِاليَاءِ الْمُثَنَّى وَالجَمْعُ"]],
"qas":[
{"q":"ما المواضع التي تكون الياء فيها علامة على خفض الاسم؟","a":"ثلاثة: الأسماء الخمسة، والمثنى، وجمع المذكر السالم."},
{"q":"ما الفرق بين المثنى وجمع المذكر السالم في الخفض؟","a":"ياء المثنى: ما قبلها مفتوح والنون مكسورة. وياء الجمع: ما قبلها مكسور والنون مفتوحة."},
{"q":"مَثِّل للمثنى المخفوض بثلاثة أمثلة.","a":"﴿كِلْتَا الْجَنَّتَيْنِ﴾، ﴿تَحْتَ عَبْدَيْنِ مِنْ عِبَادِنَا صَالِحَيْنِ﴾، ﴿مِنْ قَلْبَيْنِ فِي جَوْفِهِ﴾."},
{"q":"مَثِّل لجمع المذكر المخفوض بثلاثة أمثلة.","a":"﴿مِنَ الْمُسَبِّحِينَ﴾، ﴿مِنَ الْمُسَحَّرِينَ﴾، ﴿مِنَ الْأَسْفَلِينَ﴾."},
{"q":"هل «أهلون» جمع مذكر سالم أم ملحق به؟","a":"ملحق به؛ لأنها ليست علمًا ولا صفة، ومفردها اسم جنس جامد."},
{"q":"أعرب: ارجعوا إلى أبيكم. مررتُ برجلين. مررتُ بالمعلمين.","a":"ارجعوا: أمر مبني على حذف النون. إلى: حرف جر. أبيكم: اسم مجرور بالياء (الأسماء الخمسة). — مررتُ: فعل وفاعل. برجلين: اسم مجرور بالياء (مثنى). — بالمعلمين: اسم مجرور بالياء (جمع مذكر سالم)."}
]},
{"id":"fath-khafd","title":"نيابة الفتحة عن الكسرة (الممنوع من الصرف)",
"matn":"وَأَمَّا الفَتْحَةُ فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي الِاسْمِ الَّذِي لَا يَنْصَرِفُ.",
"nazm":[["وَاخْفِضْ بِفَتْحٍ كُلَّ مَا لَا يَنْصَرِفْ"]],
"alfia":[["فَأَلِفُ التَّأْنِيثِ مُطْلَقًا مَنَعْ","صَرْفَ الَّذِي حَوَاهُ كَيْفَمَا وَقَعْ"],["وَاسْمُ الْفِعْلِ وَوَزْنٌ وَالْعَدْلُ","مَعَ الْعَلَمِيَّةِ عِنْدَ ذِي الْفَضْلِ"]],
"qas":[
{"q":"ما المواضع التي تكون الفتحة فيها علامة للخفض؟","a":"موضع واحد: الاسم الذي لا ينصرف."},
{"q":"ما معنى كون الاسم لا ينصرف؟","a":"أنه لا يقبل الصرف، وهو التنوين."},
{"q":"ما هو الاسم الذي لا ينصرف؟","a":"الذي أشبه الفعل في علتين فرعيتين: إحداهما ترجع إلى اللفظ، والأخرى إلى المعنى، أو علة واحدة تقوم مقام العلتين."},
{"q":"ما هي العلل التي ترجع إلى المعنى؟","a":"اثنتان: العلمية، والوصفية."},
{"q":"ما هي العلل التي ترجع إلى اللفظ؟","a":"ست: التأنيث بغير ألف، والعجمة، والتركيب، وزيادة الألف والنون، ووزن الفعل، والعدل."},
{"q":"كم علة من العلل اللفظية توجد مع الوصفية؟","a":"ثلاث: زيادة الألف والنون، ووزن الفعل، والعدل."},
{"q":"كم علة من العلل اللفظية توجد مع العلمية؟","a":"الست كلها."},
{"q":"ما هما العلتان اللتان تقوم الواحدة منهما مقام علتين؟","a":"صيغة منتهى الجموع، وألف التأنيث الممدودة أو المقصورة."},
{"q":"ما هي صيغة منتهى الجموع؟","a":"كل جمع تكسير كان بعد ألف الجمع فيه حرفان أو ثلاثة أحرف أوسطها ساكن."},
{"q":"مَثِّل لاسم لا ينصرف للعلمية والعدل.","a":"«عمر» — لأن أصله «عامر» فعدل إلى «عمر»."},
{"q":"مَثِّل للعلمية وزيادة الألف والنون.","a":"﴿امْرَأَةُ عِمْرَانَ﴾ — عمران ممنوع للعلمية وزيادة الألف والنون."},
{"q":"مَثِّل للعلمية والعجمة.","a":"﴿إِلَى إِبْرَاهِيمَ وَإِسْمَاعِيلَ﴾ — كلاهما ممنوع للعلمية والعجمة."},
{"q":"ما هي أقسام التأنيث؟","a":"ثلاثة: تأنيث بالألف (يكفي وحده)، وتأنيث بالتاء، وتأنيث بالمعنى (يحتاج كل منهما للعلمية)."},
{"q":"كلمة «ليلى» هل هي مصروفة أم غير مصروفة؟ ولماذا؟","a":"غير مصروفة؛ لأنها مختومة بألف التأنيث المقصورة الزائدة. جملة: مررتُ بليلى — ليلى اسم مجرور بالفتحة المقدرة نيابة عن الكسرة."},
{"q":"مَثِّل لاسم لا ينصرف للعلمية والتأنيث اللفظي المعنوي، والعلمية والتأنيث المعنوي، ثم أعربهما.","a":"الأول: «جاءني غلام عائشةَ» — عائشة: مضاف إليه مجرور بالفتحة نيابة عن الكسرة (العلمية والتأنيث). الثاني: «رَوَيْتُ الحديث عن زينبَ بنتِ جحشٍ» — زينب: اسم مجرور بالفتحة نيابة عن الكسرة (العلمية والتأنيث)."},
{"q":"بيِّن أسباب منع الصرف: زينب، مُضَر، يوسف، إبراهيم، أكرم من أحمد، بعلبك، ريّان، مغاليق، حسّان، عاشوراء، دنيا.","a":"زينب: العلمية والتأنيث. مُضَر: العلمية والعدل. يوسف وإبراهيم: العلمية والعجمة. أكرم: الوصفية ووزن الفعل. أحمد: العلمية ووزن الفعل. بعلبك: العلمية والتركيب المزجي. ريّان: الوصفية وزيادة الألف والنون. مغاليق: صيغة منتهى الجموع. حسّان: العلمية وزيادة الألف والنون. عاشوراء: ألف التأنيث الممدودة. دنيا: ألف التأنيث المقصورة."},
{"q":"ضع كل كلمة في جملتين: مجرورة بالفتحة مرة وبالكسرة الظاهرة مرة — دعجاء، أمائل، أجمل، يقظان.","a":"دعجاء: «نظرتُ إلى عينٍ دعجاءَ» (بالفتحة). «نظرتُ إلى عينٍ دعجاءِ اللون» (بالكسرة، لأنها أُضيفت). — أمائل: «مررتُ بأمائل من الناس» (بالفتحة). «مررتُ بأمائل الناس» (بالكسرة، لأنها أُضيفت). — أجمل: «نظرتُ إلى أجمل منك خلقًا» (بالفتحة). «يوسف كان من أجمل البشر» (بالكسرة، لأنه أُضيف). — يقظان: «مررتُ بيقظان في البيت» (بالفتحة). «مررتُ باليقظان» (بالكسرة، لأنها دخلتها «أل»)."},
{"q":"ضع اسمًا ممنوعًا من الصرف في مكان خالٍ: سافر ... مع أخيك. ... خير من أحمد. كانت عند ... زائرة من ... مسجد عمرو أقدم ما بمصر من ... هذه الفتاة ... ... يظهر بعد المطر. مررتُ بمسكين ... فتصدقت عليه. الإحسان إلى المسيء ... إلى النجاة. ... نعطف على الفقراء.","a":"إسماعيل (العلمية والعجمة) — أحمد (العلمية ووزن الفعل) — سعاد (العلمية والتأنيث) — مصر (العلمية والتأنيث) — مساجد (صيغة منتهى الجموع) — بيضاء (ألف التأنيث) — عمر (العلمية والعدل) — جوعان (الوصفية وزيادة الألف والنون) — أقرب (الوصفية ووزن الفعل) — في مصر (العلمية والتأنيث)."}
]},
{"id":"jazm","title":"علامتا الجزم",
"matn":"وَلِلْجَزْمِ عَلَامَتَانِ: السُّكُونُ، وَالحَذْفُ. فَأَمَّا السُّكُونُ فَيَكُونُ عَلَامَةً لِلْجَزْمِ فِي الفِعْلِ المُضَارِعِ الصَّحِيحِ الآخِرِ. وَأَمَّا الحَذْفُ فَيَكُونُ عَلَامَةً لِلْجَزْمِ فِي الفِعْلِ المُضَارِعِ المُعْتَلِّ الآخِرِ، وَفِي الأَفْعَالِ الَّتِي رَفْعُهَا بِثَباتِ النُّونِ.",
"nazm":[["إِنَّ السُّكُونَ يَا ذَوِي الأَذْهَانِ","وَالحَذْفَ لِلْجَزْمِ عَلَامَتَانِ"],["فَاجْزِمْ بِتَسْكِينِ مُضَارِعًا أَتَى","صَحِيحَ الآخِرِ كَلَمْ يَقُمْ فَتَى"],["وَأَجْزِمْ بِحَذْفِ مَا اكْتَسَى اعْتِلَالًا","وَآخِرُهُ وَالخَمْسَةَ الأَفْعَالَا"]],
"alfia":[["وَلِلْجَزْمِ اثْنَتَانِ: السُّكُونُ وَحَذْفُ الْعِلَّةِ"]],
"qas":[
{"q":"ما هي علامات الجزم؟","a":"علامتان: السكون، والحذف. والحذف يشمل حذف النون (الأفعال الخمسة)، وحذف حرف العلة (المعتل الآخر)."},
{"q":"في كم موضع يكون السكون علامة للجزم؟","a":"موضع واحد: الفعل المضارع الصحيح الآخر غير المبني."},
{"q":"في كم موضع يكون الحذف علامة على الجزم؟","a":"موضعان: الفعل المضارع المعتل الآخر (بحذف حرف العلة)، والأفعال الخمسة (بحذف النون)."},
{"q":"ما هو الفعل الصحيح الآخر؟","a":"ما كان آخره ليس حرف علة (ألف، واو، ياء). مَثِّل بعشرة: يلعب، يضرب، يذهب، يجلس، يشرب، يسجد، يعبد، يسلم، يحرم، يحلّ."},
{"q":"ما هو الفعل المعتل الآخر؟","a":"ما كان آخره حرف علة. مَثِّل: ألف (يسعى، يخشى، يرضى، يهوى، يرقى)، واو (يدنو، يسمو، يعلو، يدعو، يرجو)، ياء (يرمي، يلقي)."},
{"q":"أعرب: لم يرضَ. لم يقضِ. لم يدعُ.","a":"لم يرضَ: لم حرف نفي وجزم. يرضَ: مضارع مجزوم بلم وعلامة جزمه حذف الألف. لم يقضِ: حذف الياء. لم يدعُ: حذف الواو."},
{"q":"مَثِّل للأفعال الخمسة المجزومة بخمسة أمثلة.","a":"﴿فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا﴾، ﴿وَإِنْ يُرِيدَا إِصْلَاحًا﴾، ﴿وَلَا تَأْكُلُوهَا إِسْرَافًا﴾، ﴿كَمَا لَمْ يُؤْمِنُوا بِهِ﴾، ﴿وَإِنْ تُبْدُوا شَيْئًا أَوْ تُخْفُوهُ﴾."},
{"q":"أعرب: لم يرميا. لم يفعلوا. لا تمشي في الأسواق.","a":"لم يرميا: مضارع مجزوم بلم وعلامة جزمه حذف النون، والألف فاعل. لم يفعلوا: مضارع مجزوم وعلامة جزمه حذف النون، والواو فاعل. لا تمشي: مضارع مجزوم بلا الناهية وعلامة جزمه حذف النون، والياء فاعل."},
{"q":"استعمل في ثلاث جمل (مرفوع/منصوب/مجزوم): يضرب، تنصران، تسافرين، يدنو، تربحون، يشتري، يبقى، يسبقان.","a":"يضرب: محمد يضرب — لن يضرب — لم يضرب. تنصران: ألا تنصران — لن ينصرا — لم ينصرا. تسافرين: لعلك تسافرين — لن تسافري — لم تسافري. يدنو: يدنو — لن يدنو — لم يدنُ. تربحون: تربحون — لن تربحوا — لم تربحوا. يشتري: يشتري — لن يشتري — لم يشترِ. يبقى: يبقى — لن يبقى — لم يبقَ. يسبقان: يسبقان — لن يسبقا — لم يسبقا."},
{"q":"ضع أداة شرط: ... تحضر يحضر أخوك. ... تصاحب أصاحبه. ... تلعب تندم. ... تخف تظهره أفعالك. ... تذهب أذهب معك. ... تذاكر فيه ينفعك.","a":"متى — مهما — من — حيثما — إن — ما."},
{"q":"أكمل بفعل مضارع: إن تُذنب ... إن يسقط الزجاج ... مهما تفعلوا ... أي إنسان تصاحبه ... إن تضع الملح في الماء ... أينما تسر ... كيفما يكن المرء ... من يزرني ... أيان يكن العالم ... أنى يذهب العالم ...","a":"تدخل النار — ينكسر — يعلمه الله — يحبك — يملح — أميز — يكن خليله — أزره — يحترمه الناس — يجد طلبة للعلم."},
{"q":"كوِّن جملة شرطية: تنتبه إلى الدرس/تستفد منه. تمسك سلك الكهرباء/تُصعق. تغلق نوافذ حجرتك/يفسد الهواء. تؤدِّ واجبك/تفوز برضاء الناس. يسقط المطر/افتح المظلة.","a":"متى تنتبه إلى الدرس تستفد منه — إن تمسك سلك الكهرباء تُصعق — إذما تغلق نوافذ حجرتك يفسد الهواء — أيان تؤدِّ واجبك تفوز برضاء الناس — أينما يسقط المطر فافتح المظلة."},
{"q":"إلى كم قسم تنقسم الجوازم؟","a":"قسمان: ما يجزم فعلًا واحدًا، وما يجزم فعلين."},
{"q":"ما الجوازم التي تجزم فعلًا واحدًا؟ وما الفرق بين لم ولما؟","a":"ستة: لم، ولما، وألم، وألما، ولام الأمر والدعاء، و«لا» في النهي والدعاء. والفرق بين لم ولما: المنفي بـ«لما» مستمر الانتفاء إلى زمن الحال مع توقع حدوثه في المستقبل، بخلاف «لم» فقد يكون منقطعًا. والمضارع المنفي بـ«لم» لا يجوز حذفه، بخلاف «لما» فيجوز. والفرق بين النهي والدعاء: النهي من الأعلى إلى الأدنى، والدعاء من الأدنى إلى الأعلى."},
{"q":"ما الجوازم التي تجزم فعلين؟","a":"اثنا عشر: إن، ما، مهما، إذما، أي، متى، أين، أنى، أيان، حيثما، كيفما، من."},
{"q":"بيِّن الأسماء والحروف من الجوازم.","a":"الحرف بالاتفاق: «إن». المتفق على اسميته تسعة: من، ما، أي، متى، أيان، أين، أنى، حيثما، كيفما. المختلف فيه والأصح أنه حرف: «إذما». المختلف فيه والأصح أنه اسم: «مهما»."},
{"q":"مَثِّل لكل جازم يجزِم فعلًا واحدًا بمثالين، وللجوازم التي تجزم فعلين بمثال.","a":"لم: ﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾ — ﴿وَلَمْ يَكُنِ الَّذِينَ كَفَرُوا﴾. لما: ﴿وَلَمَّا يَعْلَمِ اللَّهُ﴾ — ﴿بَلْ لَمَّا يَذُوقُوا عَذَابِ﴾. ألم: ﴿أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا﴾ — ﴿أَلَمْ يَكُ نُطْفَةً﴾. ألما: «ألما تصح والشيب وازع» — «ألما يقل زيد». لام الأمر: ﴿لِيُنْفِقْ ذُو سَعَةٍ﴾. لام الدعاء: ﴿لِيَقْضِ عَلَيْنَا رَبُّكَ﴾. لا الناهية: ﴿وَلَا تَحْزَنْ﴾. لا الدعائية: ﴿لَا تُزِغْ قُلُوبَنَا﴾. — من (جازم فعلين): ﴿مَنْ يَعْمَلْ سُوءًا يُجْزَ بِهِ﴾."},
{"q":"أعرب: من يعمل سوءًا يجز به. إن تجلس أجلس.","a":"من: اسم شرط جازم مبني على السكون في محل رفع مبتدأ. يعمل: مضارع مجزوم بمن وعلامة جزمه السكون (فعل الشرط). سوءًا: مفعول به منصوب. يجز: مضارع مبني للمجهول مجزوم جوابًا وعلامة جزمه حذف حرف العلة. به: جار ومجرور. — إن تجلس أجلس: إن حرف شرط جازم. تجلس: مضارع مجزوم وعلامة جزمه السكون. أجلس: مضارع مجزوم وعلامة جزمه السكون."},
{"q":"أعرب: إن ترمِ أرمِ. متى تدعُ أدعُ. من يخشَ الله يلقَ خيرًا.","a":"إن: حرف شرط. ترمِ: مضارع مجزوم وعلامة جزمه حذف الياء. أرمِ: مضارع مجزوم وعلامة جزمه حذف الياء. — متى: اسم شرط جازم. تدعُ: مجزوم وعلامة جزمه حذف الواو. أدعُ: مثلها. — من: مبتدأ. يخشَ: مجزوم بحذف الألف. الله: مفعول به منصوب. يلقَ: مجزوم بحذف الألف. خيرًا: مفعول به منصوب."}
]},
{"id":"muarabat","title":"المعربات",
"matn":"المُعْرَبَاتُ قِسْمَانِ: قِسْمٌ يُعْرَبُ بِالحَرَكَاتِ، وَقِسْمٌ يُعْرَبُ بِالحُرُوفِ.",
"nazm":[],
"alfia":[["وَالمُعْرَبَاتُ مِنَ الأَسْمَاءِ سِوَى","مَا مِنْهَا بِالحَرْفِ قَدْ جِيءَ بِهِ"]],
"qas":[
{"q":"إلى كم قسم تنقسم المعربات؟","a":"قسمان: ما يُعرب بالحركات، وما يُعرب بالحروف."},
{"q":"ما المعربات التي تُعرب بالحركات؟","a":"أربعة: الاسم المفرد، وجمع التكسير، وجمع المؤنث السالم، والفعل المضارع الذي لم يتصل بآخره شيء."},
{"q":"ما المعربات التي تُعرب بالحروف؟","a":"أربعة: التثنية، وجمع المذكر السالم، والأسماء الخمسة، والأفعال الخمسة."},
{"q":"ضع كلمات منصوبة وبيّن علامة نصبها: الجو، الغبار، الطريق، الحبل، مشتعلة، القطن، المدرسة، الثوبان، المخلصون، المسلمات، أبي، العُلا، الراضي.","a":"رأيتُ الجو مليئًا — الفتحة. إن الغبار يضر — الفتحة. طريقًا — الفتحة. حبالهم — الفتحة. مشتعلة — الفتحة. القطن — الفتحة. المدرسة — الفتحة. الثوبَين — الياء. المخلصين — الياء. المسلمات — الكسرة. أبي — الفتحة المقدرة. العُلا — الفتحة المقدرة. الراضي — الفتحة المقدرة."},
{"q":"ضع كلمات مخفوضة وبيّن علامة خفضها: أبوك، المهذبون، القائمات، المفترس، أحمد، مستديرة، الباب، النخلتان، الفأرتان، القاضي، الوَرَى.","a":"أبيكم — الياء. المهذبين — الياء. القائمات — الكسرة. المفترس — الكسرة. أحمد — الفتحة (ممنوع من الصرف). مستديرة — الكسرة. الباب — الكسرة. نخلتين — الياء. الفأرتين — الياء. القاضي — الكسرة المقدرة. الورى — الكسرة المقدرة."},
{"q":"ضع كلمات مرفوعة وبيّن علامة رفعها: أبويه، المصلحين، المُرشد، الغزاة، الآباء، الأمهات، الباقي، ابني، أخيك.","a":"أبواه — الألف. المصلحون — الواو. المرشد — الضمة. الغزاة — الضمة. آباؤهم — الضمة. أمهاتهم — الضمة. الباقي — الضمة المقدرة. ابني — الضمة المقدرة. أخوك — الواو."},
{"q":"ثنِّ الكلمات ثم استعملها مرفوعة ومخفوضة: الدواة، الوالد، الحديقة، القلم، الكتاب، البلد، المعهد.","a":"الدواتان: هاتان الدواتان أكتب بهما — نظرتُ إلى الدواتين. الوالدان: الوالدان والأقربون — وبالوالدين إحسانًا. الحديقتان: هاتان الحديقتان جميلتان — مررتُ بحديقتين. القلمان: هذان القلمان لك — نظرتُ إلى قلمين. الكتابان: هذان الكتابان روحي — قرأتُ في الكتابين بحثًا. البلدان: كان هذان البلدان مسلمين — أهل هذين البلدين من أفضل الناس. المعهدان: هذان المعهدان يعلمان العلوم الشرعية — التحقتُ بالمعهدين."},
{"q":"اجمع جمع مذكر سالمًا واستعمله مرفوعًا ومنصوبًا: الصالح، المذاكر، الكسل، المتقي، الراضي، محمد.","a":"الصالحون: ﴿أَنَّ الْأَرْضَ يَرِثُهَا عِبَادِيَ الصَّالِحُونَ﴾ — ﴿وَهُوَ يَتَوَلَّى الصَّالِحِينَ﴾. المذاكرون: هؤلاء المذاكرون سينجحون — رأيتُ المذاكرين يجتهدون. الكسلون: هؤلاء الكسلون لن ينجحوا — إن هؤلاء الكسلين عن أداء واجبهم شر الناس. المتقون: ﴿أُولَئِكَ هُمُ الْمُتَّقُونَ﴾ — ﴿إِنَّ الْمُتَّقِينَ فِي مَقَامِ أَمِينٍ﴾. الراضون: الراضون بقضاء الله يحبهم الله — إن الراضين بقضاء الله لهم مقام طيب. المحمدون: جاء المحمدون — رأيتُ المحمدين يصلون."},
{"q":"ضع فعلاً في ثلاث جمل: يلعب، يؤدي واجبه، يسأمون، تحضرين، يرجو الثواب، يسافران.","a":"يلعب: محمد يلعب — لن يلعب — لم يلعب. يؤدي واجبه: إبراهيم يؤدي واجبه جيدًا — لن يؤدي واجبه — لم يؤدِّ واجبه. يسأمون: المسلمون يسأمون الظلم — لن يسأموا — لم يسأموا. تحضرين: متى تحضرين إلى المسجد — لن تحضري — لم تحضري. يرجو: المسلم يرجو الثواب من ربه — لن يرجو — لم يرجُ. يسافران: الصديقان يسافران — لن يسافرا — لم يسافرا."},
{"q":"إلى كم قسم تنقسم المعربات؟","a":"قسمان: بالحركات وبالحروف."},
{"q":"ما المعربات بالحركات؟","a":"الاسم المفرد، وجمع التكسير، وجمع المؤنث السالم، والفعل المضارع الذي لم يتصل بآخره شيء. وكلها ترفع بالضمة، وتنصب بالفتحة، وتخفض بالكسرة، وتجزم بالسكون. وخرج عن ذلك: جمع المؤنث السالم (ينصب بالكسرة)، والاسم الذي لا ينصرف (يخفض بالفتحة)، والفعل المضارع المعتل الآخر (يجزم بحذف آخره)."},
{"q":"ما المعربات بالحروف؟","a":"التثنية، وجمع المذكر السالم، والأسماء الخمسة، والأفعال الخمسة (يفعلان، تفعلان، يفعلون، تفعلون، تفعلين)."},
{"q":"مَثِّل للاسم المفرد المنصرف في الرفع والنصب والخفض.","a":"الرفع: ﴿وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ﴾. النصب: ﴿وَلَا يَسْأَلُ حَمِيمٌ حَمِيمًا﴾. الخفض: ﴿إِلَّا فِي ضَلَالٍ﴾."},
{"q":"بماذا يُنصب جمع المؤنث السالم؟","a":"بالكسرة نيابة عن الفتحة."},
{"q":"بماذا يُخفض الاسم الذي لا ينصرف؟","a":"بالفتحة نيابة عن الكسرة."},
{"q":"بماذا يُجزم الفعل المضارع المعتل الآخر؟","a":"بحذف حرف العلة."},
{"q":"بماذا يُرفع المثنى؟ وبماذا يُنصب ويُخفض؟","a":"يُرفع بالألف، ويُنصب ويُخفض بالياء المفتوح ما قبلها المكسور ما بعدها."},
{"q":"بماذا يُرفع جمع المذكر السالم؟ وبماذا يُنصب ويُخفض؟","a":"يُرفع بالواو، ويُنصب ويُخفض بالياء المكسور ما قبلها المفتوح ما بعدها."},
{"q":"فيم يشترك المثنى وجمع المذكر السالم في الإعراب؟","a":"في الخفض والنصب: كلاهما يُنصب ويُخفض بالياء."},
{"q":"فيم يشترك جمع المذكر السالم والأسماء الخمسة؟","a":"في الرفع والخفض: كلاهما يُرفع بالواو ويُخفض بالياء."},
{"q":"فيم تشترك الأسماء الخمسة والمثنى؟","a":"في الخفض فقط: كلاهما يُخفض بالياء."}
]},
{"id":"afal","title":"الأفعال",
"matn":"الأَفْعَالُ ثَلَاثَةٌ: مَاضٍ، وَمُضَارِعٌ، وَأَمْرٌ، نَحْوُ: ضَرَبَ، يَضْرِبُ، اضْرِبْ. فَالمَاضِي مَفْتُوحُ الآخِرِ أَبَدًا. وَالأَمْرُ مَجْزُومٌ أَبَدًا. وَالمُضَارِعُ مَا كَانَ فِي أَوَّلِهِ إِحْدَى الزَّوَائِدِ الأَرْبَعِ الَّتِي يَجْمَعُهَا قَوْلُكَ: «أَنَيْتُ»، وَهُوَ مَرْفُوعٌ أَبَدًا حَتَّى يَدْخُلَ عَلَيْهِ نَاصِبٌ أَوْ جَازِمٌ.",
"nazm":[["وَهْيَ ثَلَاثَةٌ مُضِيٌّ قَدْ خَلَا","وَفِعْلُ أَمْرٍ وَمُضَارِعٌ عَلَا"],["فَابْنِ عَلَى الفَتْحِ المُضِيَّ أَبَدًا","وَالأَمْرُ بِالجَزْمِ لَدَى البَعْضِ ارْتَدَى"],["ثُمَّ المُضَارِعُ الَّذِي فِي صَدْرِهِ","إِحْدَى زَوَائِدِ أَنَيْتَ فَادْرِهِ"],["وَحُكْمُهُ الرَّفْعُ إِذَا يُجَرَّدُ","مِنْ نَاصِبٍ وَجَازِمٍ كَتَسْعَدُ"]],
"alfia":[["فِعْلٌ مُضَارِعٌ يَلِيهِ نَاصِبُ","أَوْ جَازِمٌ أَوْ مَا لَهُ مُلَابِسُ"]],
"qas":[
{"q":"إلى كم قسم ينقسم الفعل؟ وما وجه انحصاره؟","a":"ثلاثة: ماضٍ، ومضارع، وأمر. ووجه الانحصار دليلان: الاستقراء التام، ودليل النظر (الفعل يتعلق بزمن، والأزمنة ثلاثة)."},
{"q":"ما هو الفعل الماضي؟","a":"ما يدل على حصول شيء قبل زمن التكلم. ضرب، نصر، فتح، علم، حسب، كرم."},
{"q":"ما هو الفعل المضارع؟","a":"ما يدل على حصول شيء في زمن التكلم (الحال) أو بعده (المستقبل). وهذا مذهب جمهور النحاة وبه جزم سيبويه."},
{"q":"ما هو فعل الأمر؟","a":"ما يُطلب به حصول شيء بعد زمن التكلم. اضرب، انصر، افتح، اعلم، احسب، أكرم."},
{"q":"مَثِّل لكل قسم من أقسام الفعل بخمسة أمثلة.","a":"الماضي: ﴿فَسَجَدُوا﴾، ﴿أَبَى﴾، ﴿اسْتَكْبَرَ﴾، ﴿كَانَ﴾، ﴿مَكَرَ﴾. المضارع: ﴿يَدْعُونَ﴾، ﴿لَتَدْخُلُنَّ﴾، ﴿يَأْمُرُكُمْ﴾، ﴿تُؤَدُّوا﴾، ﴿تَعْلَمُونَ﴾. الأمر: ﴿فَانتَشِرُوا﴾، ﴿وَابْتَغُوا﴾، ﴿كُلُوا﴾، ﴿وَاشْرَبُوا﴾، ﴿فَامْشُوا﴾."},
{"q":"متى يكون الفعل الماضي مبنيًا على الفتح الظاهر؟","a":"في موضعين: الصحيح الآخر الذي لم يتصل به واو جماعة ولا ضمير رفع متحرك، وكل فعل ماضٍ آخره واو أو ياء (رضي، شقي، سرو، بدو)."},
{"q":"مَثِّل للفتح الظاهر بمثالين لكل موضع.","a":"الموضع الأول: ﴿فَإِذَا بَرِقَ الْبَصَرُ﴾، ﴿تَبَارَكَ اسْمُ رَبِّكَ﴾. الموضع الثاني: ﴿رَضِيَ اللَّهُ عَنْهُمْ﴾، ﴿وَذَرُوا مَا بَقِيَ﴾."},
{"q":"متى يكون الفعل الماضي مبنيًا على فتح مقدر؟","a":"ثلاثة مواضع: إذا كان آخره ألفًا (دعا، سعى)، وإذا اتصل به واو الجماعة (كتبوا)، وإذا اتصل به ضمير رفع متحرك (تاء الفاعل، نون النسوة، نا الفاعلين)."},
{"q":"ما الفرق بين «أكرمنا الرجل» (سكون الميم) و«أكرمَنا الرجل» (فتح الميم)؟","a":"اللفظ: الأول مبني على السكون، الثاني مبني على الفتح. المعنى: في الأول «نا» ضمير رفع (المتكلم هو الفاعل)، والرجل مفعول به. في الثاني «نا» ضمير نصب (وقع عليه الفعل)، والرجل فاعل."},
{"q":"أعرب: تلك الرسل فضلنا. أكرمنا زيد. الرجلان قاما.","a":"تلك: مبتدأ. الرسل: بدل مرفوع. فضلنا: فعل ماضٍ + نا فاعل. — أكرمنا: فعل ماضٍ + نا مفعول به. زيد: فاعل. — الرجلان: مبتدأ مرفوع بالألف. قاما: ماضٍ + ألف فاعل، والجملة خبر."},
{"q":"متى يكون فعل الأمر مبنيًا على السكون الظاهر؟","a":"في موضعين: أن يكون صحيح الآخر ولم يتصل به شيء، وأن تتصل به نون النسوة."},
{"q":"متى يُبنى فعل الأمر على السكون المقدر؟","a":"في موضع واحد: إذا اتصلت به نون التوكيد خفيفة أو ثقيلة. والصواب أنه يُبنى على الفتح لا السكون."},
{"q":"هات فعل أمر مبني على الفتح وأعربه.","a":"افهمنَّ: فعل أمر مبني على الفتح لاتصاله بنون التوكيد. نون التوكيد حرف مبني على الفتح. الفاعل: أنت."},
{"q":"متى يُبنى فعل الأمر على حذف حرف العلة؟ ومتى يُبنى على حذف النون؟","a":"يُبنى على حذف حرف العلة إذا كان آخره حرف علة. ويُبنى على حذف النون إذا اتصل به ألف الاثنين أو ياء المخاطبة أو واو الجماعة."},
{"q":"مَثِّل: فعل أمر بحذف النون (ألف الاثنين)، (واو الجماعة)، (ياء المخاطبة)، (حذف الألف)، (حذف الياء)، (حذف الواو).","a":"الألف: ﴿كُلَا مِنْهَا﴾. الواو: ﴿كُلُوا وَاشْرَبُوا﴾. الياء: ﴿اقْنُتِي لِرَبِّكِ﴾. الألف: «ارْضَ بما قسم الله». الياء: ﴿فَاقْضِ مَا أَنْتَ قَاضٍ﴾. الواو: ﴿وَاعْفُ عَنَّا﴾."},
{"q":"ما هي علامة الفعل المضارع؟","a":"منفصلة: لم، السين، سوف. ومتصلة: أن يكون في أوله إحدى زوائد «أنيت»."},
{"q":"ما المعاني التي تأتي لها همزة المضارعة والنون؟","a":"همزة: للمتكلم مذكرًا أو مؤنثًا. نون: للمتكلم المعظِّم نفسه أو للمتكلم ومعه غيره."},
{"q":"ما حكم الفعل المضارع؟","a":"معرب ما لم تتصل به نون التوكيد أو نون النسوة."},
{"q":"متى يُبنى الفعل المضارع على الفتح؟ وعلى السكون؟","a":"يُبنى على الفتح إذا اتصلت به نون التوكيد. ويُبنى على السكون إذا اتصلت به نون النسوة."},
{"q":"أعرب: نرقد. أخذ. نبع الماء. يبس الثمر. نأكل الخبز. نرى.","a":"نرقد: مضارع مرفوع بالضمة، والفاعل مستتر (نحن). أخذ: ماضٍ مبني على الفتح. نبع: ماضٍ. الماء: فاعل. يبس: ماضٍ. الثمر: فاعل. نأكل: مضارع، والفاعل (نحن). نرى: مضارع بضمة مقدرة (التعذر)."}
]},
{"id":"nawasib","title":"نواصب المضارع",
"matn":"فَالنَّوَاصِبُ عَشَرَةٌ، وَهِيَ: أَنْ، وَلَنْ، وَإِذَنْ، وَكَيْ، وَلَامُ كَيْ، وَلَامُ الجُحُودِ، وَحَتَّى، وَالجَوَابُ بِالفَاءِ، وَالوَاوِ، وَأَوْ.",
"nazm":[["فَنَصْبُهُ بِأَنْ وَلَنْ إِذَنْ وَكَيْ","وَلَامِ كَيْ لَامِ الجُحُودِ يَا أُخَيْ"],["كَذَاكَ حَتَّى وَالجَوَابُ بِالفَا","وَالهَاءِ ثُمَّ أَوْ رُزِقْتَ اللُّطْفَا"]],
"alfia":[["وَنَصْبُهُمْ بِأَنْ وَلَنْ وَكَيْ وَإِذْ","وَلَامِ كَيْ لَامِ الْجُحُودِ يَا أُخَيْ"]],
"qas":[
{"q":"ما الأدوات التي تنصب المضارع بنفسها؟","a":"أن، ولن، وإذن، وكي."},
{"q":"ما معنى «أن» و«لن» و«إذن» و«كي»؟","a":"أن: المصدرية والاستقبال. لن: النفي والاستقبال. إذن: الجواب والجزاء. كي: مصدرية ناصبة بنفسها، أو تعليلية والناصب «أن» مضمرة وجوبًا."},
{"q":"أجب بجملتين في كل واحدة فعل مضارع: ما الذي يؤخرك عن واجبك؟ هل تسافر غدًا؟ كيف تصنع إذا أردت المذاكرة؟ أي الأطعمة تحب؟ أين يسكن خليل؟ في أي متنزه تقضي يوم العطلة؟ من الذي ينفق عليك؟ كم ساعة تقضيها في المذاكرة كل يوم؟","a":"يؤخرني اللعب — لا أجد من يعاونني — سأسافر غدًا — لن أسافر إلا بعد أن أؤدي — أصنع كوبًا من الشاي — أستعين بالله — أحب الحلواء — أحب ما كان النبي لا يحبه — يسكن في شارع الجمهورية — يسكن حيث يعيش أبوه — أقضي يوم العطلة في حديقة الحيوانات — أقضي في الحديقة الدولية — الذي ينفق عليَّ هو أبي — الذي يتكفلني هو أبي — أقضي عشر ساعات — أمكث خمس ساعات."},
{"q":"ضع فعلاً مضارعًا وبيّن موضعه: جئتُ أمس فلم أجدك. يسرني أن ... أحببت عليًّا لأنه ... لن ... أنتما ... خالدًا. زرتكما لكي ... هأنتم هؤلاء ... الواجب. لا تكونوا مخلصين حتى ... أعمالكم.","a":"أزورك (رفع). تزورني (نصب). يصلي (رفع مقدر). أوخر (نصب). تحبان (رفع بثبوت النون). تذهبا (نصب بحذف النون). تكتبون (رفع بثبوت النون). تؤدوا (نصب بحذف النون)."},
{"q":"ما معنى «إذن» في النصب؟ وما شروط نصب المضارع بعدها؟","a":"حرف جواب وجزاء. ويشترط ثلاثة: أن تكون في صدر جملة الجواب، وأن تكون متصلة بالفعل، وأن يكون الفعل دالًّا على الاستقبال."},
{"q":"متى تنصب «أن» مضمرة جوازًا؟ ومتى وجوبًا؟","a":"جوازًا: بعد لام كي. وجوبًا: بعد لام الجحود، وحتى، وفاء السببية، وواو المعية، وأو."},
{"q":"ما ضابط لام الجحود؟","a":"هي التي تأتي بعد ما يفيد النفي في كان ومشتقاتها (ما كان، لم يكن، غير كائن)."},
{"q":"ما معنى «حتى» الناصبة؟","a":"تأتي بمعنيين: بمعنى «كي» (التعليل)، وبمعنى «إلى» (الغاية)."},
{"q":"ما الأمور التسعة التي يجب أن يسبق واحد منها فاء السببية أو واو المعية؟","a":"الأمر، والدعاء، والنهي، والاستفهام، والعرض، والتحضيض، والتمني، والترجي، والنفي."},
{"q":"مثال على إذن مستوفية الشروط وأعربه.","a":"«إذن تنجحَ»: إذن حرف نصب وجواب وجزاء. تنجح: مضارع منصوب بإذن وعلامة نصبه الفتحة، والفاعل أنت."},
{"q":"ما الذي يُغتفر الفصل به بين إذن والمضارع؟","a":"القسم أو «لا» النافية (مذهب ابن هشام)."},
{"q":"«إني إذن أكرمك» — هل ينصب؟","a":"لا، لأن إذن لم تأتِ في صدر جملة الجواب."},
{"q":"«إذن أكرمك الآن» — بالنصب أم بالرفع؟","a":"بالرفع، لأن الفعل دال على الحال لا على الاستقبال بدلالة «الآن»."},
{"q":"أعرب: أحب أن تكتب. لن تنال المجد حتى تلعق الصبر. أسلمتُ كي أدخل الجنة.","a":"أحب: مضارع مرفوع. أن: حرف نصب ومصدر واستقبال. تكتب: منصوب بأن وعلامة نصبه الفتحة، والفاعل أنت. «أن تكتب» في تأويل مصدر مفعول به. — لن: نصب ونفي واستقبال. تنال: منصوب بلن وعلامة نصبه الفتحة. حتى: حرف غاية وجر. تلعق: منصوب بأن مضمرة وجوبًا بعد حتى، وعلامة نصبه الفتحة. — أسلمتُ: فعل وفاعل. كي: مصدر ونصب. أدخل: منصوب بكي وعلامة نصبه الفتحة."},
{"q":"أعرب: جئتُ لأدرس. ما كان الله ليذر المؤمنين حتى يميز الخبيث من الطيب.","a":"لأدرس: اللام لام كي. أدرس: منصوب بأن مضمرة جوازًا بعد لام كي. — ما: نافية. كان: ماضٍ ناقص. الله: اسم كان. ليذر: اللام لام الجحود، ويذر مضارع منصوب بأن مضمرة وجوبًا بعد لام الجحود. المؤمنين: مفعول به. حتى: حرف غاية وجر. يميز: منصوب بأن مضمرة وجوبًا بعد حتى. الخبيث: مفعول به."},
{"q":"ما الفرق بين «لا تذهب فتنام» و«لا تذهب فتنم»؟","a":"في الأول: الفاء للسببية، فتنام منصوب بأن مضمرة وجوبًا، والمعنى: نهي عن الذهاب لأنه سبب النوم. في الثاني: الفاء للعطف، فتنم مجزوم وعلامة جزمه السكون، والمعنى: نهي عن الذهاب والنوم معًا."},
{"q":"ما معنى «أو» في: لأقتلن الكافر أو يسلم. لألزمنك أو تقضيني حقي.","a":"في الأولى: بمعنى «إلا». وفي الثانية: يصح أن تكون بمعنى «كي» أو «إلى» أو «إلا»."},
{"q":"مَثِّل: ألا تزورني فأكرمك. هلا أدبت ولدك فيحترمك. ليت لي مالًا فأنفق. لعل البضائع تكثر فأشتري.","a":"ألا: عرض. تزورني: مضارع. فأكرمك: منصوب بأن مضمرة بعد فاء السببية. — هلا: تحضيض. أدبت: ماضٍ. فيحترمك: منصوب بعد الفاء. — ليت لي مالًا فأنفق: أنفق منصوب بعد فاء السببية (جواب التمني). — لعل البضائع تكثر فأشتري: أشتري منصوب بعد الفاء (جواب الترجي)."}
]},
{"id":"jawazim","title":"جوازم المضارع",
"matn":"وَالجَوَازِمُ ثَمَانِيَةَ عَشَرَ، وَهِيَ: لَمْ، وَلَمَّا، وَأَلَمْ، وَأَلَمَّا، وَلَامُ الأَمْرِ وَالدُّعَاءِ، وَ«لَا» فِي النَّهْيِ وَالدُّعَاءِ، وَإِنْ، وَمَا، وَمَنْ، وَمَهْمَا، وَإِذْمَا، وَأَيُّ، وَمَتَى، وَأَيَّانَ، وَأَيْنَ، وَأَنَّى، وَحَيْثُمَا، وَكَيْفَمَا، وَإِذَا فِي الشِّعْرِ خَاصَّةً.",
"nazm":[["وَجَزْمُهُ إِذَا أَرَدْتَ الجَزْمَا","بِلَمْ وَلَمَّا وَأَلَمْ أَلَمَّا"],["وَلَامِ الأَمْرِ وَالدُّعَاءِ ثُمَّ لَا","فِي النَّهْيِ وَالدُّعَاءِ نِلْتَ الأَمَلَا"],["وَإِنْ وَمَا وَمَنْ وَأَنَّى مَهْمَا","أَيٌّ مَتَى أَيَّانَ أَيْنَ إِذْمَا"],["وَحَيْثُمَا وَكَيْفَمَا ثُمَّ إِذَا","فِي الشِّعْرِ لَا فِي النَّثْرِ فَادْرِ المَأْخَذَا"]],
"alfia":[["وَجَزْمُهُمْ بِلَمْ وَلَمَّا وَأَلَمْ","وَلَامِ كَيْ لَامِ الْجُحُودِ يَا أُخَيْ"]],
"qas":[
{"q":"إلى كم قسم تنقسم الجوازم؟","a":"قسمان: ما يجزم فعلًا واحدًا، وما يجزم فعلين."},
{"q":"ما الجوازم التي تجزم فعلًا واحدًا؟","a":"ستة: لم، ولما، وألم، وألما، ولام الأمر والدعاء، و«لا» في النهي والدعاء."},
{"q":"ما الجوازم التي تجزم فعلين؟","a":"اثنا عشر: إن، ما، مهما، إذما، أي، متى، أين، أنى، أيان، حيثما، كيفما، من."},
{"q":"بيِّن الأسماء والحروف من الجوازم.","a":"حرف بالاتفاق: إن. متفق على اسميته تسعة: من، ما، أي، متى، أيان، أين، أنى، حيثما، كيفما. مختلف فيه والأصح حرف: إذما. مختلف فيه والأصح اسم: مهما."}
]},
{"id":"marfuat","title":"مرفوعات الأسماء",
"matn":"المَرْفُوعَاتُ سَبْعَةٌ: الفَاعِلُ، وَالمَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ، وَالمُبْتَدَأُ، وَخَبَرُهُ، وَاسْمُ كَانَ وَأَخَوَاتِهَا، وَخَبَرُ إِنَّ وَأَخَوَاتِهَا، وَالتَّابِعُ لِلْمَرْفُوعِ.",
"nazm":[],
"alfia":[["وَالمَرْفُوعَاتُ سَبْعَةٌ: فَاعِلٌ وَمَفْعُولٌ لَمْ يُسَمَّ فَاعِلُهْ"]],
"qas":[
{"q":"في كم موضع يكون الاسم مرفوعًا؟","a":"سبعة: الفاعل، ونائب الفاعل، والمبتدأ، والخبر، واسم كان، وخبر إن، وتابع المرفوع."},
{"q":"ما أنواع التوابع؟","a":"أربعة: النعت، والعطف، والتوكيد، والبدل."},
{"q":"إذا اجتمعت التوابع فما ترتيبها؟","a":"النعت، ثم عطف البيان، ثم التوكيد، ثم البدل، ثم عطف النسق. مثال: جاء الرجلُ الفاضلُ عمرُ نفسُه أخوك وعمرو."},
{"q":"أعرب: إبراهيم مخلص. كان ربك قديرًا. إن الله سميع الدعاء.","a":"إبراهيم: مبتدأ. مخلص: خبر. — كان: ماضٍ ناقص. ربك: اسم كان مرفوع. قديرًا: خبر كان منصوب. — إن: توكيد ونصب. الله: اسم إن منصوب. سميع: خبر إن مرفوع، وسميع مضاف. الدعاء: مضاف إليه."}
]},
{"id":"fail","title":"الفاعل",
"matn":"الفَاعِلُ هُوَ الاسْمُ المَرْفُوعُ المَذْكُورُ قَبْلَهُ فِعْلُهُ.",
"nazm":[["الفَاعِلَ ارْفَعْ وَهْوَ مَا قَدْ أُسْنِدَا","إِلَيْهِ فِعْلٌ قَبْلَهُ قَدْ وُجِدَا"],["وَظَاهِرًا يَأْتِي وَيَأْتِي مُضْمَرًا","كَأَصْطَادَ زَيْدٌ وَأَشْتَرَيْتُ أَعْفَرَا"]],
"alfia":[["وَالْفَاعِلُ الَّذِي كَفِعْلٍ أُسْنِدَا","وَقَدْ يَكُونُ ظَاهِرًا وَمُضْمَرَا"]],
"qas":[
{"q":"ما هو الفاعل لغة واصطلاحًا؟","a":"لغةً: من قام به الفعل. اصطلاحًا: الاسم المرفوع المذكور قبله فعله."},
{"q":"هل يكون الفعل أو الحرف فاعلًا؟","a":"لا؛ لأن الفاعل هو الاسم."},
{"q":"هل يمكن أن يكون الفاعل منصوبًا؟","a":"لا؛ لأن الفاعل هو الاسم المرفوع. إلا على لغة قليلة."},
{"q":"هل يمكن أن يتقدم الفاعل على الفعل؟","a":"لا؛ لأن الفاعل هو المذكور قبله فعله. فإن تقدم كان مبتدأً."},
{"q":"إلى كم قسم ينقسم الفاعل؟","a":"ظاهر ومضمر. والمضمر: متصل ومنفصل."},
{"q":"اجعل فاعلاً في جملتين (فعل ماضٍ ومضارع): أبوك، صديقك، التجار، المخلصون، ابني، الأستاذ، الشجرة، الربيع، الحصان.","a":"جاء أبوك — يصلي أبوك. أكل صديقك التفاحة — يشرب صديقك اللبن. ذهب التجار — يذهب التجار إلى السوق. أحب المخلصون ربهم — يصلي المخلصون لربهم. صلى ابني — يأكل ابني. حضر الأستاذ — يشرح الأستاذ. أثمرت الشجرة — تسقط الشجرة أوراقها. جاء الربيع — يجيء الربيع بالخير. وقع الحصان — يجر الحصان العربة."},
{"q":"هات مع كل فعل اسمين فاعلاً: حضر، اشترى، يربح، ينجو، نجح، أدى، أثمرت، أقبل، صهل.","a":"حضر الخطيب / حضر أحمد. اشترى الرجل / اشترى محمد. يربح المسلم / يربح التاجر. ينجو الكافر لن ينجو / ينجو المسلم. نجح أحمد / نجح الإسلام. أدى محمد / أدى إسماعيل. أثمرت الشجرة / أثمرت تقوى الله الجنة. أقبل التلميذ / أقبل الشتاء. صهل الفرس / صهل الحصان."},
{"q":"أجب بجملة فيها فعل وفاعل: متى تسافر؟ أين يذهب صاحبك؟ هل حضر أخوك؟ كيف وجدت الكتاب؟ ماذا تصنع؟ متى ألقاك؟ أيان تقضي فصل الصيف؟ ما الذي تدرسه؟","a":"أسافر غدًا — يذهب صاحبي إلى المسجد — نعم حضر أخي — وجدتُ الكتاب قديمًا — أصنع مكتبًا — تلقاني في المسجد بعد العصر — أقضي في مكة والمدينة — أدرس النحو."},
{"q":"كوِّن جملة من: نجح المجتهد. فاز المخلص والتاجر. فاض النيل. أينع الزهر.","a":"نجح المجتهد — فاز المخلص والتاجر — فاض النيل — أينع الزهر."},
{"q":"أعرب: حضر محمد. سافر المرتضى. سيزورنا القاضي. أقبل أخي.","a":"حضر: ماضٍ. محمد: فاعل مرفوع. — سافر: ماضٍ. المرتضى: فاعل مرفوع بضمة مقدرة (تعذر). — سيزورنا: السين للتنفيس + يزور مضارع مرفوع + نا مفعول به. القاضي: فاعل بضمة مقدرة (ثقل). — أقبل: ماضٍ. أخي: فاعل بضمة مقدرة (مناسبة)."},
{"q":"هل يمكن أن يكون الفاعل منصوبًا؟","a":"لا؛ لأن المؤلف يقول: هو الاسم المرفوع. إلا في لغة «خرق الثوبُ المشمارَ»."},
{"q":"ما هو الصواب: قام زيد (بجر) أم قام زيد (برفع)؟","a":"الصواب: قام زيدٌ، برفع زيدٍ لأن الفاعل لا بد أن يكون مرفوعًا. ويجوز جر الفاعل بحرف الجر الزائد: ﴿مَا جَاءَنَا مِنْ بَشِيرٍ﴾."},
{"q":"هل يمكن أن يتقدم الفاعل على الفعل؟","a":"لا. مثاله: جاء زيد. فإن تقدم كان مبتدأً لا فاعلًا."},
{"q":"مَثِّل: الفاعل الصريح، الفاعل المؤول بالصريح، الفاعل المرفوع باسم فعل، الفاعل المرفوع باسم فاعل.","a":"الصريح: «نوح» في ﴿قَالَ نُوحٌ﴾، «إبراهيم» في ﴿يَرْفَعُ إِبْرَاهِيمُ﴾. المؤول بالصريح: ﴿أَوَلَمْ يَكْفِهِمْ أَنَّا أَنْزَلْنَا﴾ — «أنَّا أنزلنا» في تأويل مصدر فاعل «يكفيهم». وباسم فعل: «هيهات العقيق» — العقيق فاعل باسم الفعل «هيهات». و«شتان زيد وعمرو». وباسم فاعل: «أقادم أبوك» — أبوك فاعل باسم الفاعل «قادم». «ما نافع البخلُ صاحبه»."},
{"q":"إلى كم قسم ينقسم الفاعل؟ ما هو الظاهر؟ ما هو المضمر؟","a":"ظاهر: ما دلّ على مسماه بدون قرينة. مضمر: ما دلّ على مسماه بقرينة تكلم أو خطاب أو غيبة. والمضمر: متصل (لا يبتدأ به ولا يقع بعد إلا) ومنفصل (يبتدأ به ويقع بعد إلا)."},
{"q":"على كم نوع يتنوع الضمير المتصل؟ مَثِّل لكل نوع.","a":"اثنا عشر: للمتكلم الواحد (ضربتُ)، للمتكلم المتعدد (ضربنا)، للمخاطب المفرد المذكر (ضربتَ)، للمخاطبة المفردة المؤنثة (ضربتِ)، للمثنى المخاطب (ضربتما)، لجمع الذكور المخاطبين (ضربتم)، لجمع الإناث المخاطبات (ضربتنَّ)، للمفرد الغائب (ضربَ)، للمفردة المؤنثة (ضربتْ)، للمثنى الغائب (ضربا)، لجمع الذكور الغائبين (ضربوا)، لجمع الإناث (ضربنَ)."},
{"q":"مَثِّل للضمير المنفصل الواقع فاعلًا باثني عشر مثالًا.","a":"ما يضرب إلا أنا — نحن — أنتَ — أنتِ — أنتما — أنتم — أنتنَّ — هو — هي — هما — هم — هنَّ."},
{"q":"أعرب: كتب محمود درسه. اشترى علي كتابًا. يا قومنا أجيبوا داعي الله. ﴿مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ﴾. قام الرجلان.","a":"كتب: ماضٍ. محمود: فاعل مرفوع. درسه: مفعول به منصوب، ودرس مضاف، والهاء مضاف إليه. — اشترى: ماضٍ. علي: فاعل. كتابًا: مفعول به. — يا: نداء. قومنا: منادى منصوب، وقوم مضاف، ونا مضاف إليه. أجيبوا: أمر مبني على حذف النون، والواو فاعل. داعي: مفعول به منصوب، وداعي مضاف. الله: مضاف إليه. — من: شرط جازم مبتدأ. عمل: ماضٍ في محل جزم. صالحًا: مفعول به. فلنفسه: الفاء جواب الشرط، والجار والمجرور خبر لمبتدأ محذوف. — قام: ماضٍ. الرجلان: فاعل مرفوع بالألف."}
]},
{"id":"naib-fail","title":"النائب عن الفاعل",
"matn":"المَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ هُوَ الاسْمُ المَرْفُوعُ الَّذِي لَمْ يُذْكَرْ مَعَهُ فَاعِلُهُ. فَإِنْ كَانَ الفِعْلُ مَاضِيًا ضُمَّ أَوَّلُهُ وَكُسِرَ مَا قَبْلَ آخِرِهِ، وَإِنْ كَانَ مُضَارِعًا ضُمَّ أَوَّلُهُ وَفُتِحَ مَا قَبْلَ آخِرِهِ.",
